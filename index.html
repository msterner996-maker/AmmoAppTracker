  if (!S.firearms.length || !S.ammo.length) { toast("Add a firearm and an ammunition line first."); return; }
  EDIT_ENTRY = entryId || null;
  const e = entryId ? byId(t.entries, entryId) : null;
  const base = override || (e
    ? { firearmId: e.firearmId, ammoId: e.ammoId,
        broughtBoxed: int(e.broughtBoxed), broughtLoose: int(e.broughtLoose),
        chosen: (e.mags || []).map((g) => g.magLoadId) }
    : { firearmId: S.firearms[0].id, ammoId: null, broughtBoxed: 0, broughtLoose: 0, chosen: [] });

  const f = gun(base.firearmId);
  const cal = f ? f.caliber : "";
  let pool = AR_CALS.includes(cal)
    ? S.ammo.filter((a) => AR_CALS.includes(a.caliber))
    : S.ammo.filter((a) => a.caliber === cal);
  if (!pool.length) pool = S.ammo;
  let aid = base.ammoId;
  if (!pool.some((a) => a.id === aid)) aid = pool[0] && pool[0].id;
  const a = ammoOf(aid);

  const buckets = magBuckets(entryCandidates(entryId, aid));
  const chosen = new Set(base.chosen || []);
  const packedRounds = buckets.reduce((sum, b) => {
    const k = b.loads.filter((x) => chosen.has(x)).length;
    return sum + k * b.rounds;
  }, 0);

  openSheet(entryId ? "Edit line" : "Add a line", `
    <label class="f"><span>Firearm</span>
      <select name="firearmId" data-act-change="entry-reload">${selOptsGrouped(
        S.firearms, base.firearmId, (x) => x.name, (x) => x.caliber || "Caliber not set")}</select></label>
    <label class="f"><span>Ammunition</span>
      <select name="ammoId" data-act-change="entry-reload">${selOptsGrouped(
        pool, aid, ammoLabel, (x) => x.caliber)}</select></label>
    <p class="hint" style="margin:-4px 0 12px">${a ? `${fmt(a.qtyBoxed)} boxed, ${fmt(a.qtyLoose)} loose on the shelf.` : ""}</p>

    <fieldset><legend>Loose and boxed to bring</legend><div class="f2">
      <label class="f"><span>Boxed</span>${stepper("broughtBoxed", base.broughtBoxed)}</label>
      <label class="f"><span>Loose</span>${stepper("broughtLoose", base.broughtLoose)}</label>
    </div></fieldset>

    <fieldset><legend>Loaded magazines to bring${packedRounds ? ` \u2014 ${fmt(packedRounds)} rounds` : ""}</legend>
      ${buckets.length ? buckets.map((b) => {
        const m = b.magTypeId ? magType(b.magTypeId) : null;
        const sel = b.loads.filter((x) => chosen.has(x)).length;
        return `<div class="bucket">
          <div class="top">
            <b>${esc(m ? magLabel(m) : "Unassigned magazines")}</b>
            <span class="avail">${fmt(b.rounds)} rounds each</span>
          </div>
          <div class="ctl">
            ${stepper("bk_" + b.key, sel, 0)}
            <span class="of">of ${plural(b.loads.length, "mag")} loaded</span>
          </div>
          ${m ? "" : `<div class="hint" style="margin:6px 0 0">Carried over from the
            spreadsheet with no magazine type. <button class="linkbtn"
            data-act="mag-split" data-id="${esc(b.loads[0])}">Split into real magazines</button></div>`}
        </div>`;
      }).join("") : `<p class="hint" style="margin:0">No magazines are loaded with this ammunition.
        Load some from the Mags tab, or just bring boxed and loose rounds.</p>`}
    </fieldset>

    <button class="btn pri wide" data-act="entry-save" data-id="${esc(entryId || "")}">${entryId ? "Save line" : "Add line"}</button>
    ${entryId ? `<button class="btn dgr wide" style="margin-top:8px" data-act="entry-del" data-id="${esc(entryId)}">Remove line</button>` : ""}`);
}

/* Turn the bucket counts back into specific magazine records. */
function readChosenMags(entryId, ammoId, v) {
  const out = [];
  magBuckets(entryCandidates(entryId, ammoId)).forEach((b) => {
    const want = Math.min(int(v["bk_" + b.key]), b.loads.length);
    for (let i = 0; i < want; i++) out.push(b.loads[i]);
  });
  return out;
}

ACT["entry-reload"] = () => {
  const v = readForm($("#sheetbody"));
  entryForm(EDIT_ENTRY, {
    firearmId: v.firearmId, ammoId: v.ammoId,
    broughtBoxed: int(v.broughtBoxed), broughtLoose: int(v.broughtLoose),
    chosen: readChosenMags(EDIT_ENTRY, v.ammoId, v),
  });
};

ACT["entry-save"] = (entryId) => {
  const t = openTrip();
  const v = readForm($("#sheetbody"));
  const mags = readChosenMags(entryId || null, v.ammoId, v)
    .map((mlid) => {
      const l = byId(S.magLoads, mlid);
      return l ? { magLoadId: l.id, magTypeId: l.magTypeId,
        roundsOut: int(l.rounds), roundsBack: int(l.rounds) } : null;
    }).filter(Boolean);

  if (!int(v.broughtBoxed) && !int(v.broughtLoose) && !mags.length) {
    toast("Bring something: boxed, loose, or a loaded magazine."); return;
  }
  const a = ammoOf(v.ammoId);
  if (int(v.broughtBoxed) > int(a.qtyBoxed)) { toast(`Only ${fmt(a.qtyBoxed)} boxed on the shelf.`); return; }
  if (int(v.broughtLoose) > int(a.qtyLoose)) { toast(`Only ${fmt(a.qtyLoose)} loose on the shelf.`); return; }

  snapshot(entryId ? "edit packing line" : "pack a line");
  const e = entryId ? byId(t.entries, entryId) : { id: uid("e") };
  Object.assign(e, {
    firearmId: v.firearmId, ammoId: v.ammoId,
    broughtBoxed: int(v.broughtBoxed), broughtLoose: int(v.broughtLoose),
    returnedBoxed: Math.min(e.returnedBoxed == null ? int(v.broughtBoxed) : int(e.returnedBoxed), int(v.broughtBoxed)),
    returnedLoose: Math.min(e.returnedLoose == null ? int(v.broughtLoose) : int(e.returnedLoose), int(v.broughtLoose)),
    mags,
  });
  if (!entryId) t.entries.push(e);
  commit(entryId ? "Line saved." : `Line packed: ${fmt(tripBrought(e))} rounds.`); closeSheet();
};

ACT["entry-del"] = (entryId) => {
  const t = openTrip();
  snapshot("remove packing line");
  t.entries = t.entries.filter((x) => x.id !== entryId);
  commit("Line removed."); closeSheet();
};

/* ---------------- closeout ---------------- */
ACT["trip-closeout"] = () => {
  const t = openTrip();
  if (!t) { toast("No trip is open."); return; }
  if (!t.entries.length) { toast("Pack at least one line first."); return; }
  RANGEMODE = "closeout"; go("range");
};
ACT["closeout-back"] = () => { RANGEMODE = "trip"; render(); };

function rangeCloseout(t) {
  const grand = t.entries.reduce((s, e) => s + tripEntryFired(e).total, 0);
  let h = `<section class="blk"><div class="card">
    <h2>What came back</h2>
    <p class="hint" style="margin:3px 0 0">${esc(t.location || "Range trip")} &middot; ${esc(t.date)}</p>
    <div class="counter" style="margin-top:8px"><span class="big" id="grandfired">${fmt(grand)}</span>
      <span class="unit">rounds fired</span></div>
    <p class="hint" style="margin:10px 0 0">Enter what you brought home. Everything left over
      counts as fired and gets deducted when you close out.</p>
    </div></section>`;

  h += t.entries.map((e) => {
    const f = gun(e.firearmId), a = ammoOf(e.ammoId);
    const fd = tripEntryFired(e);
    return `<section class="blk"><div class="card">
      <h3>${esc(f ? f.name : "Firearm missing")}</h3>
      <p class="hint" style="margin:2px 0 12px">${esc(a ? ammoFull(a) : "ammo missing")}
        &middot; packed ${fmt(tripBrought(e))}</p>

      ${(int(e.broughtBoxed) || int(e.broughtLoose)) ? `<div class="f2">
        ${int(e.broughtBoxed) ? `<label class="f"><span>Boxed back (took ${fmt(e.broughtBoxed)})</span>
          <input type="number" inputmode="numeric" data-e="${esc(e.id)}" data-k="returnedBoxed"
            value="${int(e.returnedBoxed)}" min="0"></label>` : ""}
        ${int(e.broughtLoose) ? `<label class="f"><span>Loose back (took ${fmt(e.broughtLoose)})</span>
          <input type="number" inputmode="numeric" data-e="${esc(e.id)}" data-k="returnedLoose"
            value="${int(e.returnedLoose)}" min="0"></label>` : ""}
      </div>` : ""}

      ${(e.mags || []).length ? `<fieldset><legend>Rounds left in each magazine</legend>
        ${e.mags.map((g, i) => {
          const m = magType(g.magTypeId);
          return `<div style="padding:10px 0;border-top:1px solid var(--rule-2)">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
              <b style="font-weight:550;font-size:0.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(magLabel(m))}</b>
              <span class="num" style="color:var(--ink-2);font-size:0.75rem;flex:none">took ${fmt(g.roundsOut)}</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:7px">
              <button class="btn sm" data-act="co-set" data-id="${esc(e.id)}" data-v="${i}:0">Empty</button>
              <button class="btn sm" data-act="co-set" data-id="${esc(e.id)}" data-v="${i}:full">Untouched</button>
              <input type="number" inputmode="numeric" style="flex:1;min-width:64px;text-align:center;min-height:34px;padding:4px 8px"
                data-e="${esc(e.id)}" data-mag="${i}" value="${int(g.roundsBack)}" min="0" max="${int(g.roundsOut)}"
                aria-label="Rounds left in ${esc(magLabel(m))}">
            </div></div>`;
        }).join("")}
        <div class="btnrow" style="margin-top:10px">
          <button class="btn sm" data-act="co-all" data-id="${esc(e.id)}" data-v="0">All empty</button>
          <button class="btn sm" data-act="co-all" data-id="${esc(e.id)}" data-v="full">All untouched</button>
        </div></fieldset>` : ""}

      <div class="split-nums" id="fired-${esc(e.id)}">
        <div><span>From mags</span><b>${fmt(fd.mags)}</b></div>
        <div><span>Loose/boxed</span><b>${fmt(fd.loose)}</b></div>
        <div><span>Fired</span><b>${fmt(fd.total)}</b></div>
        <div><span>New total</span><b>${fmt(int(f ? f.receiverRounds : 0) + fd.total)}</b></div>
      </div>
    </div></section>`;
  }).join("");

  h += `<section class="blk">
    <button class="btn pri wide" data-act="closeout-go">Close out trip</button>
    <button class="btn wide" style="margin-top:8px" data-act="closeout-back">Back to packing</button>
    <p class="hint" style="margin-top:10px">Closing out deducts fired rounds from stock, updates
      each magazine, and adds the rounds to every counter on the firearms involved. One tap of
      undo reverses all of it.</p></section>`;
  return h;
}

ACT["co-set"] = (entryId, v) => {
  const t = openTrip(); const e = byId(t.entries, entryId);
  const [i, what] = String(v).split(":");
  const g = e.mags[int(i)];
  g.roundsBack = what === "full" ? int(g.roundsOut) : 0;
  save(); render();
};
ACT["co-all"] = (entryId, v) => {
  const t = openTrip(); const e = byId(t.entries, entryId);
  e.mags.forEach((g) => { g.roundsBack = v === "full" ? int(g.roundsOut) : 0; });
  save(); render();
};

/* live edits during closeout, without redrawing the field being typed in */
let coSaveT = null;
function coEdit(el) {
  const t = openTrip(); if (!t) return;
  const e = byId(t.entries, el.dataset.e); if (!e) return;
  if (el.dataset.mag != null) {
    const g = e.mags[int(el.dataset.mag)];
    let val = int(el.value);
    if (val > int(g.roundsOut)) { val = int(g.roundsOut); el.value = val; }
    if (val < 0) { val = 0; el.value = 0; }
    g.roundsBack = val;
  } else {
    const k = el.dataset.k;
    const cap = k === "returnedBoxed" ? int(e.broughtBoxed) : int(e.broughtLoose);
    let val = int(el.value);
    if (val < 0) { val = 0; el.value = 0; }
    if (val > cap) { val = cap; el.value = cap; }
    e[k] = val;
  }
  const fd = tripEntryFired(e);
  const f = gun(e.firearmId);
  const box = $("#fired-" + e.id);
  if (box) {
    const bs = $$("b", box);
    bs[0].textContent = fmt(fd.mags);
    bs[1].textContent = fmt(fd.loose);
    bs[2].textContent = fmt(fd.total);
    bs[3].textContent = fmt(int(f ? f.receiverRounds : 0) + fd.total);
  }
  const g = $("#grandfired");
  if (g) g.textContent = fmt(t.entries.reduce((s, x) => s + tripEntryFired(x).total, 0));
  DIRTY = true;
  clearTimeout(coSaveT);
  coSaveT = setTimeout(save, 500);
}

/* The transaction. Everything the spreadsheet did with four manual pastes. */
ACT["closeout-go"] = () => {
  const t = openTrip();
  if (!t) return;

  // Validate before touching anything.
  const problems = [];
  const dBoxed = {}, dLoose = {};
  t.entries.forEach((e) => {
    const a = ammoOf(e.ammoId), f = gun(e.firearmId);
    if (!a) { problems.push("An ammunition line on this trip has been deleted."); return; }
    if (!f) { problems.push("A firearm on this trip has been deleted."); return; }
    dBoxed[a.id] = (dBoxed[a.id] || 0) + int(e.broughtBoxed) - int(e.returnedBoxed);
    dLoose[a.id] = (dLoose[a.id] || 0) + int(e.broughtLoose) - int(e.returnedLoose);
  });
  Object.keys(dBoxed).forEach((id) => {
    const a = ammoOf(id);
    if (int(a.qtyBoxed) - dBoxed[id] < 0)
      problems.push(`${ammoLabel(a)}: boxed would go below zero. Check the boxed figures.`);
    if (int(a.qtyLoose) - dLoose[id] < 0)
      problems.push(`${ammoLabel(a)}: loose would go below zero. Check the loose figures.`);
  });
  if (problems.length) {
    openSheet("Cannot close out yet", `<div class="note flag">${problems.map(esc).join("<br><br>")}</div>
      <button class="btn wide" data-act="sheet-close">Go back and fix</button>`);
    return;
  }

  const fired = t.entries.reduce((s, e) => s + tripEntryFired(e).total, 0);
  if (!confirm(`Close out with ${fmt(fired)} rounds fired? Stock, magazines and round counts all update.`)) return;

  snapshot(`closeout, ${t.location || t.date}`);

  t.entries.forEach((e) => {
    const a = ammoOf(e.ammoId), f = gun(e.firearmId);
    const fd = tripEntryFired(e);
    a.qtyBoxed = int(a.qtyBoxed) - (int(e.broughtBoxed) - int(e.returnedBoxed));
    a.qtyLoose = int(a.qtyLoose) - (int(e.broughtLoose) - int(e.returnedLoose));
    (e.mags || []).forEach((g) => {
      const l = byId(S.magLoads, g.magLoadId);
      if (!l) return;
      if (int(g.roundsBack) <= 0) S.magLoads = S.magLoads.filter((x) => x.id !== l.id);
      else l.rounds = int(g.roundsBack);
    });
    bumpGun(f, fd.total, t.date);
    e.firedTotal = fd.total; e.firedMags = fd.mags; e.firedLoose = fd.loose;
  });

  t.status = "closed";
  t.closedAt = new Date().toISOString();
  t.firedTotal = fired;
  RANGEMODE = "trip";
  save(); render();
  toast(`Trip closed. ${fmt(fired)} rounds logged.`, "Undo", undoLast);
};

ACT["trip-open"] = (id) => {
  const t = byId(S.trips, id);
  if (!t) return;
  let h = `<dl class="card">
    <div class="kv"><dt>Date</dt><dd style="font-family:var(--sans)">${esc(t.date)}</dd></div>
    <div class="kv"><dt>Rounds fired</dt><dd>${fmt(t.firedTotal || 0)}</dd></div>
    <div class="kv"><dt>Lines</dt><dd>${fmt(t.entries.length)}</dd></div></dl>`;
  if (t.notes) h += `<div class="note" style="margin-top:12px">${esc(t.notes)}</div>`;
  h += `<fieldset style="margin-top:12px"><legend>Detail</legend>` + t.entries.map((e) => {
    const f = gun(e.firearmId), a = ammoOf(e.ammoId);
    return `<div style="padding:9px 0;border-top:1px solid var(--rule-2)">
      <b style="font-weight:550;font-size:0.9375rem">${esc(f ? f.name : "Firearm removed")}</b>
      <span class="num" style="float:right;font-weight:550">${fmt(e.firedTotal || 0)}</span>
      <div class="hint" style="margin:0">${esc(a ? ammoLabel(a) : "ammo removed")}
        &middot; ${fmt(e.firedMags || 0)} from mags, ${fmt(e.firedLoose || 0)} loose or boxed</div></div>`;
  }).join("") + `</fieldset>`;
  openSheet(t.location || "Range trip", h);
};
</script>
<script>
"use strict";
/* ==========================================================================
   OneDrive sync.

   The whole log is one JSON file in this app's own OneDrive folder
   (Apps/Armory/armory.json). The app cannot see anything else in your drive.

   Auth is OAuth 2.0 authorization code flow with PKCE, spoken directly to
   the consumer endpoint. No MSAL: the library is around 200 KB from a CDN,
   which would break the promise that this app opens with no network.

   Conflicts are never resolved silently. Each save bumps a revision counter,
   and the copy on OneDrive carries the revision it was written at. If the
   remote revision moved on while this device also had unsaved changes, the
   app stops and asks.
   ========================================================================== */

const CID_KEY = "armory.clientId";
const TOK_KEY = "armory.tokens";
const SYNC_KEY = "armory.sync";
const PKCE_KEY = "armory.pkce";
const AUTH_BASE = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = "openid profile offline_access Files.ReadWrite.AppFolder";
const REMOTE_FILE = "armory.json";
const ITEM = `${GRAPH}/me/drive/special/approot:/${REMOTE_FILE}`;

let SYNCING = false;
let PUSH_T = null;
let CONFLICT = null;   // { local, remote, eTag }
let LAST_CHECK = 0;

/* ------------------------------------------------------------- small io */
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

const clientId = () => { try { return localStorage.getItem(CID_KEY) || ""; } catch (e) { return ""; } };
const redirectUri = () => location.origin + location.pathname;
const canSync = () => location.protocol === "https:" || location.hostname === "localhost";

function syncMeta() { return lsGet(SYNC_KEY) || {}; }
function setSyncMeta(patch) { lsSet(SYNC_KEY, Object.assign(syncMeta(), patch)); }
function syncErr(msg) { setSyncMeta({ error: msg || null, at: Date.now() }); }

/* Local edits exist that OneDrive has not seen. */
function dirty() { return int(S.rev) !== int(syncMeta().rev); }
function linked() { return !!lsGet(TOK_KEY); }

/* Only a starting guess; the name is editable and stays on this device. Requires
   both a coarse pointer and a plausible screen size, since either alone misfires. */
function defaultDeviceName() {
  const short = (screen && screen.width && screen.height)
    ? Math.min(screen.width, screen.height) : 0;
  const coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  if (coarse && short && short < 500) return "Phone";
  if (coarse && short && short < 900) return "Tablet";
  return "Computer";
}

/* ------------------------------------------------------------- PKCE */
function b64url(buf) {
  let s = "";
  new Uint8Array(buf).forEach((b) => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randStr(bytes) {
  const a = new Uint8Array(bytes);
  crypto.getRandomValues(a);
  return b64url(a);
}
async function challengeFor(verifier) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return b64url(d);
}

async function signIn() {
  if (!canSync()) { toast("Sync needs the app served over https."); return; }
  if (!clientId()) { toast("Add your client ID first."); return; }
  const verifier = randStr(48), state = randStr(12);
  lsSet(PKCE_KEY, { verifier, state });
  const u = new URL(AUTH_BASE + "/authorize");
  const p = {
    client_id: clientId(), response_type: "code", redirect_uri: redirectUri(),
    scope: SCOPES, code_challenge: await challengeFor(verifier),
    code_challenge_method: "S256", state, prompt: "select_account",
  };
  Object.keys(p).forEach((k) => u.searchParams.set(k, p[k]));
  location.assign(u.toString());
}

async function tokenRequest(extra) {
  const body = new URLSearchParams(Object.assign({ client_id: clientId() }, extra));
  const res = await fetch(AUTH_BASE + "/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error_description || j.error || "Sign-in failed.");
  const prev = lsGet(TOK_KEY) || {};
  const tok = {
    access: j.access_token,
    refresh: j.refresh_token || prev.refresh,
    exp: Date.now() + (int(j.expires_in) || 3600) * 1000,
    who: prev.who || null,
  };
  if (j.id_token) {
    try {
      const claims = JSON.parse(atob(j.id_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      tok.who = claims.preferred_username || claims.email || claims.name || null;
    } catch (e) {}
  }
  lsSet(TOK_KEY, tok);
  return tok;
}

function cleanUrl() {
  try { history.replaceState({}, "", redirectUri()); } catch (e) {}
}

/* Handle the redirect back from Microsoft. Returns true if we just linked. */
async function handleAuthRedirect() {
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    syncErr(q.get("error_description") || q.get("error"));
    cleanUrl();
    return false;
  }
  const code = q.get("code");
  if (!code) return false;
  const pk = lsGet(PKCE_KEY);
  const state = q.get("state");
  cleanUrl();
  lsDel(PKCE_KEY);
  if (!pk || state !== pk.state) { syncErr("Sign-in did not match this device. Try again."); return false; }
  try {
    await tokenRequest({
      grant_type: "authorization_code", code,
      redirect_uri: redirectUri(), code_verifier: pk.verifier,
    });
    syncErr(null);
    return true;
  } catch (e) { syncErr(e.message); return false; }
}

/* A single-page app's refresh token is fixed at 24 hours and cannot be
   extended, so an expired one is normal rather than an error. */
async function accessToken() {
  const t = lsGet(TOK_KEY);
  if (!t) return null;
  if (t.exp - Date.now() > 60000) return t.access;
  if (!t.refresh) { syncErr("Sign-in expired. Connect again to resume syncing."); return null; }
  try {
    const nt = await tokenRequest({ grant_type: "refresh_token", refresh_token: t.refresh, scope: SCOPES });
    syncErr(null);
    return nt.access;
  } catch (e) {
    lsDel(TOK_KEY);
    syncErr("Sign-in expired. Connect again to resume syncing.");
    return null;
  }
}

function signOut() {
  lsDel(TOK_KEY); lsDel(SYNC_KEY); lsDel(PKCE_KEY);
  CONFLICT = null;
  toast("Disconnected. Your log stays on this device.");
  render();
}

/* ------------------------------------------------------------- graph */
async function graph(url, opts) {
  const tok = await accessToken();
  if (!tok) return { needsAuth: true };
  const o = Object.assign({ headers: {} }, opts || {});
  o.headers = Object.assign({ Authorization: "Bearer " + tok }, o.headers);
  const res = await fetch(url, o);
  return { res, status: res.status, ok: res.ok };
}

async function remoteMeta() {
  const r = await graph(ITEM);
  if (r.needsAuth) return r;
  if (r.status === 404) return { absent: true };
  if (!r.ok) return { error: `OneDrive returned ${r.status}.` };
  const j = await r.res.json();
  return { eTag: j.eTag, modified: j.lastModifiedDateTime, size: j.size };
}

async function remoteRead() {
  const r = await graph(ITEM + ":/content");
  if (r.needsAuth) return r;
  if (r.status === 404) return { absent: true };
  if (!r.ok) return { error: `Could not read from OneDrive (${r.status}).` };
  try { return { state: await r.res.json() }; }
  catch (e) { return { error: "The file in OneDrive is not readable as a backup." }; }
}

async function remoteWrite(force) {
  S.updatedAt = new Date().toISOString();
  S.deviceName = S.deviceName || defaultDeviceName();
  const headers = { "Content-Type": "application/json" };
  const known = syncMeta().eTag;
  if (known && !force) headers["if-match"] = known;
  const r = await graph(ITEM + ":/content", {
    method: "PUT", headers, body: JSON.stringify(S),
  });
  if (r.needsAuth) return r;
  if (r.status === 412 || r.status === 409) return { stale: true };
  if (!r.ok) return { error: `Could not write to OneDrive (${r.status}).` };
  const j = await r.res.json().catch(() => ({}));
  return { eTag: j.eTag };
}

/* ------------------------------------------------------------- engine */
function adoptRemote(st, eTag) {
  const mine = S.deviceName;
  S = migrate(st);
  S.deviceName = mine || S.deviceName;   // device name is per device, not synced
  save({ noRev: true });
  setSyncMeta({ eTag, rev: int(S.rev), pulled: Date.now(), error: null });
}

async function syncNow(interactive, retry) {
  if (!canSync() || !clientId() || !linked() || CONFLICT) {
    if (interactive && CONFLICT) openConflict();
    return "skipped";
  }
  if (SYNCING) return "busy";
  SYNCING = true;
  if (interactive) render();
  try {
    const meta = await remoteMeta();
    if (meta.needsAuth) return "auth";
    if (meta.error) { syncErr(meta.error); return "error"; }

    /* Nothing on OneDrive yet. */
    if (meta.absent) {
      const w = await remoteWrite(true);
      if (w.needsAuth) return "auth";
      if (w.error) { syncErr(w.error); return "error"; }
      setSyncMeta({ eTag: w.eTag, rev: int(S.rev), pushed: Date.now(), error: null });
      return "pushed";
    }

    const known = syncMeta().eTag;
    const remoteMoved = meta.eTag !== known;

    if (remoteMoved) {
      const rr = await remoteRead();
      if (rr.needsAuth) return "auth";
      if (rr.error) { syncErr(rr.error); return "error"; }
      if (rr.absent) return "error";

      if (!dirty()) {
        adoptRemote(rr.state, meta.eTag);
        render();
        return "pulled";
      }
      /* Both sides moved. Never guess which one wins. */
      CONFLICT = { local: S, remote: rr.state, eTag: meta.eTag };
      syncErr(null);
      render();
      if (interactive) openConflict();
      else toast("Two devices both changed the log.", "Review", openConflict);
      return "conflict";
    }

    if (!dirty()) { setSyncMeta({ checked: Date.now(), error: null }); return "current"; }

    const w = await remoteWrite(false);
    if (w.needsAuth) return "auth";
    if (w.stale) {
      /* Someone wrote between our check and our write. Look again once. */
      if (retry) {
        const rr = await remoteRead();
        CONFLICT = { local: S, remote: rr.state || null, eTag: null };
        render();
        if (interactive) openConflict();
        return "conflict";
      }
      SYNCING = false;
      return syncNow(interactive, true);
    }
    if (w.error) { syncErr(w.error); return "error"; }
    setSyncMeta({ eTag: w.eTag, rev: int(S.rev), pushed: Date.now(), error: null });
    return "pushed";
  } catch (e) {
    syncErr(navigator.onLine === false
      ? "No connection. Your changes are saved here and will sync later."
      : (e.message || "Sync failed."));
    return "error";
  } finally {
    SYNCING = false;
    LAST_CHECK = Date.now();
    if (interactive) render();
  }
}

/* Called from save() on every change that alters the log. */
function queuePush() {
  if (!linked() || CONFLICT) return;
  clearTimeout(PUSH_T);
  PUSH_T = setTimeout(() => { syncNow(false); }, 2500);
}

ACT["sync-now"] = () => { syncNow(true).then((r) => {
  const said = { pushed: "Pushed to OneDrive.", pulled: "Pulled the newer copy.",
    current: "Already up to date.", auth: "Connect again to resume syncing.",
    conflict: "Two versions need a decision." }[r];
  if (said) toast(said);
}); };
ACT["sync-in"] = () => signIn();
ACT["sync-out"] = () => { if (confirm("Disconnect OneDrive? The log stays on this device.")) signOut(); };

ACT["sync-cid"] = () => {
  const v = readForm($("#sheetbody"));
  const id = String(v.cid || "").trim();
  if (!/^[0-9a-f-]{30,40}$/i.test(id)) { toast("That does not look like a client ID."); return; }
  try { localStorage.setItem(CID_KEY, id); } catch (e) {}
  toast("Client ID saved. Now connect OneDrive.");

/* ------------------------------------------------------------- conflict */
function summarise(st) {
  if (!st) return null;
  const rounds = (st.ammo || []).reduce((t, a) =>
    t + int(a.qtyBoxed) + int(a.qtyLoose), 0)
    + (st.magLoads || []).reduce((t, l) => t + int(l.rounds), 0);
  return {
    device: st.deviceName || "Unnamed device",
    when: st.updatedAt ? st.updatedAt.slice(0, 16).replace("T", " ") : "unknown",
    rev: int(st.rev),
    firearms: (st.firearms || []).length,
    rounds,
    trips: (st.trips || []).filter((t) => t.status === "closed").length,
    fired: (st.firearms || []).reduce((t, f) => t + int(f.receiverRounds), 0),
  };
}

function conflictCard(title, s, tag) {
  if (!s) return `<div class="card"><h3>${esc(title)}</h3>
    <p class="hint" style="margin:4px 0 0">Could not be read.</p></div>`;
  return `<div class="card"><h3>${esc(title)} <span class="tag ${tag}">${esc(s.device)}</span></h3>
    <p class="hint" style="margin:4px 0 0">Saved ${esc(s.when)} &middot; revision ${fmt(s.rev)}</p>
    <div class="split-nums">
      <div><span>Firearms</span><b>${fmt(s.firearms)}</b></div>
      <div><span>Rounds</span><b>${fmt(s.rounds)}</b></div>
      <div><span>Trips</span><b>${fmt(s.trips)}</b></div>
      <div><span>Fired</span><b>${fmt(s.fired)}</b></div>
    </div></div>`;
}

function openConflict() {
  if (!CONFLICT) return;
  const a = summarise(CONFLICT.local), b = summarise(CONFLICT.remote);
  openSheet("Two versions to choose from", `
    <div class="note flag">This device and OneDrive both changed since the last sync.
      Merging them automatically would silently drop one set of changes, so pick one.
      Export both first if you are unsure.</div>
    ${conflictCard("On this device", a, "")}
    <div style="height:10px"></div>
    ${conflictCard("On OneDrive", b, "mute")}
    <div class="btnrow" style="margin-top:14px;flex-direction:column">
      <button class="btn pri wide" data-act="conflict-local">Keep this device and overwrite OneDrive</button>
      <button class="btn wide" style="margin-top:8px" data-act="conflict-remote">Take the OneDrive copy and discard local changes</button>
      <button class="btn wide" style="margin-top:8px" data-act="conflict-export">Export both as files first</button>
    </div>`);
}

ACT["conflict-open"] = () => openConflict();

ACT["conflict-local"] = async () => {
  if (!CONFLICT) return;
  if (!confirm("Overwrite the OneDrive copy with this device's version?")) return;
  CONFLICT = null;
  closeSheet();
  const w = await remoteWrite(true);
  if (w.error || w.needsAuth) { syncErr(w.error || "Sign-in expired."); render(); return; }
  setSyncMeta({ eTag: w.eTag, rev: int(S.rev), pushed: Date.now(), error: null });
  render(); toast("OneDrive now matches this device.");
};

ACT["conflict-remote"] = () => {
  if (!CONFLICT || !CONFLICT.remote) return;
  if (!confirm("Discard this device's changes and take the OneDrive copy?")) return;
  snapshot("take the OneDrive copy");
  const { remote, eTag } = CONFLICT;
  CONFLICT = null;
  closeSheet();
  adoptRemote(remote, eTag);
  render(); toast("Took the OneDrive copy. Undo is available.");
};

ACT["conflict-export"] = () => {
  if (!CONFLICT) return;
  download(`armory-thisdevice-${today()}.json`, JSON.stringify(CONFLICT.local, null, 1));
  if (CONFLICT.remote) {
    setTimeout(() => download(`armory-onedrive-${today()}.json`,
      JSON.stringify(CONFLICT.remote, null, 1)), 600);

  toast("Both versions exported. Now pick one.");
};

/* ------------------------------------------------------------- panels */
function syncLine() {
  if (CONFLICT) {
    return `<section class="blk"><div class="card" style="border-color:var(--flag)">
      <h2>Sync needs a decision</h2>
      <p class="hint" style="margin:5px 0 11px">This device and OneDrive both changed.
        Nothing has been overwritten.</p>
      <button class="btn pri wide" data-act="conflict-open">Compare the two versions</button>
    </div></section>`;
  }
  if (!linked()) return "";
  const m = syncMeta();
  const when = m.pushed || m.pulled || m.checked;
  const label = SYNCING ? "Syncing"
    : m.error ? m.error
    : dirty() ? "Changes waiting to sync"
    : when ? "Synced " + agoText(when) : "Connected";
  return `<section class="blk"><button class="btn wide" data-act="sync-now"
    style="justify-content:space-between">
    <span style="font-weight:500;color:${m.error ? "var(--flag)" : "var(--ink-2)"};
      font-size:0.875rem;text-align:left">${esc(label)}</span>
    <span style="color:var(--brass)">${SYNCING ? "" : "Sync now"}</span></button></section>`;
}

function agoText(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function syncPanel() {
  let h = `<section class="blk"><h2>OneDrive sync</h2>`;
  if (!canSync()) {
    h += `<div class="note">Sync needs the app served over https, because the sign-in
      redirect cannot come back to a local file. Host the files and open that address

  if (!clientId()) {

  }
  const m = syncMeta();
  const tok = lsGet(TOK_KEY);
  if (!linked()) {
    h += `<p class="hint">Client ID is saved. Connect your Microsoft account to start

      <button class="btn pri wide" data-act="sync-in">Connect OneDrive</button>

    return h + `</section>`;
  }
  h += `<dl class="card">
    <div class="kv"><dt>Account</dt><dd style="font-family:var(--sans)">${esc(tok.who || "connected")}</dd></div>
    <div class="kv"><dt>This device</dt><dd style="font-family:var(--sans)">${esc(S.deviceName || defaultDeviceName())}</dd></div>
    <div class="kv"><dt>Status</dt><dd style="font-family:var(--sans);color:${m.error ? "var(--flag)" : "var(--ink)"}">${
      esc(SYNCING ? "syncing" : m.error ? m.error : dirty() ? "changes waiting" : "up to date")}</dd></div>
    <div class="kv"><dt>Last push</dt><dd>${m.pushed ? esc(agoText(m.pushed)) : "\u2014"}</dd></div>
    <div class="kv"><dt>Last pull</dt><dd>${m.pulled ? esc(agoText(m.pulled)) : "\u2014"}</dd></div>
    <div class="kv"><dt>Revision</dt><dd>${fmt(S.rev)}</dd></div>
  </dl>
  <div class="btnrow split" style="margin-top:10px">
    <button class="btn pri" data-act="sync-now">Sync now</button>
    <button class="btn" data-act="sync-name">Name device</button>
  </div>
  <button class="btn dgr wide" style="margin-top:8px" data-act="sync-out">Disconnect OneDrive</button>
  <p class="hint" style="margin-top:10px">Changes push a couple of seconds after you make
    them, and the app checks for newer copies when you open or return to it. A browser
    sign-in lasts 24 hours at most, so expect to tap through a sign-in now and then.
    Nothing waits on the network: log a trip with no signal and it syncs when you are back.</p>`;
  return h + `</section>`;
}

<script>
"use strict";
/* ==========================================================================
   Platform quirks.

   Three browsers, three sets of rules:

   Firefox on the desktop runs service workers but will not install a web app,
   so it lives in a tab. Asking for persistent storage shows a permission
   prompt, so it is asked once and the answer remembered.

   Chrome on Android is the good case: installs to the home screen, silent
   persistent storage, no eviction surprises.

   Anything on iOS or iPadOS is WebKit regardless of the icon on it. WebKit
   deletes localStorage, IndexedDB and service worker registrations after
   seven days of browser use without interacting with the site. Home screen
   web apps are exempt, and only Safari can add them. So on the iPad this app
   belongs on the home screen via Safari, not in a Chrome tab.
   ========================================================================== */

const PERSIST_ASKED = "armory.persistAsked";

function plat() {
  const ua = navigator.userAgent || "";
  const iOSish = /iPad|iPhone|iPod/.test(ua)
    || (/Macintosh/.test(ua) && int(navigator.maxTouchPoints) > 1);
  const standalone = navigator.standalone === true
    || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  return {
    ua, iOSish, standalone,
    firefox: /firefox|fxios/i.test(ua),
    chromeIOS: /CriOS/.test(ua),
    android: /Android/.test(ua),
    sw: "serviceWorker" in navigator,
    /* Firefox is the one that puts a prompt in front of the request. */
    promptsForPersist: /firefox/i.test(ua) && !/fxios/i.test(ua),
  };
}

/* WebKit wants this re-requested each launch, Firefox must not be nagged. */
async function requestPersist(force) {
  if (!navigator.storage || !navigator.storage.persist) return null;
  let already = false;
  try { already = await navigator.storage.persisted(); } catch (e) { return null; }
  if (already) return true;
  const p = plat();
  if (p.promptsForPersist && !force) {
    let asked = null;
    try { asked = localStorage.getItem(PERSIST_ASKED); } catch (e) {}
    if (asked) return false;
  }
  try { localStorage.setItem(PERSIST_ASKED, "1"); } catch (e) {}
  try { return await navigator.storage.persist(); } catch (e) { return null; }
}

ACT["persist-ask"] = async () => {
  const r = await requestPersist(true);
  if (r === true) toast("This browser will keep the data.");
  else if (r === null) toast("This browser does not offer a persistence setting.");
  else toast("Request declined. Export backups and keep opening the app.");
  render();
  paintStorage();
};

/* Filled in after render, since both answers are async. */
async function paintStorage() {
  const mode = $("#persistmode");
  if (mode) {
    let p = null;
    try { p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; }
    catch (e) {}
    mode.textContent = p === true ? "persistent" : p === false ? "best effort" : "unknown";
    mode.style.color = p === true ? "var(--moss)" : p === false ? "var(--copper)" : "var(--ink-2)";
  }
  const use = $("#usage");
  if (use && navigator.storage && navigator.storage.estimate) {
    try {
      const e = await navigator.storage.estimate();
      use.textContent = ((e.usage || 0) / 1024).toFixed(0) + " KB";
    } catch (er) { use.textContent = "unknown"; }
  }
}

/* ---------------------------------------------- setup link across devices */
/* The client ID is not a secret: this is a public client using PKCE, and the
   redirect URI is what actually binds the flow. Carrying it in the link means
   setting up the second and third browser is one tap, and recovering from a
   storage wipe does not mean retyping a GUID. */
function setupLink() {
  return clientId() ? redirectUri() + "#cid=" + clientId() : redirectUri();
}

function adoptClientIdFromUrl() {
  const h = String(location.hash || "");
  const m = h.match(/cid=([0-9a-f-]{30,40})/i);
  if (!m) return;
  try {
    if (!localStorage.getItem(CID_KEY)) localStorage.setItem(CID_KEY, m[1]);
  } catch (e) {}
  try { history.replaceState({}, "", redirectUri()); } catch (e) {}
}

ACT["sync-link"] = async () => {
  const url = setupLink();
  let copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      copied = true;
    }
  } catch (e) {}
  openSheet("Set up another device", `
    <p class="hint">Open this link on your other browser or device. It carries the client
      ID, so all you do there is connect your Microsoft account. ${copied
        ? "Already copied to the clipboard." : "Copy it from below."}</p>
    <div class="mono-list" style="word-break:break-all;background:var(--card);
      border:1px solid var(--rule);border-radius:7px;padding:10px;color:var(--ink)">${esc(url)}</div>
    <p class="hint" style="margin-top:12px">The client ID is not a secret. It identifies the
      app, and the registered redirect address is what stops anyone else using it. Your
      account and your data are not in this link.</p>
    <button class="btn wide" style="margin-top:4px" data-act="sheet-close">Done</button>`);
};

/* ---------------------------------------------------------- advice panel */
function platformPanel() {
  const p = plat();
  let head, body, action = "";

  if (p.iOSish && !p.standalone) {
    head = "This iPad browser will delete your data";
    body = `WebKit clears local storage after seven days of browser use without you
      opening this site, and that applies to every browser on iPadOS including Chrome.
      Web apps added to the home screen are exempt. Open this address in <b>Safari</b>,
      then Share and <b>Add to Home Screen</b>, and launch it from that icon. Chrome on
      iPad also cannot run the offline cache.`;
    action = `<p class="hint" style="margin:10px 0 0">With OneDrive sync on, a wipe here
      costs you the sign-in and the client ID rather than the log itself. Keep the setup
      link handy and it is a two-tap recovery.</p>`;
  } else if (p.iOSish && p.standalone) {
    head = "Running from the home screen";
    body = `Good. Home screen web apps are exempt from WebKit's seven-day storage purge,
      and this one keeps its data separate from Safari, so you sign in here once on its
      own.`;
  } else if (p.firefox && !p.android) {
    head = "Firefox on the desktop";
    body = `Everything works here, including the offline cache, but Firefox does not
      install web apps, so keep it as a pinned tab or a bookmark rather than looking for
      an install button. One thing to check: if you have Firefox set to clear cookies and
      site data on exit, it takes this log with it. Add an exception for this site, or
      lean on OneDrive sync and backups.`;
  } else if (p.android) {
    head = "Chrome on Android";
    body = `The best case of the three. Use the menu and <b>Install app</b> or <b>Add to
      Home screen</b> for a full-screen icon, offline caching, and storage the browser is
      far less willing to clear.`;
  } else {
    head = "This browser";
    body = `Storage and offline caching behave normally here. Install to the home screen
      or desktop if the browser offers it, which makes the browser less likely to clear
      the data.`;
  }

  return `<section class="blk"><h2>This device</h2>
    <div class="card"><h3>${esc(head)}</h3>
    <p class="hint" style="margin:6px 0 0">${body}</p>${action}</div>
    <button class="btn wide" style="margin-top:10px" data-act="sync-link">Copy setup link for another device</button>
  </section>`;
}

adoptClientIdFromUrl();
</script>
<script>
"use strict";

/* ========================================================= VELOCITY ==== */
RENDER.velocity = function () {
  let h = `<section class="blk"><h2>Velocity
    <button class="btn sm" data-act="vel-new">Add</button></h2>
    <p class="hint">Average tells you where the load sits. SD and extreme spread tell you
      whether it will hold at distance.</p></section>`;
  if (!S.velocity.length) return h + emptyState("No strings yet", "Record a chronograph string and the stats come with it.", "Add a string", "vel-new");

  const groups = [];
  S.velocity.forEach((v) => {
    const key = (v.firearmId && gun(v.firearmId) ? gun(v.firearmId).name : v.firearmName) || "Unassigned";
    if (!groups.includes(key)) groups.push(key);
  });

  h += groups.map((key) => {
    const items = S.velocity.filter((v) => {
      const k = (v.firearmId && gun(v.firearmId) ? gun(v.firearmId).name : v.firearmName) || "Unassigned";
      return k === key;
    });
    return `<section class="blk"><h3 style="margin-bottom:8px">${esc(key)}</h3>` +
      items.map((v) => {
        const st = vstats(v.shots);
        if (!st) return "";
        const span = Math.max(st.es, 1);
        return `<div class="card" style="margin-bottom:8px">
          <button class="row" style="padding:0;border:0;width:100%" data-act="vel-open" data-id="${esc(v.id)}">
            <span class="grow"><span class="ttl">${esc(v.ammoLabel)}</span>
            <span class="meta">${v.barrelLengthIn ? v.barrelLengthIn + "in" : "length not set"}
              &middot; ${st.n} shots${v.date ? " \u00b7 " + esc(v.date) : ""}</span></span>
            <span class="chev">&rsaquo;</span></button>
          <div class="counter" style="margin-top:6px"><span class="big" style="font-size:2rem">${Math.round(st.avg)}</span>
            <span class="unit">fps average</span></div>
          <div class="split-nums">
            <div><span>SD</span><b>${st.sd.toFixed(1)}</b></div>
            <div><span>Spread</span><b>${fmt(st.es)}</b></div>
            <div><span>Low</span><b>${fmt(st.lo)}</b></div>
            <div><span>High</span><b>${fmt(st.hi)}</b></div>
          </div>
          <div class="stripe">${v.shots.map((s) => {
            const rel = (s - st.lo) / span;
            return `<i class="${Math.abs(s - st.avg) > st.sd ? "" : "hi"}"
              style="height:${(28 * (0.35 + 0.65 * rel)).toFixed(0)}px" title="${s}"></i>`;
          }).join("")}</div>
          <div class="mono-list" style="margin-top:6px">${v.shots.join("  ")}</div>
        </div>`;
      }).join("") + `</section>`;
  }).join("");

  h += `<section class="blk"><button class="btn wide" data-act="vel-export">Export velocity data</button>
    <p class="hint" style="margin-top:8px">JSON with shots and stats per string, for MSDope
      or any other solver.</p></section>`;
  return h;
};

ACT["vel-new"] = () => velEdit(null);
ACT["vel-open"] = (id) => velEdit(id);

function velEdit(id) {
  const v = id ? byId(S.velocity, id) : { firearmId: "", firearmName: "", ammoId: "",
    ammoLabel: "", barrelLengthIn: null, date: today(), shots: [], notes: "" };
  openSheet(id ? v.ammoLabel : "Add a string", `
    <div class="f2">
      <label class="f"><span>Firearm</span><select name="firearmId">
        <option value="">Unassigned</option>${selOpts(S.firearms, v.firearmId, (x) => x.name)}</select></label>
      <label class="f"><span>Barrel length (in)</span><input type="number" step="0.1" name="barrelLengthIn"
        value="${v.barrelLengthIn == null ? "" : v.barrelLengthIn}"></label>
    </div>
    <label class="f"><span>Ammunition</span><select name="ammoId">
      <option value="">Not linked</option>${selOptsGrouped(S.ammo, v.ammoId, ammoLabel, (x) => x.caliber)}</select></label>
    <label class="f"><span>Label</span><input name="ammoLabel" value="${esc(v.ammoLabel)}" placeholder="ADI F1 62gr"></label>
    <label class="f"><span>Date</span><input type="date" name="date" value="${esc(v.date || "")}"></label>
    <label class="f"><span>Shots (fps)</span><input name="shots" inputmode="numeric"
      value="${esc((v.shots || []).join(", "))}" placeholder="2754, 2747, 2713"></label>
    <p class="hint" style="margin:-6px 0 12px">Separate with commas or spaces.</p>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(v.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="vel-save" data-id="${esc(id || "")}">${id ? "Save" : "Add string"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="vel-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}

ACT["vel-save"] = (id) => {
  const f = readForm($("#sheetbody"));
  const shots = String(f.shots || "").split(/[\s,;]+/).map(n).filter((x) => x > 0);
  if (!shots.length) { toast("Enter at least one velocity."); return; }
  const label = String(f.ammoLabel || "").trim()
    || (f.ammoId ? ammoLabel(ammoOf(f.ammoId)) : "");
  if (!label) { toast("Give the load a label."); return; }
  const isNew = !id;
  snapshot(isNew ? "add velocity string" : "edit velocity string");
  const v = isNew ? { id: uid("v") } : byId(S.velocity, id);
  Object.assign(v, {
    firearmId: f.firearmId || null,
    firearmName: f.firearmId && gun(f.firearmId) ? gun(f.firearmId).name : (v.firearmName || ""),
    ammoId: f.ammoId || null, ammoLabel: label,
    barrelLengthIn: f.barrelLengthIn == null ? null : n(f.barrelLengthIn),
    date: f.date || null, shots, notes: f.notes || "",
  });
  if (isNew) S.velocity.push(v);
  commit(isNew ? "String added." : "Saved."); closeSheet();
};

ACT["vel-del"] = (id) => {
  if (!confirm("Delete this string?")) return;
  snapshot("delete velocity string");
  S.velocity = S.velocity.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};

ACT["vel-export"] = () => {
  const out = S.velocity.map((v) => {
    const st = vstats(v.shots) || {};
    return {
      firearm: v.firearmId && gun(v.firearmId) ? gun(v.firearmId).name : v.firearmName,
      barrelLengthIn: v.barrelLengthIn, load: v.ammoLabel,
      caliber: v.ammoId && ammoOf(v.ammoId) ? ammoOf(v.ammoId).caliber : null,
      grains: v.ammoId && ammoOf(v.ammoId) ? ammoOf(v.ammoId).grains : null,
      date: v.date, shots: v.shots,
      avgFps: st.avg ? Math.round(st.avg) : null,
      sd: st.sd != null ? Number(st.sd.toFixed(2)) : null,
      extremeSpread: st.es != null ? st.es : null,
    };
  });
  download(`velocity-${today()}.json`, JSON.stringify({ exported: today(), strings: out }, null, 1));
  toast("Velocity data exported.");
};

/* ============================================================== NFA ===== */
RENDER.nfa = function () {
  let h = `<section class="blk"><h2>NFA items
    <button class="btn sm" data-act="nfa-new">Add</button></h2></section>`;
  if (!S.nfa.length) return h + emptyState("Nothing registered here", "Track serials, Form 4 dates and rounds through each item.", "Add an item", "nfa-new");
  h += `<div class="rows">` + S.nfa.map((x) => {
    const wait = daysBetween(x.form4Submitted, x.approved);
    const pending = !x.approved;
    const waiting = pending ? daysBetween(x.form4Submitted, today()) : null;
    return `<button class="row" data-act="nfa-open" data-id="${esc(x.id)}">
      <span class="grow"><span class="ttl">${esc(x.model)}</span>
      <span class="meta">${esc(x.kind || "")}${x.serial ? " \u00b7 " + esc(x.serial) : ""}
        ${wait != null ? ` \u00b7 approved in ${fmt(wait)} days` : waiting != null ? ` \u00b7 waiting ${fmt(waiting)} days` : ""}</span></span>
      <span class="tag ${pending ? "" : "moss"}">${esc(pending ? "pending" : (x.status || "approved").toLowerCase())}</span>
      <span class="chev">&rsaquo;</span></button>`;
  }).join("") + `</div>`;
  return h;
};

ACT["nfa-new"] = () => nfaEdit(null);
ACT["nfa-open"] = (id) => nfaEdit(id);

function nfaEdit(id) {
  const x = id ? byId(S.nfa, id) : { model: "", serial: "", kind: "Suppressor",
    form4Submitted: "", approved: "", status: "", roundsFired: 0, notes: "" };
  const wait = daysBetween(x.form4Submitted, x.approved);
  openSheet(id ? x.model : "Add an NFA item", `
    ${wait != null ? `<div class="note">Wait time was ${fmt(wait)} days.</div>` : ""}
    <div class="f2">
      <label class="f"><span>Model</span><input name="model" value="${esc(x.model)}"></label>
      <label class="f"><span>Serial</span><input name="serial" value="${esc(x.serial)}"></label>
      <label class="f"><span>Type</span><input name="kind" value="${esc(x.kind || "")}" placeholder="Suppressor, SBR"></label>
      <label class="f"><span>Rounds through it</span><input type="number" name="roundsFired" value="${int(x.roundsFired)}"></label>
      <label class="f"><span>Form 4 submitted</span><input type="date" name="form4Submitted" value="${esc(x.form4Submitted || "")}"></label>
      <label class="f"><span>Approved</span><input type="date" name="approved" value="${esc(x.approved || "")}"></label>
    </div>
    <label class="f"><span>Status</span><input name="status" value="${esc(x.status || "")}" placeholder="APPROVED, pending"></label>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(x.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="nfa-save" data-id="${esc(id || "")}">${id ? "Save" : "Add item"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="nfa-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}

ACT["nfa-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.model || "").trim()) { toast("Name the item."); return; }
  const isNew = !id;
  snapshot(isNew ? "add NFA item" : "edit " + v.model);
  const x = isNew ? { id: uid("n") } : byId(S.nfa, id);
  Object.assign(x, {
    model: String(v.model).trim(), serial: v.serial || "", kind: v.kind || "",
    form4Submitted: v.form4Submitted || null, approved: v.approved || null,
    status: v.status || "", roundsFired: int(v.roundsFired), notes: v.notes || "",
  });
  if (isNew) S.nfa.push(x);
  commit(isNew ? "Item added." : "Saved."); closeSheet();
};
ACT["nfa-del"] = (id) => {
  if (!confirm("Delete this item?")) return;
  snapshot("delete NFA item");
  S.nfa = S.nfa.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};

/* ============================================================ TOOLS ==== */
let WT = { containerId: "", tare: 0, gross: 0, ammoId: "", ref10: 0, res: 1 };
let WTT = null;

RENDER.tools = function () {
  const a = WT.ammoId ? ammoOf(WT.ammoId) : null;
  const ref10 = WT.ref10 || (a && a.ref10G) || 0;
  const tare = WT.containerId === "__custom" ? n(WT.tare)
    : (byId(S.containers, WT.containerId) || {}).tareG || n(WT.tare);
  const net = n(WT.gross) - n(tare);
  const per = ref10 / 10;
  let est = null, lo = null, hi = null;
  if (per > 0 && net > 0) {
    est = net / per;
    const res = Math.max(n(WT.res), 0.1);
    // Two weighings carry scale error, and the reference weight carries its own.
    const relErr = (2 * res) / net + (res / Math.max(ref10, res));
    lo = est * (1 - relErr); hi = est * (1 + relErr);
  }

  let h = `<section class="blk"><h2>Count ammo by weight</h2>
    <p class="hint">Weigh the full container, subtract the empty weight, divide by the weight
      of ten rounds. Good for a can you do not want to hand count.</p>
    <div class="card">
      <label class="f"><span>Container</span><select name="containerId" data-wt="containerId">
        <option value="">Pick one</option>
        ${selOpts(S.containers, WT.containerId, (c) => `${c.name} \u2014 ${c.tareG}g`)}
        <option value="__custom"${WT.containerId === "__custom" ? " selected" : ""}>Weigh it myself</option>
      </select></label>
      ${WT.containerId === "__custom" ? `<label class="f"><span>Empty container weight (g)</span>
        <input type="number" step="0.1" data-wt="tare" value="${WT.tare || ""}"></label>` : ""}
      <label class="f"><span>Full weight (g)</span>
        <input type="number" step="0.1" data-wt="gross" value="${WT.gross || ""}"></label>
      <label class="f"><span>Which ammunition</span><select data-wt="ammoId">
        <option value="">Not linked</option>${selOptsGrouped(S.ammo, WT.ammoId, ammoLabel, (x) => x.caliber)}</select></label>
      <label class="f"><span>Weight of ten rounds (g)</span>
        <input type="number" step="0.1" data-wt="ref10" value="${ref10 || ""}"></label>
      <label class="f"><span>Scale resolution (g)</span>
        <input type="number" step="0.1" data-wt="res" value="${WT.res}"></label>
    </div></section>`;

  h += `<section class="blk">`;
  if (est == null) {
    h += `<div class="empty">Enter a full weight and the weight of ten rounds to get a count.</div>`;
  } else {
    h += `<div class="card"><div class="counter"><span class="big">${fmt(est)}</span>
      <span class="unit">rounds, give or take</span></div>
      <dl style="margin-top:10px">
        <div class="kv"><dt>Likely range</dt><dd>${fmt(lo)} to ${fmt(hi)}</dd></div>
        <div class="kv"><dt>Ammunition weight</dt><dd>${net.toFixed(1)} g</dd></div>
        <div class="kv"><dt>Per round</dt><dd>${per.toFixed(2)} g</dd></div>
      </dl>
      <p class="hint" style="margin:10px 0 0">A count from weight is an estimate. The range
        widens with a coarser scale and a lighter reference sample \u2014 weigh twenty or fifty
        rounds instead of ten to tighten it.</p>
      ${a ? `<div class="btnrow" style="margin-top:12px">
        <button class="btn sm" data-act="wt-apply" data-v="${Math.round(est)}">Set loose count to ${fmt(est)}</button>
        ${ref10 ? `<button class="btn sm" data-act="wt-saveref" data-v="${ref10}">Remember this reference</button>` : ""}
      </div>` : ""}</div>`;
  }
  h += `</section>`;

  h += `<section class="blk"><h2>Containers
    <button class="btn sm" data-act="cont-new">Add</button></h2>
    <div class="rows">` + (S.containers.length ? S.containers.map((c) =>
      `<button class="row" data-act="cont-open" data-id="${esc(c.id)}">
        <span class="grow"><span class="ttl">${esc(c.name)}</span></span>
        <span class="num">${c.tareG} g</span><span class="chev">&rsaquo;</span></button>`).join("")
      : `<div style="padding:16px" class="hint">No containers saved.</div>`) + `</div></section>`;
  return h;
};

ACT["wt-apply"] = (_id, v) => {
  const a = ammoOf(WT.ammoId);
  if (!a) return;
  if (!confirm(`Set the loose count for ${ammoLabel(a)} to ${fmt(v)}? The current figure is ${fmt(a.qtyLoose)}.`)) return;
  snapshot("weight count, " + ammoLabel(a));
  a.qtyLoose = int(v);
  S.ledger.push({ id: uid("lg"), at: today(), kind: "weighcount", ammoId: a.id, to: int(v) });
  commit("Loose count updated.");
};
ACT["wt-saveref"] = (_id, v) => {
  const a = ammoOf(WT.ammoId);
  if (!a) return;
  snapshot("save reference weight");
  a.ref10G = n(v);
  commit("Reference weight saved to that line.");
};
ACT["cont-new"] = () => contEdit(null);
ACT["cont-open"] = (id) => contEdit(id);
function contEdit(id) {
  const c = id ? byId(S.containers, id) : { name: "", tareG: null };
  openSheet(id ? c.name : "Add a container", `
    <label class="f"><span>Name</span><input name="name" value="${esc(c.name)}" placeholder="ammo can 2"></label>
    <label class="f"><span>Empty weight (g)</span><input type="number" step="0.1" name="tareG" value="${c.tareG == null ? "" : c.tareG}"></label>
    <button class="btn pri wide" data-act="cont-save" data-id="${esc(id || "")}">${id ? "Save" : "Add"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="cont-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}
ACT["cont-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.name || "").trim() || v.tareG == null) { toast("Name and empty weight are both needed."); return; }
  snapshot(id ? "edit container" : "add container");
  const c = id ? byId(S.containers, id) : { id: uid("c") };
  c.name = String(v.name).trim(); c.tareG = n(v.tareG);
  if (!id) S.containers.push(c);
  commit("Saved."); closeSheet();
};
ACT["cont-del"] = (id) => {
  snapshot("delete container");
  S.containers = S.containers.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};

/* ============================================================= DATA ==== */
RENDER.data = function () {
  const rounds = S.ammo.reduce((t, a) => t + onHand(a), 0);
  const ul = undoLabel();
  return (typeof syncPanel === "function" ? syncPanel() : "") +
  (typeof platformPanel === "function" ? platformPanel() : "") +
  `<section class="blk"><h2>Backup</h2>
    <p class="hint">A file you can keep, move to another device, or feed to the native
      build later. Worth doing after a big session even with sync switched on.</p>
    <div class="btnrow split">
      <button class="btn pri" data-act="data-export">Export a backup</button>
      <button class="btn" data-act="data-import">Import a backup</button>
    </div>
    <input type="file" id="importfile" accept=".json,application/json" class="sr"></section>

  <section class="blk"><h2>What is in here</h2><dl class="card">
    <div class="kv"><dt>Firearms</dt><dd>${fmt(S.firearms.length)}</dd></div>
    <div class="kv"><dt>Ammunition lines</dt><dd>${fmt(S.ammo.length)}</dd></div>
    <div class="kv"><dt>Rounds on hand</dt><dd>${fmt(rounds)}</dd></div>
    <div class="kv"><dt>Magazine types</dt><dd>${fmt(S.magTypes.length)}</dd></div>
    <div class="kv"><dt>Magazines owned</dt><dd>${fmt(S.magTypes.reduce((t, m) => t + int(m.quantity), 0))}</dd></div>
    <div class="kv"><dt>Magazines loaded</dt><dd>${fmt(S.magLoads.length)}</dd></div>
    <div class="kv"><dt>Trips closed</dt><dd>${fmt(S.trips.filter((t) => t.status === "closed").length)}</dd></div>
    <div class="kv"><dt>Velocity strings</dt><dd>${fmt(S.velocity.length)}</dd></div>
    <div class="kv"><dt>Storage used</dt><dd id="usage">measuring</dd></div>
    <div class="kv"><dt>Storage mode</dt><dd id="persistmode" style="font-family:var(--sans)">checking</dd></div>
  </dl>
  <button class="btn wide" style="margin-top:10px" data-act="persist-ask">Ask this browser to keep the data</button>
  </section>

  ${ul ? `<section class="blk"><h2>Undo</h2>
    <button class="btn wide" data-act="undo">Undo: ${esc(ul)}</button>
    <p class="hint" style="margin-top:8px">The last ${UNDO_MAX} changes can be rolled back one at a time.</p></section>` : ""}

  <section class="blk"><h2>Start over</h2>
    <p class="hint">Erases everything on this device and leaves an empty log. Export first
      if there is any chance you want it back.</p>
    <button class="btn dgr wide" data-act="data-reset">Erase and start empty</button></section>`;
};

function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

ACT["data-export"] = () => {
  download(`armory-${today()}.json`, JSON.stringify(S, null, 1));
  toast("Backup exported.");
};
ACT["data-import"] = () => $("#importfile").click();
ACT["data-reset"] = () => {
  if (!confirm("Erase everything on this device? Anything not exported is gone.")) return;
  snapshot("erase everything");
  S = migrate(JSON.parse(JSON.stringify(SEED)));
  commit("Erased.");
};
ACT["undo"] = () => undoLast();
ACT["sheet-close"] = () => closeSheet();
ACT["go-home"] = () => go("home");
ACT["go-guns"] = () => go("guns");
ACT["go-ammo"] = () => go("ammo");
ACT["go-mags"] = () => go("mags");
ACT["go-velocity"] = () => go("velocity");
ACT["go-nfa"] = () => go("nfa");
ACT["go-tools"] = () => go("tools");
ACT["go-data"] = () => go("data");

/* ========================================================== WIRING ===== */
document.addEventListener("click", (ev) => {
  const nudge = ev.target.closest("[data-nudge]");
  if (nudge) {
    const box = nudge.closest("[data-step]");
    const inp = $("input", box);
    const step = int(nudge.dataset.nudge) * (ev.shiftKey ? 10 : 1);
    const min = inp.min === "" ? -Infinity : n(inp.min);
    inp.value = Math.max(min, int(inp.value) + step);
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  const tab = ev.target.closest("#tabs button");
  if (tab) { RANGEMODE = "trip"; go(tab.dataset.go); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) { console.warn("no handler for", el.dataset.act); return; }
  ev.preventDefault();
  fn(el.dataset.id || null, el.dataset.v);
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.actChange) { (ACT[t.dataset.actChange] || (() => {}))(); return; }
  if (t.dataset && t.dataset.wt) {
    WT[t.dataset.wt] = t.type === "number" ? n(t.value) : t.value;
    if (t.dataset.wt === "ammoId") WT.ref10 = 0;
    if (t.dataset.wt === "containerId") WT.tare = 0;
    render();
    return;
  }
  if (t.id === "importfile" && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const st = JSON.parse(fr.result);
        if (!st || !Array.isArray(st.firearms)) throw new Error("not an armory backup");
        if (!confirm("Replace everything on this device with this backup?")) return;
        snapshot("import backup");
        S = migrate(st);
        commit("Backup imported.");
      } catch (e) {
        toast("That file is not an armory backup.");
        console.error(e);
      }
      t.value = "";
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.e) { coEdit(t); return; }
  if (t.dataset && t.dataset.wt) {
    WT[t.dataset.wt] = t.type === "number" ? n(t.value) : t.value;
    // Recompute the readout without redrawing the field being typed in.
    clearTimeout(WTT);
    WTT = setTimeout(() => { if (SCREEN === "tools") render(); }, 450);
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet();
});
$("#scrim").addEventListener("click", closeSheet);
$("#sheetx").addEventListener("click", closeSheet);

/* ============================================================= INIT ==== */
S = load();
if (!localStorage.getItem(KEY)) save({ noRev: true });
go("home");

/* Finish any sign-in redirect, then reconcile with OneDrive. */
(async function startSync() {
  if (typeof handleAuthRedirect !== "function") return;
  const justLinked = await handleAuthRedirect();
  if (justLinked) { render(); toast("OneDrive connected."); }
  if (typeof syncNow === "function" && linked()) await syncNow(false);
  render();
})();

/* Coming back to the app is the moment another device's changes matter. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { if (DIRTY) save({ noRev: true }); return; }
  if (typeof syncNow === "function" && Date.now() - LAST_CHECK > 30000) syncNow(false);
});
window.addEventListener("online", () => { if (typeof syncNow === "function") syncNow(false); });
setInterval(() => {
  if (typeof syncNow === "function" && document.visibilityState === "visible") syncNow(false);
}, 300000);

if (typeof requestPersist === "function") requestPersist(false).then(() => paintStorage());
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
window.addEventListener("beforeunload", () => { if (DIRTY) save({ noRev: true }); });
</script>
</body>
