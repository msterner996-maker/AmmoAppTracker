/* ------------------------------------------------------------- conflict */
function summarise(st) {
  if (!st) return null;
  const rounds = (st.ammo || []).reduce((t, a) =>
    t + int(a.qtyBoxed) + int(a.qtyLoose), 0)
    + (st.magLoads || []).reduce((t, l) => t + int(l.rounds), 0);
  return {
    device: st.deviceName || "Unnamed device",
    when: st.updatedAt ? st.updatedAt.slice(0, 16).replace("T", " ") : "unknown",
    rev: int(st.rev),
    firearms: (st.firearms || []).length,
    rounds,
    trips: (st.trips || []).filter((t) => t.status === "closed").length,
    fired: (st.firearms || []).reduce((t, f) => t + int(f.receiverRounds), 0),
  };
}

function conflictCard(title, s, tag) {
  if (!s) return `<div class="card"><h3>${esc(title)}</h3>
    <p class="hint" style="margin:4px 0 0">Could not be read.</p></div>`;
  return `<div class="card"><h3>${esc(title)} <span class="tag ${tag}">${esc(s.device)}</span></h3>
    <p class="hint" style="margin:4px 0 0">Saved ${esc(s.when)} &middot; revision ${fmt(s.rev)}</p>
    <div class="split-nums">
      <div><span>Firearms</span><b>${fmt(s.firearms)}</b></div>
      <div><span>Rounds</span><b>${fmt(s.rounds)}</b></div>
      <div><span>Trips</span><b>${fmt(s.trips)}</b></div>
      <div><span>Fired</span><b>${fmt(s.fired)}</b></div>
    </div></div>`;
}

function openConflict() {
  if (!CONFLICT) return;
  const a = summarise(CONFLICT.local), b = summarise(CONFLICT.remote);
  openSheet("Two versions to choose from", `
    <div class="note flag">This device and OneDrive both changed since the last sync.
      Merging them automatically would silently drop one set of changes, so pick one.
      Export both first if you are unsure.</div>
    ${conflictCard("On this device", a, "")}
    <div style="height:10px"></div>
    ${conflictCard("On OneDrive", b, "mute")}
    <div class="btnrow" style="margin-top:14px;flex-direction:column">
      <button class="btn pri wide" data-act="conflict-local">Keep this device and overwrite OneDrive</button>
      <button class="btn wide" style="margin-top:8px" data-act="conflict-remote">Take the OneDrive copy and discard local changes</button>
      <button class="btn wide" style="margin-top:8px" data-act="conflict-export">Export both as files first</button>
    </div>`);
}

ACT["conflict-open"] = () => openConflict();

ACT["conflict-local"] = async () => {
  if (!CONFLICT) return;
  if (!confirm("Overwrite the OneDrive copy with this device's version?")) return;
  CONFLICT = null;
  closeSheet();
  const w = await remoteWrite(true);
  if (w.error || w.needsAuth) { syncErr(w.error || "Sign-in expired."); render(); return; }
  setSyncMeta({ eTag: w.eTag, rev: int(S.rev), pushed: Date.now(), error: null });
  render(); toast("OneDrive now matches this device.");
};

ACT["conflict-remote"] = () => {
  if (!CONFLICT || !CONFLICT.remote) return;
  if (!confirm("Discard this device's changes and take the OneDrive copy?")) return;
  snapshot("take the OneDrive copy");
  const { remote, eTag } = CONFLICT;
  CONFLICT = null;
  closeSheet();
  adoptRemote(remote, eTag);
  render(); toast("Took the OneDrive copy. Undo is available.");
};

ACT["conflict-export"] = () => {
  if (!CONFLICT) return;
  download(`armory-thisdevice-${today()}.json`, JSON.stringify(CONFLICT.local, null, 1));
  if (CONFLICT.remote) {
    setTimeout(() => download(`armory-onedrive-${today()}.json`,
      JSON.stringify(CONFLICT.remote, null, 1)), 600);
  }
  toast("Both versions exported. Now pick one.");
};

/* ---------------------------------------------------------------- import */
/* Importing is the most destructive thing in the app, and the one time you
   really want to know you picked the right file. So it shows you what is in it
   and what will happen, rather than a bare "are you sure". */
let IMPORT_PENDING = null;

function importPreview(st, fname) {
  IMPORT_PENDING = st;
  const rounds = (st.ammo || []).reduce((t, a) => t + int(a.qtyBoxed) + int(a.qtyLoose), 0)
    + (st.magLoads || []).reduce((t, l) => t + int(l.rounds), 0);
  const mine = {
    firearms: S.firearms.length,
    rounds: S.ammo.reduce((t, a) => t + onHand(a), 0),
    docs: (S.docs || []).length,
  };
  const incoming = {
    firearms: (st.firearms || []).length,
    rounds,
    docs: (st.docs || []).length,
  };
  const docsGoing = mine.docs && !incoming.docs;

  openSheet("Import a backup", `
    <p class="hint">${esc(fname || "This file")} \u2014 saved
      ${esc(st.updatedAt ? st.updatedAt.slice(0, 16).replace("T", " ") : "at an unknown time")}
      on ${esc(st.deviceName || "an unnamed device")}.</p>

    <div class="card"><h3>What is in the file</h3>
      <div class="split-nums">
        <div><span>Firearms</span><b>${fmt(incoming.firearms)}</b></div>
        <div><span>Ammo lines</span><b>${fmt((st.ammo || []).length)}</b></div>
        <div><span>Rounds</span><b>${fmt(incoming.rounds)}</b></div>
        <div><span>Mag types</span><b>${fmt((st.magTypes || []).length)}</b></div>
      </div>
      <div class="split-nums" style="margin-top:1px">
        <div><span>Loaded mags</span><b>${fmt((st.magLoads || []).length)}</b></div>
        <div><span>Trips</span><b>${fmt((st.trips || []).filter((x) => x.status === "closed").length)}</b></div>
        <div><span>Velocity</span><b>${fmt((st.velocity || []).length)}</b></div>
        <div><span>PDFs</span><b>${fmt(incoming.docs)}</b></div>
      </div></div>

    <div class="note flag" style="margin-top:12px">
      Replaces everything on this device: ${plural(mine.firearms, "firearm")} and
      ${fmt(mine.rounds)} rounds go, and these take their place.
      ${linked() ? "Your OneDrive copy is replaced too, on the next sync." : ""}
      ${docsGoing ? ` The ${plural(mine.docs, "PDF")} attached here ${
        mine.docs === 1 ? "is" : "are"} not in this file and will be deleted.` : ""}
      Undo reverses it.
    </div>

    <p class="hint">This device keeps its own name, so a copy taken from the
      ${esc(st.deviceName || "other device")} will not rename it.</p>

    <button class="btn pri wide" data-act="import-go">Replace everything with this file</button>
    <button class="btn wide" style="margin-top:8px" data-act="import-cancel">Cancel</button>`);
}

ACT["import-cancel"] = () => { IMPORT_PENDING = null; closeSheet(); };

ACT["import-go"] = () => {
  const st = IMPORT_PENDING;
  IMPORT_PENDING = null;
  if (!st) { closeSheet(); return; }
  /* Park a copy of what is about to be replaced where it can be got back from
     any device, not just this one's undo stack. */
  if (typeof backupNow === "function" && linked()) {
    backupNow(JSON.stringify(S), true).catch(() => {});
  }
  snapshot("import backup");
  /* Device name is a property of this device, not of the data. */
  const mine = S.deviceName;
  S = migrate(st);
  if (mine) S.deviceName = mine;
  closeSheet();
  commit("Backup imported.");
  if (linked()) syncNow(false);
};

/* ------------------------------------------------------------- panels */
function syncLine() {
  if (CONFLICT) {
    return `<section class="blk"><div class="card" style="border-color:var(--flag)">
      <h2>Sync needs a decision</h2>
      <p class="hint" style="margin:5px 0 11px">This device and OneDrive both changed.
        Nothing has been overwritten.</p>
      <button class="btn pri wide" data-act="conflict-open">Compare the two versions</button>
    </div></section>`;
  }
  if (!linked()) return "";
  const m = syncMeta();
  const when = m.pushed || m.pulled || m.checked;
  const label = SYNCING ? "Syncing"
    : m.error ? m.error
    : dirty() ? "Changes waiting to sync"
    : when ? "Synced " + agoText(when) : "Connected";
  return `<section class="blk"><button class="btn wide" data-act="sync-now"
    style="justify-content:space-between">
    <span style="font-weight:500;color:${m.error ? "var(--flag)" : "var(--ink-2)"};
      font-size:0.875rem;text-align:left">${esc(label)}</span>
    <span style="color:var(--brass)">${SYNCING ? "" : "Sync now"}</span></button></section>`;
}

function agoText(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function syncPanel() {
  let h = `<section class="blk"><h2>OneDrive sync</h2>`;
  if (!canSync()) {
    h += `<div class="note">Sync needs the app served over https, because the sign-in
      redirect cannot come back to a local file. Host the files and open that address
      instead, then this section will come alive. Export and import still work here.</div>`;
    return h + `</section>`;
  }
  const m = syncMeta();
  const tok = lsGet(TOK_KEY);
  if (!linked()) {
    h += `<p class="hint">Keeps this device and your others in step through one file in
      your own OneDrive, in a folder only this app can see. The app registration is
      already configured, so all that is left is signing in.</p>
      <button class="btn pri wide" data-act="sync-in">Connect OneDrive</button>
      <button class="btn wide" style="margin-top:8px" data-act="sync-setup">Registration details</button>`;
    return h + `</section>`;
  }
  h += `<dl class="card">
    <div class="kv"><dt>Account</dt><dd style="font-family:var(--sans)">${esc(tok.who || "connected")}</dd></div>
    <div class="kv"><dt>This device</dt><dd style="font-family:var(--sans)">${esc(S.deviceName || defaultDeviceName())}</dd></div>
    <div class="kv"><dt>Status</dt><dd style="font-family:var(--sans);color:${m.error ? "var(--flag)" : "var(--ink)"}">${
      esc(SYNCING ? "syncing" : m.error ? m.error : dirty() ? "changes waiting" : "up to date")}</dd></div>
    <div class="kv"><dt>Last push</dt><dd>${m.pushed ? esc(agoText(m.pushed)) : "\u2014"}</dd></div>
    <div class="kv"><dt>Last pull</dt><dd>${m.pulled ? esc(agoText(m.pulled)) : "\u2014"}</dd></div>
    <div class="kv"><dt>Revision</dt><dd>${fmt(S.rev)}</dd></div>
  </dl>
  <div class="btnrow split" style="margin-top:10px">
    <button class="btn pri" data-act="sync-now">Sync now</button>
    <button class="btn" data-act="sync-name">Name device</button>
  </div>
  <div class="btnrow split" style="margin-top:8px">
    <button class="btn" data-act="sync-setup">Registration</button>
    <button class="btn dgr" data-act="sync-out">Disconnect</button>
  </div>
  <p class="hint" style="margin-top:10px">Changes push a couple of seconds after you make
    them, and the app checks for newer copies when you open or return to it. A browser
    sign-in lasts 24 hours at most, so expect to tap through a sign-in now and then.
    Nothing waits on the network: log a trip with no signal and it syncs when you are back.</p>`;
  return h + `</section>`;
}
</script>
<script>
"use strict";
/* ==========================================================================
   Platform quirks.

   Three browsers, three sets of rules:

   Firefox on the desktop runs service workers but will not install a web app,
   so it lives in a tab. Asking for persistent storage shows a permission
   prompt, so it is asked once and the answer remembered.

   Chrome on Android is the good case: installs to the home screen, silent
   persistent storage, no eviction surprises.

   Anything on iOS or iPadOS is WebKit regardless of the icon on it. WebKit
   deletes localStorage, IndexedDB and service worker registrations after
   seven days of browser use without interacting with the site. Home screen
   web apps are exempt, and only Safari can add them. So on the iPad this app
   belongs on the home screen via Safari, not in a Chrome tab.
   ========================================================================== */

const PERSIST_ASKED = "armory.persistAsked";
/* Stamped by the build so the app and its service worker cache always agree.
   Shown on the Data screen, which answers "did my deploy actually land?". */
const APP_VERSION = "2026.09.08-0bed1c";

function plat() {
  const ua = navigator.userAgent || "";
  const iOSish = /iPad|iPhone|iPod/.test(ua)
    || (/Macintosh/.test(ua) && int(navigator.maxTouchPoints) > 1);
  const standalone = navigator.standalone === true
    || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  return {
    ua, iOSish, standalone,
    firefox: /firefox|fxios/i.test(ua),
    chromeIOS: /CriOS/.test(ua),
    android: /Android/.test(ua),
    sw: "serviceWorker" in navigator,
    /* Firefox is the one that puts a prompt in front of the request. */
    promptsForPersist: /firefox/i.test(ua) && !/fxios/i.test(ua),
  };
}

/* WebKit wants this re-requested each launch, Firefox must not be nagged. */
async function requestPersist(force) {
  if (!navigator.storage || !navigator.storage.persist) return null;
  let already = false;
  try { already = await navigator.storage.persisted(); } catch (e) { return null; }
  if (already) return true;
  const p = plat();
  if (p.promptsForPersist && !force) {
    let asked = null;
    try { asked = localStorage.getItem(PERSIST_ASKED); } catch (e) {}
    if (asked) return false;
  }
  try { localStorage.setItem(PERSIST_ASKED, "1"); } catch (e) {}
  try { return await navigator.storage.persist(); } catch (e) { return null; }
}

ACT["persist-ask"] = async () => {
  const r = await requestPersist(true);
  if (r === true) toast("This browser will keep the data.");
  else if (r === null) toast("This browser does not offer a persistence setting.");
  else toast("Request declined. Export backups and keep opening the app.");
  render();
  paintStorage();
};

/* Filled in after render, since both answers are async. */
async function paintStorage() {
  const mode = $("#persistmode");
  if (mode) {
    let p = null;
    try { p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; }
    catch (e) {}
    mode.textContent = p === true ? "persistent" : p === false ? "best effort" : "unknown";
    mode.style.color = p === true ? "var(--moss)" : p === false ? "var(--copper)" : "var(--ink-2)";
  }
  const ds = $("#docsize");
  if (ds && typeof docBytesLocal === "function") {
    const nDocs = (S.docs || []).length;
    docBytesLocal().then((b) => {
      const el = $("#docsize");
      if (el) el.textContent = nDocs ? `${nDocs} · ${kb(b)}` : "0";
    }).catch(() => {});
  }
  const use = $("#usage");
  if (use && navigator.storage && navigator.storage.estimate) {
    try {
      const e = await navigator.storage.estimate();
      use.textContent = ((e.usage || 0) / 1024).toFixed(0) + " KB";
    } catch (er) { use.textContent = "unknown"; }
  }
}

/* ---------------------------------------------- setup link across devices */
/* The client ID is not a secret: this is a public client using PKCE, and the
   redirect URI is what actually binds the flow. Carrying it in the link means
   setting up the second and third browser is one tap, and recovering from a
   storage wipe does not mean retyping a GUID. */
function setupLink() {
  return clientId() ? redirectUri() + "#cid=" + clientId() : redirectUri();
}

function adoptClientIdFromUrl() {
  const h = String(location.hash || "");
  const m = h.match(/cid=([0-9a-f-]{30,40})/i);
  if (!m) return;
  try {
    if (!localStorage.getItem(CID_KEY)) localStorage.setItem(CID_KEY, m[1]);
  } catch (e) {}
  try { history.replaceState({}, "", redirectUri()); } catch (e) {}
}

ACT["sync-link"] = async () => {
  const url = setupLink();
  let copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      copied = true;
    }
  } catch (e) {}
  openSheet("Set up another device", `
    <p class="hint">Open this link on your other browser or device. It carries the client
      ID, so all you do there is connect your Microsoft account. ${copied
        ? "Already copied to the clipboard." : "Copy it from below."}</p>
    <div class="mono-list" style="word-break:break-all;background:var(--card);
      border:1px solid var(--rule);border-radius:7px;padding:10px;color:var(--ink)">${esc(url)}</div>
    <p class="hint" style="margin-top:12px">The client ID is not a secret. It identifies the
      app, and the registered redirect address is what stops anyone else using it. Your
      account and your data are not in this link.</p>
    <button class="btn wide" style="margin-top:4px" data-act="sheet-close">Done</button>`);
};

/* ---------------------------------------------------------- advice panel */
ACT["app-update"] = async () => {
  if (!("serviceWorker" in navigator)) { location.reload(); return; }
  toast("Checking for a newer build\u2026");
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
  } catch (e) {}
  setTimeout(() => location.reload(), 700);
};

function platformPanel() {
  const p = plat();
  let head, body, action = "";

  if (p.iOSish && !p.standalone) {
    head = "This iPad browser will delete your data";
    body = `WebKit clears local storage after seven days of browser use without you
      opening this site, and that applies to every browser on iPadOS including Chrome.
      Web apps added to the home screen are exempt. Open this address in <b>Safari</b>,
      then Share and <b>Add to Home Screen</b>, and launch it from that icon. Chrome on
      iPad also cannot run the offline cache.`;
    action = `<p class="hint" style="margin:10px 0 0">With OneDrive sync on, a wipe here
      costs you the sign-in and the client ID rather than the log itself. Keep the setup
      link handy and it is a two-tap recovery.</p>`;
  } else if (p.iOSish && p.standalone) {
    head = "Running from the home screen";
    body = `Good. Home screen web apps are exempt from WebKit's seven-day storage purge,
      and this one keeps its data separate from Safari, so you sign in here once on its
      own.`;
  } else if (p.firefox && !p.android) {
    head = "Firefox on the desktop";
    body = `Everything works here, including the offline cache, but Firefox does not
      install web apps, so keep it as a pinned tab or a bookmark rather than looking for
      an install button. One thing to check: if you have Firefox set to clear cookies and
      site data on exit, it takes this log with it. Add an exception for this site, or
      lean on OneDrive sync and backups.`;
  } else if (p.android) {
    head = "Chrome on Android";
    body = `The best case of the three. Use the menu and <b>Install app</b> or <b>Add to
      Home screen</b> for a full-screen icon, offline caching, and storage the browser is
      far less willing to clear.`;
  } else {
    head = "This browser";
    body = `Storage and offline caching behave normally here. Install to the home screen
      or desktop if the browser offers it, which makes the browser less likely to clear
      the data.`;
  }

  return `<section class="blk"><h2>This device</h2>
    <div class="card"><h3>${esc(head)}</h3>
    <p class="hint" style="margin:6px 0 0">${body}</p>${action}</div>
    <button class="btn wide" style="margin-top:10px" data-act="sync-link">Copy setup link for another device</button>
    <dl class="card" style="margin-top:10px">
      <div class="kv"><dt>App version</dt><dd>${esc(APP_VERSION)}</dd></div>
    </dl>
    <button class="btn wide" style="margin-top:8px" data-act="app-update">Check for an update</button>
    <p class="hint" style="margin-top:8px">Compare that version against the build you
      deployed. If it is behind, this reloads and picks up the new one.</p>
  </section>`;
}

adoptClientIdFromUrl();
</script>
<script>
"use strict";
/* ==========================================================================
   Paperwork.

   PDFs do not go in the state JSON. Base64 inflates a file by a third, the
   whole log has to fit in about 5 MB of localStorage, and every sync would
   re-upload every scan. So:

     - the blob lives in IndexedDB, which has real room
     - each PDF is its own file in OneDrive at Apps/Armory/docs/<id>.pdf
     - the state JSON carries only the metadata, which is what syncs and
       what the conflict logic already protects

   Documents are immutable: added or removed, never edited. That means the
   files themselves cannot conflict, and reconciling is a set comparison
   rather than a merge. Whatever the state says is the truth; OneDrive and
   IndexedDB are both brought into line with it.
   ========================================================================== */

const DOC_DB = "armory-docs";
const DOC_STORE = "files";
const DOC_MAX = 4 * 1024 * 1024;   // Graph simple upload comfort zone
let DOC_TARGET = null;             // which NFA item an attach is destined for

function idb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("This browser has no IndexedDB.")); return; }
    const req = indexedDB.open(DOC_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DOC_STORE)) db.createObjectStore(DOC_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error("Could not open the document store."));
  });
}

function idbDo(mode, fn) {
  return idb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DOC_STORE, mode);
    const store = tx.objectStore(DOC_STORE);
    let req;
    try { req = fn(store); } catch (e) { rej(e); return; }
    /* Take the value from the request's own success event. Reading .result off
       the request after the fact cannot tell "missing key" from "not ready", and
       both are undefined — which is exactly the case the fallback download
       depends on getting right. */
    let value;
    if (req && typeof req === "object" && "onsuccess" in req) {
      req.onsuccess = () => { value = req.result; };
    }
    tx.oncomplete = () => res(value);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("Document write aborted."));
  }));
}

const docPut = (id, blob) => idbDo("readwrite", (s) => s.put(blob, id));
const docGet = (id) => idbDo("readonly", (s) => s.get(id));
const docDel = (id) => idbDo("readwrite", (s) => s.delete(id));
const docKeys = () => idbDo("readonly", (s) => s.getAllKeys());

async function docBytesLocal() {
  try {
    const keys = await docKeys();
    let t = 0;
    for (const k of keys || []) {
      const b = await docGet(k);
      if (b && b.size) t += b.size;
    }
    return t;
  } catch (e) { return 0; }
}

const docsFor = (ownerType, ownerId) =>
  (S.docs || []).filter((d) => d.ownerType === ownerType && d.ownerId === ownerId);

function kb(bytes) {
  const n = int(bytes);
  return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
}

/* -------------------------------------------------------------- attaching */
ACT["doc-add"] = (ownerId) => {
  DOC_TARGET = ownerId;
  const inp = $("#docfile");
  if (!inp) { toast("Cannot open the file picker here."); return; }
  inp.value = "";
  inp.click();
};

async function acceptDoc(file) {
  const ownerId = DOC_TARGET;
  DOC_TARGET = null;
  if (!ownerId) return;
  const item = byId(S.nfa, ownerId);
  if (!item) { toast("That item no longer exists."); return; }

  const looksPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  if (!looksPdf) { toast("PDFs only. Scan or export the paperwork as a PDF first."); return; }
  if (file.size > DOC_MAX) {
    toast(`${kb(file.size)} is too big. Keep scans under 4 MB — reduce the scan resolution.`);
    return;
  }
  if (!file.size) { toast("That file is empty."); return; }

  const id = uid("doc");
  try {
    await docPut(id, file);
  } catch (e) {
    toast("Could not store the file on this device.");
    console.error(e);
    return;
  }
  snapshot(`attach ${file.name}`);
  S.docs = S.docs || [];
  S.docs.push({
    id, ownerType: "nfa", ownerId,
    name: file.name.replace(/\.pdf$/i, "").slice(0, 80) || "Document",
    size: file.size, addedOn: today(),
  });
  save();
  toast(`Attached to ${item.model}.`);
  nfaSheet(ownerId);
  if (typeof syncNow === "function" && linked()) syncNow(false);
}

/* -------------------------------------------------------------- viewing */
async function docBlob(d) {
  let b = null;
  try { b = await docGet(d.id); } catch (e) {}
  if (b) return b;
  /* Not on this device. It may still be in OneDrive. */
  if (!linked()) return null;
  const got = await docDownload(d.id);
  if (got) { try { await docPut(d.id, got); } catch (e) {} }
  return got;
}

ACT["doc-open"] = async (docId) => {
  const d = byId(S.docs || [], docId);
  if (!d) return;
  toast("Opening " + d.name + "\u2026");
  const b = await docBlob(d);
  if (!b) {
    toast("Not on this device, and could not be fetched from OneDrive.");
    return;
  }
  const url = URL.createObjectURL(b.type ? b : new Blob([b], { type: "application/pdf" }));
  const win = window.open(url, "_blank");
  if (!win) {
    /* Blocked, or a standalone app that will not open tabs. Fall back to saving. */
    const a = document.createElement("a");
    a.href = url; a.download = d.name + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
};

ACT["doc-save"] = async (docId) => {
  const d = byId(S.docs || [], docId);
  if (!d) return;
  const b = await docBlob(d);
  if (!b) { toast("Not available on this device."); return; }
  const url = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = url; a.download = d.name + ".pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
};

ACT["doc-rename"] = (docId) => {
  const d = byId(S.docs || [], docId);
  if (!d) return;
  openSheet("Rename document", `
    <label class="f"><span>Name</span><input name="nm" value="${esc(d.name)}"></label>
    <button class="btn pri wide" data-act="doc-rename-go" data-id="${esc(docId)}">Save</button>`);
};
ACT["doc-rename-go"] = (docId) => {
  const d = byId(S.docs || [], docId);
  const v = readForm($("#sheetbody"));
  if (!String(v.nm || "").trim()) { toast("Give it a name."); return; }
  snapshot("rename document");
  d.name = String(v.nm).trim().slice(0, 80);
  save();
  closeSheet();
  nfaSheet(d.ownerId);
};

ACT["doc-del"] = async (docId) => {
  const d = byId(S.docs || [], docId);
  if (!d) return;
  if (!confirm(`Delete "${d.name}"? It is removed from this device and from OneDrive.`)) return;
  const owner = d.ownerId;
  snapshot("delete document");
  S.docs = (S.docs || []).filter((x) => x.id !== docId);
  save();
  try { await docDel(docId); } catch (e) {}
  if (typeof syncNow === "function" && linked()) syncNow(false);
  toast("Deleted.");
  nfaSheet(owner);
};

/* -------------------------------------------------------------- graph */
const DOC_DIR = `${GRAPH}/me/drive/special/approot:/docs`;

async function docRemoteList() {
  const r = await graph(DOC_DIR + ":/children?$select=name,size");
  if (r.needsAuth) return null;
  if (r.status === 404) return [];
  if (!r.ok) return null;
  const j = await r.res.json().catch(() => ({}));
  return (j.value || []).map((x) => String(x.name).replace(/\.pdf$/i, ""));
}

async function docUpload(id) {
  let b = null;
  try { b = await docGet(id); } catch (e) {}
  if (!b) return false;
  const r = await graph(`${DOC_DIR}/${id}.pdf:/content`, {
    method: "PUT", headers: { "Content-Type": "application/pdf" }, body: b,
  });
  return !!(r && r.ok);
}

/* Graph hands back a pre-authenticated URL for content. Fetching that without
   the Authorization header avoids the CORS failure you get by following the
   redirect with credentials attached. */
async function docDownload(id) {
  const meta = await graph(`${DOC_DIR}/${id}.pdf?$select=@microsoft.graph.downloadUrl`);
  if (!meta || meta.needsAuth || !meta.ok) return null;
  const j = await meta.res.json().catch(() => ({}));
  const url = j["@microsoft.graph.downloadUrl"];
  if (!url) return null;
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.blob();
  } catch (e) { return null; }
}

async function docRemoteDelete(id) {
  const r = await graph(`${DOC_DIR}/${id}.pdf`, { method: "DELETE" });
  return !!(r && (r.ok || r.status === 404));
}

/* Bring OneDrive and this device in line with what the state lists.
   Called after the state itself has been reconciled, so S.docs is settled. */
/* canGc says the state was reconciled with OneDrive a moment ago, so S.docs is
   the agreed truth and removing unreferenced files is safe. Without that,
   deleting remote files could destroy paperwork another device has just added
   and recorded in a state revision this device has not seen yet. */
async function syncDocs(canGc) {
  if (!linked() || CONFLICT) return;
  const listed = S.docs || [];
  let localKeys = [];
  try { localKeys = (await docKeys()) || []; } catch (e) { return; }

  const sig = listed.map((d) => d.id).sort().join(",");
  const gaps = listed.some((d) => !localKeys.includes(d.id));
  const strays = localKeys.some((k) => !listed.some((d) => d.id === k));
  const meta = syncMeta();
  /* The local signature says nothing about what is sitting in OneDrive, so a
     full look is due periodically even when this device has changed nothing. */
  const overdue = !meta.docsCheckedAt || (Date.now() - meta.docsCheckedAt > 43200000);
  if (!gaps && !strays && !overdue && sig === meta.docsSig) return;

  const remote = await docRemoteList();
  if (remote === null) return;

  for (const d of listed) {
    const here = localKeys.includes(d.id);
    const there = remote.includes(d.id);
    if (here && !there) await docUpload(d.id);
    else if (!here && there) {
      const b = await docDownload(d.id);
      if (b) { try { await docPut(d.id, b); } catch (e) {} }
    }
  }
  /* Nothing references these any more. Local strays always go; remote strays
     only when the state is known to be current. */
  for (const k of localKeys) {
    if (!listed.some((d) => d.id === k)) { try { await docDel(k); } catch (e) {} }
  }
  if (canGc) {
    for (const id of remote) {
      if (!listed.some((d) => d.id === id)) await docRemoteDelete(id);
    }
  }
  setSyncMeta({ docsSig: sig, docsCheckedAt: Date.now() });
}

/* -------------------------------------------------------------- NFA sheet */
function nfaSheet(id) {
  const x = byId(S.nfa, id);
  if (!x) { closeSheet(); return; }
  const wait = daysBetween(x.form4Submitted, x.approved);
  const waiting = !x.approved ? daysBetween(x.form4Submitted, today()) : null;
  const docs = docsFor("nfa", id);

  let h = `<dl class="card">
    <div class="kv"><dt>Type</dt><dd style="font-family:var(--sans)">${esc(x.kind || "\u2014")}</dd></div>
    <div class="kv"><dt>Serial</dt><dd>${esc(x.serial || "\u2014")}</dd></div>
    <div class="kv"><dt>Form 4 submitted</dt><dd>${esc(dshow(x.form4Submitted))}</dd></div>
    <div class="kv"><dt>Approved</dt><dd>${esc(dshow(x.approved))}</dd></div>
    ${wait != null ? `<div class="kv"><dt>Wait</dt><dd>${fmt(wait)} days</dd></div>`
      : waiting != null ? `<div class="kv"><dt>Waiting</dt><dd>${fmt(waiting)} days so far</dd></div>` : ""}
    <div class="kv"><dt>Rounds through it</dt><dd>${fmt(x.roundsFired)}</dd></div>
  </dl>`;

  if (x.notes) h += `<div class="note" style="margin-top:12px">${esc(x.notes)}</div>`;

  h += `<section class="blk" style="margin-top:16px"><h2 style="font-size:1rem">Paperwork</h2>`;
  if (!docs.length) {
    h += `<div class="empty"><b>No documents</b>Attach the approved Form 4 so it is with
      you at the range rather than in a folder at home.</div>`;
  } else {
    h += `<div class="rows">` + docs.map((d) => `
      <div class="row" style="align-items:flex-start;flex-direction:column;gap:8px">
        <span style="display:flex;width:100%;gap:10px;align-items:baseline">
          <span class="grow"><span class="ttl">${esc(d.name)}</span>
          <span class="meta">${esc(kb(d.size))}${d.addedOn ? " \u00b7 added " + esc(d.addedOn) : ""}</span></span>
        </span>
        <span class="btnrow">
          <button class="btn sm" data-act="doc-open" data-id="${esc(d.id)}">Open</button>
          <button class="btn sm" data-act="doc-save" data-id="${esc(d.id)}">Save</button>
          <button class="btn sm" data-act="doc-rename" data-id="${esc(d.id)}">Rename</button>
          <button class="btn sm dgr" data-act="doc-del" data-id="${esc(d.id)}">Delete</button>
        </span></div>`).join("") + `</div>`;
  }
  h += `<button class="btn ${docs.length ? "" : "pri"} wide" style="margin-top:10px"
    data-act="doc-add" data-id="${esc(id)}">Attach a PDF</button>
    <p class="hint" style="margin-top:8px">${linked()
      ? "Stored on this device and copied to your OneDrive app folder, so it reaches your other devices."
      : "Stored on this device only. Connect OneDrive to have paperwork follow you."}
      Up to 4 MB per file.</p></section>`;

  h += `<div class="btnrow" style="margin-top:6px">
    <button class="btn sm" data-act="nfa-edit" data-id="${esc(id)}">Edit details</button>
    <button class="btn sm dgr" data-act="nfa-del" data-id="${esc(id)}">Delete item</button></div>`;

  openSheet(x.model, h);
}
</script>
<script>
"use strict";
/* ==========================================================================
   Snapshots.

   A browser cannot choose where a download lands. showSaveFilePicker would
   let the app write to a folder you pick and keep writing there, but Firefox
   has taken a negative position on it and Safari opposes it, so it does not
   exist in any browser Mike uses.

   The way to get "export to a specified path" is to stop going through the
   download folder. The app already talks to OneDrive, so it writes
   timestamped copies to Apps/Armory/backups/ directly. With the OneDrive
   client installed that folder is a real directory on the PC, which means
   the snapshots land on disk at a known path with no dialog and no clicking.

   Sync is not a backup: it faithfully copies a mistake everywhere. These are,
   because each one is a separate immutable file with the time in its name.
   ========================================================================== */

const BK_DIR = `${GRAPH}/me/drive/special/approot:/backups`;
const BK_KEEP = 20;          // roughly a season of trips
const BK_EVERY = 86400000;   // at most one automatic snapshot a day

/* Seconds are in the name deliberately. At minute resolution a closeout snapshot
   and a manual one taken moments later share a filename, and the second silently
   overwrites the first. A snapshot that can be destroyed by another snapshot is
   not a snapshot. */
function bkName(d) {
  const p = (v) => String(v).padStart(2, "0");
  return `armory-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
    + `-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`;
}

/* Create the folder in its own request rather than relying on the upload to
   create missing parents. One more round trip, no assumption. 409 means it is
   already there, which is the normal case. */
async function bkEnsureFolder() {
  const r = await graph(`${GRAPH}/me/drive/special/approot/children`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: "backups", folder: {},
      "@microsoft.graph.conflictBehavior": "fail" }),
  });
  if (!r || r.needsAuth) return false;
  return r.ok || r.status === 409;
}

/* A free filename, found by asking. Seconds in the stamp make a clash rare; this
   makes overwriting a previous snapshot impossible. Done with a plain HEAD-style
   GET rather than a conflictBehavior query parameter, because a bare path upload
   is the request shape already known to work for the state file and the PDFs. */
async function bkFreeName() {
  const base = bkName(new Date()).replace(/\.json$/, "");
  for (let i = 0; i < 5; i++) {
    const nm = (i ? `${base}-${i + 1}` : base) + ".json";
    const r = await graph(`${BK_DIR}/${encodeURIComponent(nm)}?$select=name`);
    if (!r || r.needsAuth) return nm;
    if (r.status === 404) return nm;
  }
  return `${base}-${Math.random().toString(36).slice(2, 6)}.json`;
}

/* Pass json to snapshot something other than the current state, which is how
   the pre-import copy is taken before the state is replaced. */
async function backupNow(json, silent) {
  if (!linked()) { if (!silent) toast("Connect OneDrive to keep snapshots there."); return false; }
  const body = json || JSON.stringify(S);
  try {
    await bkEnsureFolder();
    const name = await bkFreeName();
    const r = await graph(`${BK_DIR}/${encodeURIComponent(name)}:/content`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body,
    });
    if (!r || r.needsAuth) {
      setSyncMeta({ lastBackupError: "Sign-in expired before the snapshot could be written." });
      if (!silent) toast("Sign in again to write snapshots.");
      return false;
    }
    if (!r.ok) {
      /* A snapshot that fails quietly is worse than no snapshot, so the status
         is kept and shown on the Data screen. */
      let detail = "";
      try {
        const j = await r.res.json();
        detail = (j && j.error && (j.error.message || j.error.code)) || "";
      } catch (e) {}
      setSyncMeta({ lastBackupError: `OneDrive refused the snapshot (${r.status})`
        + (detail ? `: ${String(detail).slice(0, 140)}` : "") });
      if (!silent) toast(`OneDrive refused the snapshot (${r.status}).`);
      return false;
    }
    const saved = await r.res.json().catch(() => ({}));
    setSyncMeta({ lastBackup: Date.now(), lastBackupName: saved.name || name,
      lastBackupError: null });
    bkPrune().catch(() => {});
    if (!silent) toast("Snapshot saved to OneDrive.");
    return true;
  } catch (e) {
    setSyncMeta({ lastBackupError: (e && e.message) || "The snapshot request failed." });
    if (!silent) toast("Could not reach OneDrive for the snapshot.");
    return false;
  }
}

async function bkList() {
  const r = await graph(`${BK_DIR}:/children?$select=name,size,lastModifiedDateTime&$top=100`);
  if (!r || r.needsAuth) return null;
  if (r.status === 404) return [];
  if (!r.ok) return null;
  const j = await r.res.json().catch(() => ({}));
  return (j.value || [])
    .filter((x) => /\.json$/i.test(x.name))
    .sort((a, b) => String(b.name).localeCompare(String(a.name)));
}

async function bkPrune() {
  const all = await bkList();
  if (!all) return;
  for (const f of all.slice(BK_KEEP)) {
    await graph(`${BK_DIR}/${encodeURIComponent(f.name)}`, { method: "DELETE" });
  }
}

/* Daily at most, and never in place of the one taken after a trip. */
async function maybeBackup() {
  if (!linked() || CONFLICT) return;
  if (Date.now() - int(syncMeta().lastBackup) < BK_EVERY) return;
  await backupNow(null, true);
}

ACT["backup-now"] = async () => {
  toast("Writing a snapshot\u2026");
  await backupNow(null, false);
  render();
};

ACT["backup-browse"] = async () => {
  openSheet("Snapshots in OneDrive", `<div class="empty">Looking\u2026</div>`);
  const all = await bkList();
  if (all === null) {
    reSheet("Snapshots in OneDrive", `<div class="note flag">Could not read the backups
      folder. Check the sign-in on the Data screen.</div>
      <button class="btn wide" data-act="sheet-close">Close</button>`);
    return;
  }
  if (!all.length) {
    reSheet("Snapshots in OneDrive", `<div class="empty"><b>No snapshots yet</b>One is
      written after each range trip, once a day otherwise, and before any import.</div>
      <button class="btn pri wide" style="margin-top:10px" data-act="backup-now">Write one now</button>`);
    return;
  }
  reSheet("Snapshots in OneDrive", `
    <p class="hint">Newest first. The most recent ${BK_KEEP} are kept; older ones are
      removed automatically. On the PC these are in your OneDrive folder under
      <b>Apps\\Armory\\backups</b>.</p>
    <div class="rows">${all.map((f) => {
      const stamp = String(f.name).replace(/^armory-/, "").replace(/\.json$/, "");
      const m = stamp.match(/^(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})?$/);
      const label = m ? `${m[1]}-${m[2]}-${m[3]} at ${m[4]}:${m[5]}` : stamp;
      return `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
        <span style="display:flex;gap:10px;align-items:baseline">
          <span class="grow"><span class="ttl">${esc(label)}</span>
          <span class="meta">${esc(kb(f.size))}</span></span></span>
        <span class="btnrow">
          <button class="btn sm" data-act="backup-restore" data-id="${esc(f.name)}">Restore</button>
          <button class="btn sm dgr" data-act="backup-del" data-id="${esc(f.name)}">Delete</button>
        </span></div>`;
    }).join("")}</div>`);
};

ACT["backup-restore"] = async (name) => {
  toast("Fetching that snapshot\u2026");
  const r = await graph(`${BK_DIR}/${encodeURIComponent(name)}:/content`);
  if (!r || r.needsAuth || !r.ok) { toast("Could not read that snapshot."); return; }
  let st = null;
  try { st = await r.res.json(); } catch (e) {}
  if (!st || !Array.isArray(st.firearms)) { toast("That file is not readable as a backup."); return; }
  /* Straight into the same preview the file import uses, so restoring shows you
     what you are about to replace rather than just doing it. */
  importPreview(st, name);
};

ACT["backup-del"] = async (name) => {
  if (!confirm(`Delete the snapshot ${name}?`)) return;
  const r = await graph(`${BK_DIR}/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (!r || !(r.ok || r.status === 404)) { toast("Could not delete it."); return; }
  toast("Deleted.");
  ACT["backup-browse"]();
};

/* Reports what the app can actually see, so "I cannot find the folder" becomes a
   question with an answer instead of a guess. */
ACT["backup-diagnose"] = async () => {
  openSheet("Checking", `<div class="empty">Asking OneDrive\u2026</div>`);
  const lines = [];
  const folder = await graph(`${BK_DIR}?$select=name,id,folder`);
  lines.push(["backups folder", folder && folder.needsAuth ? "sign-in expired"
    : folder && folder.ok ? "exists" : folder ? `missing (${folder.status})` : "request failed"]);
  if (folder && !folder.ok && !folder.needsAuth) {
    const made = await bkEnsureFolder();
    lines.push(["create it", made ? "created" : "could not create"]);
  }
  const all = await bkList();
  lines.push(["snapshots visible", all === null ? "could not list" : String(all.length)]);
  const root = await graph(`${GRAPH}/me/drive/special/approot?$select=name,webUrl`);
  let where = "";
  if (root && root.ok) {
    const j = await root.res.json().catch(() => ({}));
    where = j.webUrl || "";
    lines.push(["app folder", j.name || "?"]);
  }
  const m = syncMeta();
  if (m.lastBackupError) lines.push(["last error", m.lastBackupError]);

  reSheet("Backups folder check", `
    <dl class="card">${lines.map(([k, v]) =>
      `<div class="kv"><dt>${esc(k)}</dt><dd style="font-family:var(--sans);text-align:right">${esc(v)}</dd></div>`
    ).join("")}</dl>
    ${where ? `<p class="hint" style="margin-top:12px;word-break:break-all">The app folder
      OneDrive reports is:<br>${esc(where)}</p>` : ""}
    <div class="btnrow split" style="margin-top:12px">
      <button class="btn pri" data-act="backup-now">Write one now</button>
      <button class="btn" data-act="backup-browse">Browse</button>
    </div>`);
};

function backupPanel() {
  if (!linked()) {
    return `<section class="blk"><h2>Snapshots</h2>
      <div class="note">Connect OneDrive and the app will write timestamped copies to
        <b>Apps/Armory/backups</b> by itself: after every range trip, once a day
        otherwise, and before any import. With the OneDrive client installed on the PC
        that folder is a real directory on disk, which is as close to "export to a
        chosen path" as a browser can get. No browser can pick your download folder
        for you.</div></section>`;
  }
  const m = syncMeta();
  return `<section class="blk"><h2>Snapshots</h2>
    <p class="hint">Written to <b>Apps/Armory/backups</b> after every range trip, once a
      day otherwise, and before any import. The newest ${BK_KEEP} are kept. On the PC
      that is your OneDrive folder under <b>Apps\\Armory\\backups</b>, so they are on
      disk without you saving anything.</p>
    ${m.lastBackupError ? `<div class="note flag">${esc(m.lastBackupError)}</div>` : ""}
    <dl class="card">
      <div class="kv"><dt>Last snapshot</dt><dd>${m.lastBackup ? esc(agoText(m.lastBackup)) : "\u2014"}</dd></div>
      ${m.lastBackupName ? `<div class="kv"><dt>Named</dt><dd style="font-size:0.75rem">${esc(m.lastBackupName)}</dd></div>` : ""}
    </dl>
    <div class="btnrow split" style="margin-top:10px">
      <button class="btn" data-act="backup-now">Snapshot now</button>
      <button class="btn" data-act="backup-browse">Browse snapshots</button>
    </div>
    <button class="btn wide" style="margin-top:8px" data-act="backup-diagnose">Check the backups folder</button>
    </section>`;
}
</script>
<script>
"use strict";

/* ========================================================= VELOCITY ==== */
let VEL_OPEN = null;   // firearm keys whose strings are showing

function velKey(v) {
  if (v.firearmId && gun(v.firearmId)) return v.firearmId;
  return "name:" + (v.firearmName || "");
}

function velCard(v) {
  const st = vstats(v.shots);
  if (!st) return "";
  const span = Math.max(st.es, 1);
  return `<div class="card" style="margin-bottom:8px">
    <button class="row" style="padding:0;border:0;width:100%" data-act="vel-open" data-id="${esc(v.id)}">
      <span class="grow"><span class="ttl">${esc(v.ammoLabel)}</span>
      <span class="meta">${v.barrelLengthIn ? v.barrelLengthIn + "in" : "length not set"}
        &middot; ${st.n} shots${v.date ? " \u00b7 " + esc(v.date) : ""}</span></span>
      <span class="chev">&rsaquo;</span></button>
    <div class="counter" style="margin-top:6px"><span class="big" style="font-size:2rem">${Math.round(st.avg)}</span>
      <span class="unit">fps average</span></div>
    <div class="split-nums">
      <div><span>SD</span><b>${st.sd.toFixed(1)}</b></div>
      <div><span>Spread</span><b>${fmt(st.es)}</b></div>
      <div><span>Low</span><b>${fmt(st.lo)}</b></div>
      <div><span>High</span><b>${fmt(st.hi)}</b></div>
    </div>
    <div class="stripe">${v.shots.map((s) => {
      const rel = (s - st.lo) / span;
      return `<i class="${Math.abs(s - st.avg) > st.sd ? "" : "hi"}"
        style="height:${(28 * (0.35 + 0.65 * rel)).toFixed(0)}px" title="${s}"></i>`;
    }).join("")}</div>
    <div class="mono-list" style="margin-top:6px">${v.shots.join("  ")}</div>
  </div>`;
}

RENDER.velocity = function () {
  const allKeys = [];
  S.velocity.forEach((v) => { const k = velKey(v); if (!allKeys.includes(k)) allKeys.push(k); });
  const everyOpen = VEL_OPEN !== null && allKeys.length && VEL_OPEN.length >= allKeys.length;
  let h = `<section class="blk"><h2>Velocity<span class="btnrow">
    ${allKeys.length > 1 ? `<button class="btn sm" data-act="vel-allopen"
      data-v="${everyOpen ? "0" : "1"}">${everyOpen ? "Collapse all" : "Expand all"}</button>` : ""}
    <button class="btn sm" data-act="vel-new">Add</button></span></h2>
    <p class="hint">Pick a firearm to see its loads. Average tells you where a load sits;
      SD and extreme spread tell you whether it will hold at distance.</p></section>`;
  if (!S.velocity.length) return h + emptyState("No strings yet",
    "Record a chronograph string and the stats come with it.", "Add a string", "vel-new");

  /* Build the branches: firearms that have data, in inventory order, then any
     string whose firearm is not in the list. */
  const branches = [];
  S.firearms.forEach((f) => {
    const items = S.velocity.filter((v) => velKey(v) === f.id);
    if (items.length) branches.push({ key: f.id, name: f.name,
      caliber: f.caliber || "Caliber not set", items });
  });
  const orphan = S.velocity.filter((v) => !S.firearms.some((f) => velKey(v) === f.id));
  const seen = [];
  orphan.forEach((v) => {
    const k = velKey(v);
    if (seen.includes(k)) return;
    seen.push(k);
    branches.push({ key: k, name: v.firearmName || "Unassigned",
      caliber: "Not linked to a firearm",
      items: orphan.filter((x) => velKey(x) === k) });
  });

  /* One branch is not a tree worth collapsing. */
  if (VEL_OPEN === null) VEL_OPEN = branches.length === 1 ? [branches[0].key] : [];

  const cals = [];
  branches.forEach((b) => { if (!cals.includes(b.caliber)) cals.push(b.caliber); });
  /* Follow the arrangement set on the other screens. */
  const pref = caliberOrder();
  cals.sort((a, b) => {
    const ia = pref.indexOf(a), ib = pref.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
  });

  h += `<section class="blk"><div class="tree">`;
  cals.forEach((cal) => {
    const inCal = branches.filter((b) => b.caliber === cal);
    const nStrings = inCal.reduce((t, b) => t + b.items.length, 0);
    h += `<div class="grouphead"><span>${esc(cal)}</span>
      <span class="num">${nStrings === 1 ? "1 load" : nStrings + " loads"}</span></div>`;
    h += inCal.map((b) => {
      const open = VEL_OPEN.includes(b.key);
      const lens = Array.from(new Set(b.items.map((v) => v.barrelLengthIn).filter(Boolean)));
      const avgs = b.items.map((v) => (vstats(v.shots) || {}).avg).filter(Boolean);
      const sub = [
        lens.length ? lens.map((l) => l + "in").join(", ") : null,
        avgs.length ? Math.round(Math.min(...avgs)) + "\u2013" + Math.round(Math.max(...avgs)) + " fps" : null,
      ].filter(Boolean).join(" \u00b7 ");
      return `<div class="node${open ? " open" : ""}">
        <button class="nodehead" data-act="vel-toggle" data-id="${esc(b.key)}"
          aria-expanded="${open}">
          <span class="tw">&rsaquo;</span>
          <span class="nm"><b>${esc(b.name)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</span>
          <span class="ct">${b.items.length}</span>
        </button>
        ${open ? `<div class="nodebody">
          ${b.items.map(velCard).join("")}
          <button class="btn sm wide" data-act="vel-add-for" data-id="${esc(b.key)}"
            style="margin-top:2px">Add a string for ${esc(b.name)}</button>
        </div>` : ""}</div>`;
    }).join("");
  });
  h += `</div></section>`;

  h += `<section class="blk"><button class="btn wide" data-act="vel-export">Export velocity data</button>
    <p class="hint" style="margin-top:8px">JSON with shots and stats per string, for MSDope
      or any other solver.</p></section>`;
  return h;
};

ACT["vel-toggle"] = (key) => {
  if (VEL_OPEN === null) VEL_OPEN = [];
  VEL_OPEN = VEL_OPEN.includes(key)
    ? VEL_OPEN.filter((k) => k !== key)
    : VEL_OPEN.concat([key]);
  render();
};

ACT["vel-allopen"] = (_id, v) => {
  if (v === "1") {
    const keys = [];
    S.velocity.forEach((x) => { const k = velKey(x); if (!keys.includes(k)) keys.push(k); });
    VEL_OPEN = keys;
  } else VEL_OPEN = [];
  render();
};

ACT["vel-add-for"] = (key) => velEdit(null, key);

ACT["vel-new"] = () => velEdit(null);
ACT["vel-open"] = (id) => velEdit(id);

function velEdit(id, presetKey) {
  const v = id ? byId(S.velocity, id) : { firearmId: "", firearmName: "", ammoId: "",
    ammoLabel: "", barrelLengthIn: null, date: today(), shots: [], notes: "" };
  if (!id && presetKey && !String(presetKey).startsWith("name:")) {
    const pf = gun(presetKey);
    if (pf) {
      v.firearmId = pf.id;
      if (pf.barrel && pf.barrel.lengthIn) v.barrelLengthIn = pf.barrel.lengthIn;
    }
  }
  openSheet(id ? v.ammoLabel : "Add a string", `
    <div class="f2">
      <label class="f"><span>Firearm</span><select name="firearmId">
        <option value="">Unassigned</option>${selOptsGrouped(S.firearms, v.firearmId,
          (x) => x.name, (x) => x.caliber || "Caliber not set")}</select></label>
      <label class="f"><span>Barrel length (in)</span><input type="number" step="0.1" name="barrelLengthIn"
        value="${v.barrelLengthIn == null ? "" : v.barrelLengthIn}"></label>
    </div>
    <label class="f"><span>Ammunition</span><select name="ammoId">
      <option value="">Not linked</option>${selOptsGrouped(S.ammo, v.ammoId, ammoLabel, (x) => x.caliber)}</select></label>
    <label class="f"><span>Label</span><input name="ammoLabel" value="${esc(v.ammoLabel)}" placeholder="ADI F1 62gr"></label>
    <label class="f"><span>Date</span><input type="date" name="date" value="${esc(v.date || "")}"></label>
    <label class="f"><span>Shots (fps)</span><input name="shots" inputmode="numeric"
      value="${esc((v.shots || []).join(", "))}" placeholder="2754, 2747, 2713"></label>
    <p class="hint" style="margin:-6px 0 12px">Separate with commas or spaces.</p>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(v.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="vel-save" data-id="${esc(id || "")}">${id ? "Save" : "Add string"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="vel-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}

ACT["vel-save"] = (id) => {
  const f = readForm($("#sheetbody"));
  const shots = String(f.shots || "").split(/[\s,;]+/).map(n).filter((x) => x > 0);
  if (!shots.length) { toast("Enter at least one velocity."); return; }
  const label = String(f.ammoLabel || "").trim()
    || (f.ammoId ? ammoLabel(ammoOf(f.ammoId)) : "");
  if (!label) { toast("Give the load a label."); return; }
  const isNew = !id;
  snapshot(isNew ? "add velocity string" : "edit velocity string");
  const v = isNew ? { id: uid("v") } : byId(S.velocity, id);
  Object.assign(v, {
    firearmId: f.firearmId || null,
    firearmName: f.firearmId && gun(f.firearmId) ? gun(f.firearmId).name : (v.firearmName || ""),
    ammoId: f.ammoId || null, ammoLabel: label,
    barrelLengthIn: f.barrelLengthIn == null ? null : n(f.barrelLengthIn),
    date: f.date || null, shots, notes: f.notes || "",
  });
  if (isNew) {
    S.velocity.push(v);
    const k = velKey(v);
    if (VEL_OPEN && !VEL_OPEN.includes(k)) VEL_OPEN = VEL_OPEN.concat([k]);
  }
  commit(isNew ? "String added." : "Saved."); closeSheet();
};

ACT["vel-del"] = (id) => {
  if (!confirm("Delete this string?")) return;
  snapshot("delete velocity string");
  S.velocity = S.velocity.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};

ACT["vel-export"] = () => {
  const out = S.velocity.map((v) => {
    const st = vstats(v.shots) || {};
    return {
      firearm: v.firearmId && gun(v.firearmId) ? gun(v.firearmId).name : v.firearmName,
      barrelLengthIn: v.barrelLengthIn, load: v.ammoLabel,
      caliber: v.ammoId && ammoOf(v.ammoId) ? ammoOf(v.ammoId).caliber : null,
      grains: v.ammoId && ammoOf(v.ammoId) ? ammoOf(v.ammoId).grains : null,
      date: v.date, shots: v.shots,
      avgFps: st.avg ? Math.round(st.avg) : null,
      sd: st.sd != null ? Number(st.sd.toFixed(2)) : null,
      extremeSpread: st.es != null ? st.es : null,
    };
  });
  download(`velocity-${today()}.json`, JSON.stringify({ exported: today(), strings: out }, null, 1));
  toast("Velocity data exported.");
};

/* ============================================================== NFA ===== */
RENDER.nfa = function () {
  let h = `<section class="blk"><h2>NFA items
    <button class="btn sm" data-act="nfa-new">Add</button></h2></section>`;
  if (!S.nfa.length) return h + emptyState("Nothing registered here", "Track serials, Form 4 dates and rounds through each item.", "Add an item", "nfa-new");
  h += `<p class="hint">Attach approved Form 4 paperwork to each item so it travels with
    you.</p><div class="rows">` + S.nfa.map((x) => {
    const wait = daysBetween(x.form4Submitted, x.approved);
    const pending = !x.approved;
    const waiting = pending ? daysBetween(x.form4Submitted, today()) : null;
    const nd = (S.docs || []).filter((d) => d.ownerType === "nfa" && d.ownerId === x.id).length;
    return `<button class="row" data-act="nfa-open" data-id="${esc(x.id)}">
      <span class="grow"><span class="ttl">${esc(x.model)}</span>
      <span class="meta">${esc(x.kind || "")}${x.serial ? " \u00b7 " + esc(x.serial) : ""}
        ${wait != null ? ` \u00b7 approved in ${fmt(wait)} days` : waiting != null ? ` \u00b7 waiting ${fmt(waiting)} days` : ""}</span></span>
      ${nd ? `<span class="tag mute">${nd === 1 ? "1 PDF" : nd + " PDFs"}</span>` : ""}
      <span class="tag ${pending ? "" : "moss"}">${esc(pending ? "pending" : (x.status || "approved").toLowerCase())}</span>
      <span class="chev">&rsaquo;</span></button>`;
  }).join("") + `</div>`;
  return h;
};

ACT["nfa-new"] = () => nfaEdit(null);
ACT["nfa-open"] = (id) => (typeof nfaSheet === "function" ? nfaSheet(id) : nfaEdit(id));
ACT["nfa-edit"] = (id) => nfaEdit(id);

function nfaEdit(id) {
  const x = id ? byId(S.nfa, id) : { model: "", serial: "", kind: "Suppressor",
    form4Submitted: "", approved: "", status: "", roundsFired: 0, notes: "" };
  const wait = daysBetween(x.form4Submitted, x.approved);
  openSheet(id ? x.model : "Add an NFA item", `
    ${wait != null ? `<div class="note">Wait time was ${fmt(wait)} days.</div>` : ""}
    <div class="f2">
      <label class="f"><span>Model</span><input name="model" value="${esc(x.model)}"></label>
      <label class="f"><span>Serial</span><input name="serial" value="${esc(x.serial)}"></label>
      <label class="f"><span>Type</span><input name="kind" value="${esc(x.kind || "")}" placeholder="Suppressor, SBR"></label>
      <label class="f"><span>Rounds through it</span><input type="number" name="roundsFired" value="${int(x.roundsFired)}"></label>
      <label class="f"><span>Form 4 submitted</span><input type="date" name="form4Submitted" value="${esc(x.form4Submitted || "")}"></label>
      <label class="f"><span>Approved</span><input type="date" name="approved" value="${esc(x.approved || "")}"></label>
    </div>
    <label class="f"><span>Status</span><input name="status" value="${esc(x.status || "")}" placeholder="APPROVED, pending"></label>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(x.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="nfa-save" data-id="${esc(id || "")}">${id ? "Save" : "Add item"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="nfa-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}

ACT["nfa-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.model || "").trim()) { toast("Name the item."); return; }
  const isNew = !id;
  snapshot(isNew ? "add NFA item" : "edit " + v.model);
  const x = isNew ? { id: uid("n") } : byId(S.nfa, id);
  Object.assign(x, {
    model: String(v.model).trim(), serial: v.serial || "", kind: v.kind || "",
    form4Submitted: v.form4Submitted || null, approved: v.approved || null,
    status: v.status || "", roundsFired: int(v.roundsFired), notes: v.notes || "",
  });
  if (isNew) S.nfa.push(x);
  commit(isNew ? "Item added." : "Saved.");
  if (typeof nfaSheet === "function") nfaSheet(x.id); else closeSheet();
};
ACT["nfa-del"] = (id) => {
  const docs = (S.docs || []).filter((d) => d.ownerType === "nfa" && d.ownerId === id);
  if (!confirm(docs.length
    ? `Delete this item and its ${docs.length === 1 ? "attached PDF" : docs.length + " attached PDFs"}?`
    : "Delete this item?")) return;
  snapshot("delete NFA item");
  S.nfa = S.nfa.filter((x) => x.id !== id);
  S.docs = (S.docs || []).filter((d) => !(d.ownerType === "nfa" && d.ownerId === id));
  docs.forEach((d) => { if (typeof docDel === "function") docDel(d.id).catch(() => {}); });
  commit("Deleted."); closeSheet();
  if (typeof syncNow === "function" && linked()) syncNow(false);
};

/* ============================================================ TOOLS ==== */
let WT = { containerId: "", tare: 0, gross: 0, ammoId: "", ref10: 0, res: 1 };
let WTT = null;

RENDER.tools = function () {
  const a = WT.ammoId ? ammoOf(WT.ammoId) : null;
  const ref10 = WT.ref10 || (a && a.ref10G) || 0;
  const tare = WT.containerId === "__custom" ? n(WT.tare)
    : (byId(S.containers, WT.containerId) || {}).tareG || n(WT.tare);
  const net = n(WT.gross) - n(tare);
  const per = ref10 / 10;
  let est = null, lo = null, hi = null;
  if (per > 0 && net > 0) {
    est = net / per;
    const res = Math.max(n(WT.res), 0.1);
    // Two weighings carry scale error, and the reference weight carries its own.
    const relErr = (2 * res) / net + (res / Math.max(ref10, res));
    lo = est * (1 - relErr); hi = est * (1 + relErr);
  }

  let h = `<section class="blk"><h2>Count ammo by weight</h2>
    <p class="hint">Weigh the full container, subtract the empty weight, divide by the weight
      of ten rounds. Good for a can you do not want to hand count.</p>
    <div class="card">
      <label class="f"><span>Container</span><select name="containerId" data-wt="containerId">
        <option value="">Pick one</option>
        ${selOpts(S.containers, WT.containerId, (c) => `${c.name} \u2014 ${c.tareG}g`)}
        <option value="__custom"${WT.containerId === "__custom" ? " selected" : ""}>Weigh it myself</option>
      </select></label>
      ${WT.containerId === "__custom" ? `<label class="f"><span>Empty container weight (g)</span>
        <input type="number" step="0.1" data-wt="tare" value="${WT.tare || ""}"></label>` : ""}
      <label class="f"><span>Full weight (g)</span>
        <input type="number" step="0.1" data-wt="gross" value="${WT.gross || ""}"></label>
      <label class="f"><span>Which ammunition</span><select data-wt="ammoId">
        <option value="">Not linked</option>${selOptsGrouped(S.ammo, WT.ammoId, ammoLabel, (x) => x.caliber)}</select></label>
      <label class="f"><span>Weight of ten rounds (g)</span>
        <input type="number" step="0.1" data-wt="ref10" value="${ref10 || ""}"></label>
      <label class="f"><span>Scale resolution (g)</span>
        <input type="number" step="0.1" data-wt="res" value="${WT.res}"></label>
    </div></section>`;

  h += `<section class="blk">`;
  if (est == null) {
    h += `<div class="empty">Enter a full weight and the weight of ten rounds to get a count.</div>`;
  } else {
    h += `<div class="card"><div class="counter"><span class="big">${fmt(est)}</span>
      <span class="unit">rounds, give or take</span></div>
      <dl style="margin-top:10px">
        <div class="kv"><dt>Likely range</dt><dd>${fmt(lo)} to ${fmt(hi)}</dd></div>
        <div class="kv"><dt>Ammunition weight</dt><dd>${net.toFixed(1)} g</dd></div>
        <div class="kv"><dt>Per round</dt><dd>${per.toFixed(2)} g</dd></div>
      </dl>
      <p class="hint" style="margin:10px 0 0">A count from weight is an estimate. The range
        widens with a coarser scale and a lighter reference sample \u2014 weigh twenty or fifty
        rounds instead of ten to tighten it.</p>
      ${a ? `<div class="btnrow" style="margin-top:12px">
        <button class="btn sm" data-act="wt-apply" data-v="${Math.round(est)}">Set loose count to ${fmt(est)}</button>
        ${ref10 ? `<button class="btn sm" data-act="wt-saveref" data-v="${ref10}">Remember this reference</button>` : ""}
      </div>` : ""}</div>`;
  }
  h += `</section>`;

  h += `<section class="blk"><h2>Containers
    <button class="btn sm" data-act="cont-new">Add</button></h2>
    <div class="rows">` + (S.containers.length ? S.containers.map((c) =>
      `<button class="row" data-act="cont-open" data-id="${esc(c.id)}">
        <span class="grow"><span class="ttl">${esc(c.name)}</span></span>
        <span class="num">${c.tareG} g</span><span class="chev">&rsaquo;</span></button>`).join("")
      : `<div style="padding:16px" class="hint">No containers saved.</div>`) + `</div></section>`;
  return h;
};

ACT["wt-apply"] = (_id, v) => {
  const a = ammoOf(WT.ammoId);
  if (!a) return;
  if (!confirm(`Set the loose count for ${ammoLabel(a)} to ${fmt(v)}? The current figure is ${fmt(a.qtyLoose)}.`)) return;
  snapshot("weight count, " + ammoLabel(a));
  a.qtyLoose = int(v);
  S.ledger.push({ id: uid("lg"), at: today(), kind: "weighcount", ammoId: a.id, to: int(v) });
  commit("Loose count updated.");
};
ACT["wt-saveref"] = (_id, v) => {
  const a = ammoOf(WT.ammoId);
  if (!a) return;
  snapshot("save reference weight");
  a.ref10G = n(v);
  commit("Reference weight saved to that line.");
};
ACT["cont-new"] = () => contEdit(null);
ACT["cont-open"] = (id) => contEdit(id);
function contEdit(id) {
  const c = id ? byId(S.containers, id) : { name: "", tareG: null };
  openSheet(id ? c.name : "Add a container", `
    <label class="f"><span>Name</span><input name="name" value="${esc(c.name)}" placeholder="ammo can 2"></label>
    <label class="f"><span>Empty weight (g)</span><input type="number" step="0.1" name="tareG" value="${c.tareG == null ? "" : c.tareG}"></label>
    <button class="btn pri wide" data-act="cont-save" data-id="${esc(id || "")}">${id ? "Save" : "Add"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="cont-del" data-id="${esc(id)}">Delete</button>` : ""}`);
}
ACT["cont-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.name || "").trim() || v.tareG == null) { toast("Name and empty weight are both needed."); return; }
  snapshot(id ? "edit container" : "add container");
  const c = id ? byId(S.containers, id) : { id: uid("c") };
  c.name = String(v.name).trim(); c.tareG = n(v.tareG);
  if (!id) S.containers.push(c);
  commit("Saved."); closeSheet();
};
ACT["cont-del"] = (id) => {
  snapshot("delete container");
  S.containers = S.containers.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};

/* ============================================================= DATA ==== */
RENDER.data = function () {
  const rounds = S.ammo.reduce((t, a) => t + onHand(a), 0);
  const ul = undoLabel();
  return (typeof syncPanel === "function" ? syncPanel() : "") +
  (typeof backupPanel === "function" ? backupPanel() : "") +
  (typeof platformPanel === "function" ? platformPanel() : "") +
  `<section class="blk"><h2>Export a file</h2>
    <p class="hint">Goes to whatever folder your browser downloads to; no browser lets
      a page choose that. In Firefox, Settings then Downloads, tick "Always ask you
      where to save files" if you want a folder prompt each time. For unattended copies
      at a fixed path, use snapshots above instead.</p>
    <div class="btnrow split">
      <button class="btn pri" data-act="data-export">Export a backup</button>
      <button class="btn" data-act="data-import">Import a backup</button>
    </div>
    <input type="file" id="importfile" accept=".json,application/json" class="sr"></section>

  <section class="blk"><h2>What is in here</h2><dl class="card">
    <div class="kv"><dt>Firearms</dt><dd>${fmt(S.firearms.length)}</dd></div>
    <div class="kv"><dt>Ammunition lines</dt><dd>${fmt(S.ammo.length)}</dd></div>
    <div class="kv"><dt>Rounds on hand</dt><dd>${fmt(rounds)}</dd></div>
    <div class="kv"><dt>Magazine types</dt><dd>${fmt(S.magTypes.length)}</dd></div>
    <div class="kv"><dt>Magazines owned</dt><dd>${fmt(S.magTypes.reduce((t, m) => t + int(m.quantity), 0))}</dd></div>
    <div class="kv"><dt>Magazines loaded</dt><dd>${fmt(S.magLoads.length)}</dd></div>
    <div class="kv"><dt>Trips closed</dt><dd>${fmt(S.trips.filter((t) => t.status === "closed").length)}</dd></div>
    <div class="kv"><dt>Velocity strings</dt><dd>${fmt(S.velocity.length)}</dd></div>
    <div class="kv"><dt>Attached PDFs</dt><dd id="docsize">${fmt((S.docs || []).length)}</dd></div>
    <div class="kv"><dt>Storage used</dt><dd id="usage">measuring</dd></div>
    <div class="kv"><dt>Storage mode</dt><dd id="persistmode" style="font-family:var(--sans)">checking</dd></div>
  </dl>
  <button class="btn wide" style="margin-top:10px" data-act="persist-ask">Ask this browser to keep the data</button>
  </section>

  ${ul ? `<section class="blk"><h2>Undo</h2>
    <button class="btn wide" data-act="undo">Undo: ${esc(ul)}</button>
    <p class="hint" style="margin-top:8px">The last ${UNDO_MAX} changes can be rolled back one at a time.</p></section>` : ""}

  <section class="blk"><h2>Start over</h2>
    <p class="hint">Erases everything on this device and leaves an empty log. Export first
      if there is any chance you want it back.</p>
    <button class="btn dgr wide" data-act="data-reset">Erase and start empty</button></section>`;
};

function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

ACT["data-export"] = () => {
  download(`armory-${today()}.json`, JSON.stringify(S, null, 1));
  toast("Backup exported.");
};
ACT["data-import"] = () => $("#importfile").click();
ACT["data-reset"] = () => {
  if (!confirm("Erase everything on this device? Anything not exported is gone.")) return;
  snapshot("erase everything");
  S = migrate(JSON.parse(JSON.stringify(SEED)));
  commit("Erased.");
};
ACT["undo"] = () => undoLast();
ACT["sheet-close"] = () => closeSheet();
ACT["go-home"] = () => go("home");
ACT["go-guns"] = () => go("guns");
ACT["go-ammo"] = () => go("ammo");
ACT["go-mags"] = () => go("mags");
ACT["go-velocity"] = () => go("velocity");
ACT["go-nfa"] = () => go("nfa");
ACT["go-tools"] = () => go("tools");
ACT["go-data"] = () => go("data");

/* ========================================================== WIRING ===== */
document.addEventListener("click", (ev) => {
  const nudge = ev.target.closest("[data-nudge]");
  if (nudge) {
    const box = nudge.closest("[data-step]");
    const inp = $("input", box);
    const step = int(nudge.dataset.nudge) * (ev.shiftKey ? 10 : 1);
    const min = inp.min === "" ? -Infinity : n(inp.min);
    inp.value = Math.max(min, int(inp.value) + step);
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  const tab = ev.target.closest("#tabs button");
  if (tab) { RANGEMODE = "trip"; go(tab.dataset.go); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) { console.warn("no handler for", el.dataset.act); return; }
  ev.preventDefault();
  fn(el.dataset.id || null, el.dataset.v);
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.actChange) { (ACT[t.dataset.actChange] || (() => {}))(); return; }
  if (t.dataset && t.dataset.wt) {
    WT[t.dataset.wt] = t.type === "number" ? n(t.value) : t.value;
    if (t.dataset.wt === "ammoId") WT.ref10 = 0;
    if (t.dataset.wt === "containerId") WT.tare = 0;
    render();
    return;
  }
  if (t.id === "docfile" && t.files && t.files[0]) {
    if (typeof acceptDoc === "function") acceptDoc(t.files[0]);
    return;
  }
  if (t.id === "importfile" && t.files && t.files[0]) {
    const fname = t.files[0].name;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const st = JSON.parse(fr.result);
        if (!st || !Array.isArray(st.firearms)) throw new Error("not an armory backup");
        importPreview(st, fname);
      } catch (e) {
        toast("That file is not an armory backup.");
        console.error(e);
      }
      t.value = "";
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.e) { coEdit(t); return; }
  if (t.dataset && t.dataset.wt) {
    WT[t.dataset.wt] = t.type === "number" ? n(t.value) : t.value;
    // Recompute the readout without redrawing the field being typed in.
    clearTimeout(WTT);
    WTT = setTimeout(() => { if (SCREEN === "tools") render(); }, 450);
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet();
});
$("#scrim").addEventListener("click", closeSheet);
$("#sheetx").addEventListener("click", closeSheet);

/* ============================================================= INIT ==== */
S = load();
if (!localStorage.getItem(KEY)) save({ noRev: true });
go("home");

/* Finish any sign-in redirect, then reconcile with OneDrive. */
(async function startSync() {
  if (typeof handleAuthRedirect !== "function") return;
  const justLinked = await handleAuthRedirect();
  if (justLinked) { render(); toast("OneDrive connected."); }
  if (typeof syncNow === "function" && linked()) await syncNow(false);
  if (typeof syncDocs === "function") await syncDocs(!syncMeta().error);
  render();
})();

/* Coming back to the app is the moment another device's changes matter. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { if (DIRTY) save({ noRev: true }); return; }
  if (typeof syncNow === "function" && Date.now() - LAST_CHECK > 30000) syncNow(false);
});
window.addEventListener("online", () => { if (typeof syncNow === "function") syncNow(false); });
setInterval(() => {
  if (typeof syncNow === "function" && document.visibilityState === "visible") syncNow(false);
}, 300000);

if (typeof requestPersist === "function") requestPersist(false).then(() => paintStorage());
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
window.addEventListener("beforeunload", () => { if (DIRTY) save({ noRev: true }); });
</script>
</body>
</html>
