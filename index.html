<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1ED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Armory</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --field:#F2F1ED; --card:#FFFFFF; --card-2:#FAF9F6;
  --ink:#1B1F23; --ink-2:#5C6169; --ink-3:#8C9096;
  --rule:#D6D4CC; --rule-2:#E9E7E0; --zebra:#E9E6DD;
  --brass:#8A6D2F; --brass-soft:#F1E9D6;
  --copper:#A65432; --moss:#47613F; --flag:#A3352B;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --pad:16px; --r:10px;
  --navh:calc(58px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--field); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:var(--navh);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:1.5rem}
h2{font-size:1.0625rem}
h3{font-size:0.9375rem}
a{color:var(--brass)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- layout ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--field);
  border-bottom:1px solid var(--rule);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex;align-items:baseline;gap:10px;
}
header.top .sub{color:var(--ink-2);font-size:0.8125rem}
main{padding:var(--pad);max-width:760px;margin:0 auto}
.screen{display:none}
.screen.on{display:block}
section.blk{margin:0 0 22px}
section.blk>h2{margin:0 0 10px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
section.blk>h2>.btnrow{flex:none;gap:6px}
.hint{color:var(--ink-2);font-size:0.8125rem;margin:0 0 10px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.rows{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;
  background:none;border:0;border-top:1px solid var(--rule-2);text-align:left}
.rows>.row:first-child{border-top:0}
.row.alt{background:var(--zebra)}
.row:active,.row.alt:active{background:#DEDBD1}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:550;font-size:0.9375rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--ink-2);font-size:0.8125rem}
.grouphead{padding:13px 14px 9px;background:var(--card);
  border-top:2px solid var(--brass);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:1.125rem;font-weight:700;letter-spacing:-0.015em;color:var(--ink)}
.grouphead .num{font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.rows>.grouphead:first-child{border-top:0;padding-top:12px}
.chev{color:var(--ink-3);flex:none}

/* ---------- the counter, the one loud element ---------- */
.counter{display:flex;align-items:flex-end;gap:8px;margin:2px 0 0}
.counter .big{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:2.5rem;line-height:0.95;font-weight:500;letter-spacing:-0.03em}
.counter .unit{color:var(--ink-2);font-size:0.8125rem;padding-bottom:4px}
.gauge{margin-top:10px}
.gauge .lbl{display:flex;justify-content:space-between;gap:8px;
  font-size:0.75rem;color:var(--ink-2);margin-bottom:4px}
.gauge .lbl b{font-weight:550;font-family:var(--mono);color:var(--ink)}
.bar{height:3px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:2px}
.bar.warn>i{background:var(--copper)}
.bar.over>i{background:var(--flag)}

/* ---------- pills / tags ---------- */
.tag{display:inline-block;font-size:0.6875rem;font-weight:600;padding:2px 7px;
  border-radius:999px;background:var(--brass-soft);color:var(--brass);white-space:nowrap}
.tag.flag{background:#F6E2E0;color:var(--flag)}
.tag.moss{background:#E4EBE2;color:var(--moss)}
.tag.mute{background:var(--rule-2);color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);
  background:var(--card);font-size:0.9375rem;font-weight:550}
.btn:active{background:var(--card-2)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.pri:active{background:#755C27}
.btn.dgr{color:var(--flag);border-color:#E7C9C5}
.btn.sm{min-height:34px;padding:0 11px;font-size:0.8125rem;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:0.42}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow.split>.btn{flex:1}
.linkbtn{background:none;border:0;padding:0;color:var(--brass);font-size:0.8125rem;font-weight:550}

/* ---------- forms ---------- */
label.f{display:block;margin:0 0 11px}
label.f>span{display:block;font-size:0.8125rem;color:var(--ink-2);margin-bottom:4px}
input,select,textarea{
  width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:76px;resize:vertical;line-height:1.4}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
fieldset{border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin:0 0 12px}
legend{font-size:0.8125rem;font-weight:600;color:var(--ink-2);padding:0 5px}

/* ---------- stepper (brought/returned counts) ---------- */
.step{display:flex;align-items:center;gap:0;border:1px solid var(--rule);
  border-radius:8px;overflow:hidden;background:var(--card)}
.step button{width:44px;min-height:42px;border:0;background:var(--card-2);
  font-size:1.2rem;line-height:1;color:var(--ink-2)}
.step button:active{background:var(--rule-2)}
.step input{border:0;border-radius:0;text-align:center;min-height:42px;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.step input:focus{outline-offset:-2px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,31,35,0.42);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--field);
  border-radius:14px 14px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .22s ease-out;
  box-shadow:0 -2px 24px rgba(27,31,35,0.18)}
.sheet.on{transform:translateY(0)}
.sheet>header{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--rule);flex:none}
.sheet>header h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet>.body{overflow-y:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.x{width:38px;height:38px;border:0;background:none;border-radius:8px;
  font-size:1.35rem;line-height:1;color:var(--ink-2)}
.x:active{background:var(--rule-2)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;transform:translate(-50%,101%);width:660px;
    bottom:0;border-radius:14px 14px 0 0}
  .sheet.on{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.scrim{transition:none}
}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--rule);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:0.6875rem;font-weight:600;color:var(--ink-3);min-height:58px}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brass)}
nav.tabs button .dot{position:absolute;top:6px;margin-left:15px;width:6px;height:6px;
  border-radius:50%;background:var(--flag)}

/* ---------- misc ---------- */
.empty{border:1px dashed var(--rule);border-radius:var(--r);padding:22px 16px;
  text-align:center;color:var(--ink-2);font-size:0.875rem}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:0.9375rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-top:1px solid var(--rule-2);font-size:0.875rem}
.kv:first-child{border-top:0}
.kv dt{color:var(--ink-2);margin:0}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
dl{margin:0}
.note{background:var(--brass-soft);border-radius:8px;padding:10px 12px;
  font-size:0.8125rem;color:#6E5624;margin:0 0 12px}
.note.flag{background:#F6E2E0;color:#7E2A22}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--navh) + 14px);z-index:80;background:var(--ink);color:#fff;
  padding:11px 16px;border-radius:9px;font-size:0.875rem;max-width:88vw;
  opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#E3C57F;font-weight:600;font-size:0.875rem;padding:0}
.split-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-2);
  border-radius:8px;overflow:hidden;margin-top:10px}
.split-nums div{background:var(--card);padding:8px 6px;text-align:center}
.split-nums span{display:block;font-size:0.6875rem;color:var(--ink-2)}
.split-nums b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:550;font-size:0.9375rem}
.stripe{display:flex;gap:2px;margin-top:8px;align-items:flex-end;height:34px}
.stripe i{flex:1;background:var(--brass-soft);border-radius:1px 1px 0 0;min-height:2px}
.stripe i.hi{background:var(--brass)}
.tree{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden}
.node{border-top:1px solid var(--rule-2)}
.tree>.node:first-child{border-top:0}
.nodehead{display:flex;align-items:center;gap:11px;width:100%;padding:14px;
  background:none;border:0;text-align:left;min-height:56px}
.nodehead:active{background:var(--zebra)}
.node.alt>.nodehead{background:var(--zebra)}
.node.alt>.nodehead:active{background:#DEDBD1}
.node.open>.nodehead{background:var(--brass-soft)}
.nodehead .nm{flex:1;min-width:0}
.nodehead .nm b{display:block;font-size:1.0625rem;font-weight:650;letter-spacing:-0.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nodehead .nm span{display:block;font-size:0.8125rem;color:var(--ink-2)}
.nodehead .ct{flex:none;font-size:0.75rem;font-weight:600;color:var(--brass);
  background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
.node.open .nodehead .ct{background:var(--card)}
.tw{flex:none;width:16px;text-align:center;color:var(--ink-3);font-size:1.1rem;
  line-height:1;transition:transform .16s}
.node.open .tw{transform:rotate(90deg);color:var(--brass)}
.nodebody{padding:12px;border-top:1px solid var(--rule);background:var(--card-2)}
.nodebody>.rows{border-color:var(--rule)}
.nodebody>.rows .row:first-child{border-top:0}
.nodebody>.card:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){ .tw{transition:none} }
.calhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:1.125rem;font-weight:700;letter-spacing:-0.015em;
  margin:22px 0 9px;padding-bottom:6px;border-bottom:2px solid var(--brass)}
.calhead:first-child{margin-top:0}
.calhead .num{font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.bucket{padding:11px 0;border-top:1px solid var(--rule-2)}
.bucket:first-of-type{border-top:0}
.bucket .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bucket .top b{font-weight:600;font-size:0.9375rem}
.bucket .avail{font-size:0.75rem;color:var(--ink-2);font-family:var(--mono);flex:none}
.bucket .ctl{display:flex;gap:10px;align-items:center;margin-top:7px}
.bucket .ctl .step{flex:none;width:132px}
.bucket .ctl .of{font-size:0.8125rem;color:var(--ink-2)}
.mono-list{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:0.8125rem;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <h1 id="ttl">Armory</h1>
  <span class="sub" id="subttl"></span>
</header>

<main>
  <div class="screen on" id="sc-home"></div>
  <div class="screen" id="sc-guns"></div>
  <div class="screen" id="sc-ammo"></div>
  <div class="screen" id="sc-mags"></div>
  <div class="screen" id="sc-range"></div>
  <div class="screen" id="sc-velocity"></div>
  <div class="screen" id="sc-nfa"></div>
  <div class="screen" id="sc-tools"></div>
  <div class="screen" id="sc-data"></div>
</main>

<nav class="tabs" id="tabs">
  <button data-go="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg>
    Home</button>
  <button data-go="guns">
    <svg viewBox="0 0 24 24"><path d="M3 9h13l3 3h2"/><path d="M3 9v4h4l1.5 3H12"/><path d="M8 13v3"/></svg>
    Guns</button>
  <button data-go="ammo">
    <svg viewBox="0 0 24 24"><path d="M9 3.5c1.6 1.4 2.4 3.1 2.4 5.2V20H6.6V8.7c0-2.1.8-3.8 2.4-5.2Z"/><path d="M6.6 12h4.8"/><path d="M15 8h4v12h-4z"/></svg>
    Ammo</button>
  <button data-go="mags">
    <svg viewBox="0 0 24 24"><path d="M7 3h10l-1.5 18h-7L7 3Z"/><path d="M7.6 9h8.8"/><path d="M8 15h8"/></svg>
    Mags</button>
  <button data-go="range">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
    Range</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetttl">
  <header><h2 id="sheetttl"></h2><button class="x" id="sheetx" aria-label="Close">&times;</button></header>
  <div class="body" id="sheetbody"></div>
</div>

<input type="file" id="docfile" accept="application/pdf,.pdf" class="sr">

<div class="toast" id="toast"><span id="toastmsg"></span><button id="toastact" hidden></button></div>
<script>
const SEED = {"schemaVersion":1,"firearms":[],"ammo":[],"magTypes":[],"magLoads":[],"trips":[],"velocity":[],"nfa":[],"ledger":[],"containers":[],"schedules":[{"id":"sched-ar","name":"AR maintenance","milestones":[{"rounds":5000,"task":"Check BCG lugs and cam pin for cracks. Extractor, extractor springs, gas rings."},{"rounds":7500,"task":"Extractor, extractor springs, gas rings."},{"rounds":10000,"task":"Replace BCG and buffer spring. Check barrel accuracy."},{"rounds":12500,"task":"Extractor, extractor springs, gas rings."},{"rounds":15000,"task":"Check BCG lugs and cam pin for cracks. Extractor, extractor springs, gas rings."},{"rounds":17500,"task":"Extractor, extractor springs, gas rings."},{"rounds":20000,"task":"Replace BCG, buffer spring, and barrel. Inspect the rifle thoroughly."}]}],"docs":[],"rev":0};
</script>
<script>
"use strict";
/* ==========================================================================
   Armory — offline range and inventory log
   Single file. All data lives on this device in localStorage under KEY.
   Export regularly from Home > Data; that JSON is also the import format
   for the eventual native build.
   ========================================================================== */

const KEY = "armory.state.v1";
const UNDO_KEY = "armory.undo.v1";
const UNDO_MAX = 8;

/* Declared here because every later script registers into them. */
const RENDER = {};     // screen name -> html builder
const ACT = {};        // data-act name -> handler

let S = null;          // live state
let SCREEN = "home";
let DIRTY = false;

/* ---------------------------------------------------------------- helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = (v) => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const int = (v) => Math.round(n(v));
const fmt = (v) => int(v).toLocaleString("en-US");
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const today = () => new Date().toISOString().slice(0, 10);
const dshow = (s) => s ? s : "\u2014";
const plural = (c, s, p) => c === 1 ? `1 ${s}` : `${fmt(c)} ${p || s + "s"}`;

function daysBetween(a, b) {
  if (!a || !b) return null;
  const t = (new Date(b) - new Date(a)) / 86400000;
  return Number.isFinite(t) ? Math.round(t) : null;
}

/* ---------------------------------------------------------------- storage */
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
  if (raw) {
    try { return migrate(JSON.parse(raw)); } catch (e) {
      console.error("Saved data would not parse, falling back to seed.", e);
    }
  }
  return migrate(JSON.parse(JSON.stringify(SEED)));
}

function migrate(st) {
  st.schemaVersion = st.schemaVersion || 1;
  if (st.rev == null) st.rev = 0;
  if (!Array.isArray(st.caliberOrder)) st.caliberOrder = [];
  if (!st.deviceName && typeof defaultDeviceName === "function") st.deviceName = defaultDeviceName();
  const arrays = ["firearms", "ammo", "magTypes", "magLoads", "trips",
                  "velocity", "nfa", "containers", "schedules", "ledger", "docs"];
  arrays.forEach((k) => { if (!Array.isArray(st[k])) st[k] = []; });
  st.firearms.forEach((f) => {
    f.barrel = f.barrel || { label: "Factory", rounds: 0, sinceDeepClean: 0, sinceBarrelClean: 0 };
    f.barrelHistory = f.barrelHistory || [];
    if (f.deepCleanEvery == null) f.deepCleanEvery = 1000;
    if (f.barrelCleanEvery == null) f.barrelCleanEvery = 500;
  });
  return st;
}

/* Every change bumps a revision. Sync uses it to tell "this device has edits
   OneDrive has not seen" from "nothing to send". Pass noRev when writing a copy
   that came from somewhere else, so adopting a remote copy is not itself an edit. */
function save(opts) {
  opts = opts || {};
  if (!opts.noRev) {
    S.rev = int(S.rev) + 1;
    S.updatedAt = new Date().toISOString();
  }
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    DIRTY = false;
  } catch (e) {
    toast("Could not save. Device storage may be full — export your data now.");
    console.error(e);
  }
  if (!opts.noRev && typeof queuePush === "function") queuePush();
}

/* Undo works on whole-state snapshots. The dataset is small enough that this
   is cheaper and far safer than reversing each mutation by hand. */
function snapshot(label) {
  let stack = [];
  try { stack = JSON.parse(localStorage.getItem(UNDO_KEY) || "[]"); } catch (e) {}
  stack.push({ label, at: Date.now(), state: JSON.stringify(S) });
  while (stack.length > UNDO_MAX) stack.shift();
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(stack)); } catch (e) {
    // Snapshots are the first thing to sacrifice under pressure.
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(stack.slice(-2))); } catch (e2) {}
  }
}

function undoLast() {
  let stack = [];
  try { stack = JSON.parse(localStorage.getItem(UNDO_KEY) || "[]"); } catch (e) {}
  const last = stack.pop();
  if (!last) { toast("Nothing to undo."); return; }
  S = migrate(JSON.parse(last.state));
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(stack)); } catch (e) {}
  save(); render();
  toast("Undid: " + last.label);
}

function undoLabel() {
  try {
    const st = JSON.parse(localStorage.getItem(UNDO_KEY) || "[]");
    return st.length ? st[st.length - 1].label : null;
  } catch (e) { return null; }
}

function commit(label) { save(); render(); if (label) toast(label); }

/* ---------------------------------------------------------------- lookups */
const byId = (arr, id) => arr.find((x) => x.id === id) || null;
const gun = (id) => byId(S.firearms, id);
const ammoOf = (id) => byId(S.ammo, id);
const magType = (id) => byId(S.magTypes, id);

const ammoLabel = (a) => a
  ? [a.brand, a.type, a.grains ? a.grains + "gr" : ""].filter(Boolean).join(" ")
  : "Unknown";
const ammoFull = (a) => a ? `${a.caliber} ${ammoLabel(a)}` : "Unknown";
const magLabel = (m) => m
  ? m.label + (m.capacity ? ` (${m.capacity})` : "")
  : "Unassigned";

/* rounds currently sitting in magazines, per ammo line */
function loadedFor(ammoId) {
  return S.magLoads.filter((l) => l.ammoId === ammoId)
    .reduce((t, l) => t + int(l.rounds), 0);
}
function onHand(a) { return int(a.qtyBoxed) + int(a.qtyLoose) + loadedFor(a.id); }

/* how many physical magazines of a type are currently spoken for */
function magsInUse(magTypeId) {
  return S.magLoads.filter((l) => l.magTypeId === magTypeId).length;
}
function magsFree(m) { return int(m.quantity) - magsInUse(m.id); }

/* magazine loads that are already committed to the open trip */
function magsOnTrip() {
  const t = openTrip();
  if (!t) return new Set();
  const s = new Set();
  t.entries.forEach((e) => (e.mags || []).forEach((g) => s.add(g.magLoadId)));
  return s;
}

function calibers() {
  const order = [];
  S.ammo.forEach((a) => { if (!order.includes(a.caliber)) order.push(a.caliber); });
  return order;
}

function caliberTotal(cal) {
  return S.ammo.filter((a) => a.caliber === cal)
    .reduce((t, a) => t + onHand(a), 0);
}

/* .223 and 5.56 shoot out of the same rifles, so the sheet kept a combined
   figure. Preserved here rather than making it a lookup every time. */
const AR_CALS = [".223", "5.56"];
function arTotal() { return AR_CALS.reduce((t, c) => t + caliberTotal(c), 0); }

/* ---------------------------------------------------- cleaning + schedules */
function cleanState(f) {
  const b = f.barrel;
  const out = { barrel: null, deep: null, worst: "ok" };
  if (int(f.barrelCleanEvery) > 0) {
    const p = int(b.sinceBarrelClean) / int(f.barrelCleanEvery);
    out.barrel = { since: int(b.sinceBarrelClean), every: int(f.barrelCleanEvery),
      pct: Math.min(p, 1.6), over: p >= 1, near: p >= 0.8 };
  }
  if (int(f.deepCleanEvery) > 0) {
    const p = int(b.sinceDeepClean) / int(f.deepCleanEvery);
    out.deep = { since: int(b.sinceDeepClean), every: int(f.deepCleanEvery),
      pct: Math.min(p, 1.6), over: p >= 1, near: p >= 0.8 };
  }
  const any = [out.barrel, out.deep].filter(Boolean);
  if (any.some((x) => x.over)) out.worst = "over";
  else if (any.some((x) => x.near)) out.worst = "near";
  return out;
}

function schedFor(f) { return f.scheduleId ? byId(S.schedules, f.scheduleId) : null; }

/* Milestones are measured against receiver rounds, matching the spreadsheet. */
function milestones(f) {
  const sc = schedFor(f);
  if (!sc) return { done: [], next: null, due: null };
  const r = int(f.receiverRounds);
  const ms = sc.milestones.slice().sort((a, b) => a.rounds - b.rounds);
  const done = ms.filter((m) => r >= m.rounds);
  const next = ms.find((m) => r < m.rounds) || null;
  const acked = f.ackMilestones || [];
  const due = done.filter((m) => !acked.includes(m.rounds));
  return { done, next, due, all: ms };
}

/* ---------------------------------------------------------------- velocity */
function vstats(shots) {
  const s = (shots || []).map(n).filter((x) => x > 0);
  if (!s.length) return null;
  const avg = s.reduce((a, b) => a + b, 0) / s.length;
  const es = Math.max(...s) - Math.min(...s);
  const sd = s.length > 1
    ? Math.sqrt(s.reduce((t, x) => t + (x - avg) ** 2, 0) / (s.length - 1))
    : 0;
  return { n: s.length, avg, sd, es, lo: Math.min(...s), hi: Math.max(...s) };
}

/* ---------------------------------------------------------------- trips */
function openTrip() { return S.trips.find((t) => t.status === "open") || null; }
function tripEntryFired(e) {
  const loose = int(e.broughtBoxed) + int(e.broughtLoose)
              - int(e.returnedBoxed) - int(e.returnedLoose);
  const fromMags = (e.mags || []).reduce(
    (t, g) => t + int(g.roundsOut) - int(g.roundsBack), 0);
  return { loose: Math.max(loose, 0), mags: Math.max(fromMags, 0),
    total: Math.max(loose, 0) + Math.max(fromMags, 0),
    raw: loose + fromMags, bad: loose < 0 || fromMags < 0 };
}
function tripBrought(e) {
  return int(e.broughtBoxed) + int(e.broughtLoose)
    + (e.mags || []).reduce((t, g) => t + int(g.roundsOut), 0);
}

/* ---------------------------------------------------------------- chrome */
const SCREENS = {
  home: ["Armory", ""], guns: ["Firearms", ""], ammo: ["Ammunition", ""],
  mags: ["Magazines", ""], range: ["Range", ""], velocity: ["Velocity", ""],
  nfa: ["NFA items", ""], tools: ["Tools", ""], data: ["Data", ""],
};

function go(name) {
  SCREEN = name;
  $$(".screen").forEach((s) => s.classList.toggle("on", s.id === "sc-" + name));
  $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.go === name));
  window.scrollTo(0, 0);
  render();
}

function render() {
  const [t, sub] = SCREENS[SCREEN] || ["Armory", ""];
  $("#ttl").textContent = t;
  $("#subttl").textContent = sub;
  const fn = RENDER[SCREEN];
  if (fn) {
    const host = $("#sc-" + SCREEN);
    host.innerHTML = fn();
    stripeRows(host);
    if (SCREEN === "data" && typeof paintStorage === "function") paintStorage();
  }
  const trip = openTrip();
  const rb = $('#tabs button[data-go="range"]');
  $$(".dot").forEach((d) => d.remove());
  if (trip && rb) {
    const d = document.createElement("span"); d.className = "dot"; rb.appendChild(d);
  }
}

/* ---------------------------------------------------------------- sheet */
let sheetMount = null;
function openSheet(title, html, onmount) {
  $("#sheetttl").textContent = title;
  $("#sheetbody").innerHTML = html;
  $("#sheet").classList.add("on");
  $("#scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  stripeRows($("#sheetbody"));
  sheetMount = onmount || null;
  if (sheetMount) sheetMount($("#sheetbody"));
}
function closeSheet() {
  $("#sheet").classList.remove("on");
  $("#scrim").classList.remove("on");
  document.body.style.overflow = "";
  sheetMount = null;
  setTimeout(() => { if (!$("#sheet").classList.contains("on")) $("#sheetbody").innerHTML = ""; }, 240);
}
function reSheet(title, html, onmount) { openSheet(title, html, onmount); }

/* ---------------------------------------------------------------- toast */
let toastT = null;
function toast(msg, actLabel, actFn) {
  $("#toastmsg").textContent = msg;
  const b = $("#toastact");
  if (actLabel) { b.hidden = false; b.textContent = actLabel; b.onclick = () => { hideToast(); actFn(); }; }
  else { b.hidden = true; b.onclick = null; }
  $("#toast").classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, actLabel ? 7000 : 3200);
}
function hideToast() { $("#toast").classList.remove("on"); }

/* ---------------------------------------------------------------- widgets */
function gauge(label, g) {
  if (!g) return "";
  const cls = g.over ? "over" : g.near ? "warn" : "";
  const left = g.every - g.since;
  const right = g.over
    ? `<b>${fmt(-left)}</b> over`
    : `<b>${fmt(left)}</b> to go`;
  return `<div class="gauge"><div class="lbl"><span>${esc(label)} <b>${fmt(g.since)}</b>/${fmt(g.every)}</span><span>${right}</span></div>
    <div class="bar ${cls}"><i style="width:${Math.min(g.pct * 100, 100).toFixed(1)}%"></i></div></div>`;
}

function stepper(name, val, min) {
  return `<div class="step" data-step>
    <button type="button" data-nudge="-1" aria-label="Less">&minus;</button>
    <input type="number" inputmode="numeric" name="${esc(name)}" value="${int(val)}"
      min="${min == null ? 0 : min}" step="1">
    <button type="button" data-nudge="1" aria-label="More">+</button></div>`;
}

function selOpts(items, val, labelFn, valFn) {
  return items.map((x) => {
    const v = valFn ? valFn(x) : x.id;
    return `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(labelFn(x))}</option>`;
  }).join("");
}

/* Grouped variant: browsers render optgroup labels bold, which is exactly the
   caliber divider we want inside the firearm and ammunition pickers. */
function selOptsGrouped(items, val, labelFn, groupFn) {
  const order = [];
  items.forEach((x) => { const g = groupFn(x) || "Other"; if (!order.includes(g)) order.push(g); });
  return order.map((g) => `<optgroup label="${esc(g)}">` +
    items.filter((x) => (groupFn(x) || "Other") === g).map((x) =>
      `<option value="${esc(x.id)}"${x.id === val ? " selected" : ""}>${esc(labelFn(x))}</option>`
    ).join("") + `</optgroup>`).join("");
}

/* Stripe every list after it is drawn. The counter restarts at each caliber
   heading so the first line under a heading is always the light one. */
function stripeRows(root) {
  $$(".rows", root || document).forEach((box) => {
    let i = 0;
    Array.from(box.children).forEach((el) => {
      if (el.classList.contains("grouphead")) { i = 0; return; }
      if (!el.classList.contains("row")) return;
      el.classList.toggle("alt", i % 2 === 1);
      i++;
    });
  });
}

function readForm(root) {
  const o = {};
  $$("input,select,textarea", root).forEach((el) => {
    if (!el.name) return;
    if (el.type === "checkbox") { o[el.name] = el.checked; return; }
    o[el.name] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
  });
  return o;
}

function emptyState(title, body, btn, act) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(body)}
    ${btn ? `<div style="margin-top:12px"><button class="btn pri sm" data-act="${esc(act)}">${esc(btn)}</button></div>` : ""}</div>`;
}
