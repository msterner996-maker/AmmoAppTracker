<script>
"use strict";
/* ==========================================================================
   Collapsible trees.

   Guns, ammo and magazines are all "a long list that divides cleanly by
   caliber", so they get the same shape the velocity tab has: caliber as the
   branch, tap to see what is inside, with enough on the closed branch that
   you often do not need to open it.

   Which branches are open is interface state, not log data, so it lives in
   localStorage rather than in S. Putting it in S would push a revision to
   OneDrive every time you tapped a caliber open.
   ========================================================================== */

const OPEN_KEY = "armory.open";

function openState() {
  try { return JSON.parse(localStorage.getItem(OPEN_KEY) || "{}") || {}; }
  catch (e) { return {}; }
}
function openFor(scope) {
  const v = openState()[scope];
  return Array.isArray(v) ? v : null;   // null means "never touched"
}
function setOpenFor(scope, arr) {
  const all = openState();
  all[scope] = arr;
  try { localStorage.setItem(OPEN_KEY, JSON.stringify(all)); } catch (e) {}
}

/* A single branch is not a tree worth collapsing, so it starts open. */
function resolveOpen(scope, keys) {
  const stored = openFor(scope);
  if (stored) return stored.filter((k) => keys.includes(k));
  return keys.length === 1 ? keys.slice() : [];
}

ACT["tree-toggle"] = (key, scope) => {
  const cur = openFor(scope) || [];
  setOpenFor(scope, cur.includes(key) ? cur.filter((k) => k !== key) : cur.concat([key]));
  render();
};

ACT["tree-all"] = (scope, payload) => {
  const [want, keys] = String(payload || "").split("|");
  setOpenFor(scope, want === "1" ? (keys ? keys.split("~") : []) : []);
  render();
};

/* branches: [{ key, name, sub, count, tag, body }]
   actions:  [{ label, act, id, pri }]  rendered next to Expand all      */
function treeSection(o) {
  const keys = o.branches.map((b) => b.key);
  const open = resolveOpen(o.scope, keys);
  const allOpen = keys.length > 0 && open.length >= keys.length;
  const payload = `${allOpen ? "0" : "1"}|${keys.join("~")}`;

  let h = `<section class="blk"><h2>${esc(o.title)}<span class="btnrow">`;
  if (keys.length > 1) {
    h += `<button class="btn sm" data-act="tree-all" data-id="${esc(o.scope)}"
      data-v="${esc(payload)}">${allOpen ? "Collapse all" : "Expand all"}</button>`;
  }
  (o.actions || []).forEach((a) => {
    h += `<button class="btn sm${a.pri ? " pri" : ""}" data-act="${esc(a.act)}"${
      a.id ? ` data-id="${esc(a.id)}"` : ""}>${esc(a.label)}</button>`;
  });
  h += `</span></h2>`;
  if (o.hint) h += `<p class="hint">${o.hint}</p>`;

  if (!o.branches.length) return h + (o.empty || "") + `</section>`;

  h += `<div class="tree">` + o.branches.map((b) => {
    const on = open.includes(b.key);
    return `<div class="node${on ? " open" : ""}">
      <button class="nodehead" data-act="tree-toggle" data-id="${esc(b.key)}"
        data-v="${esc(o.scope)}" aria-expanded="${on}">
        <span class="tw">&rsaquo;</span>
        <span class="nm"><b>${esc(b.name)}</b>${b.sub ? `<span>${esc(b.sub)}</span>` : ""}</span>
        ${b.tag || ""}
        <span class="ct">${esc(String(b.count))}</span>
      </button>
      ${on ? `<div class="nodebody">${b.body()}</div>` : ""}</div>`;
  }).join("") + `</div></section>`;
  return h;
}

/* Every caliber that actually appears somewhere in the inventory. */
function presentCalibers() {
  const order = [];
  const add = (c) => { const k = c || "Caliber not set"; if (!order.includes(k)) order.push(k); };
  S.firearms.forEach((f) => add(f.caliber));
  S.ammo.forEach((a) => add(a.caliber));
  S.magTypes.forEach((m) => add(m.group || "Ungrouped"));
  return order;
}

/* The order calibers appear in, the same on every screen. A saved arrangement
   comes first; anything present but not in it is appended rather than hidden,
   so adding a new caliber can never make it invisible. */
function caliberOrder() {
  const present = presentCalibers();
  const saved = Array.isArray(S.caliberOrder) ? S.caliberOrder : [];
  const out = saved.filter((c) => present.includes(c));
  present.forEach((c) => { if (!out.includes(c)) out.push(c); });
  return out;
}

function caliberUse(cal) {
  return {
    guns: S.firearms.filter((f) => (f.caliber || "Caliber not set") === cal).length,
    ammo: S.ammo.filter((a) => (a.caliber || "Caliber not set") === cal).length,
    mags: S.magTypes.filter((m) => (m.group || "Ungrouped") === cal).length,
  };
}

/* Unlike which branches are open, the arrangement is a deliberate choice worth
   carrying between devices, so it lives in S and syncs. */
ACT["cal-order"] = () => calOrderSheet();

function calOrderSheet() {
  const order = caliberOrder();
  const saved = Array.isArray(S.caliberOrder) && S.caliberOrder.length;
  openSheet("Caliber order", `
    <p class="hint">Sets the order on Firearms, Ammunition and Magazines, and the caliber
      headings on Velocity. Syncs to your other devices.</p>
    <div class="rows">${order.map((cal, i) => {
      const u = caliberUse(cal);
      const bits = [
        u.guns ? plural(u.guns, "firearm") : null,
        u.ammo ? `${plural(u.ammo, "line")} of ammo` : null,
        u.mags ? `${plural(u.mags, "mag type")}` : null,
      ].filter(Boolean);
      return `<div class="row" style="gap:8px">
        <span class="grow"><span class="ttl">${esc(cal)}</span>
        <span class="meta">${bits.length ? esc(bits.join(" \u00b7 ")) : "nothing yet"}</span></span>
        <button class="btn sm" data-act="cal-move" data-id="${esc(cal)}" data-v="top"
          ${i === 0 ? "disabled" : ""} aria-label="Move ${esc(cal)} to the top">Top</button>
        <button class="btn sm" data-act="cal-move" data-id="${esc(cal)}" data-v="-1"
          ${i === 0 ? "disabled" : ""} aria-label="Move ${esc(cal)} up">&uarr;</button>
        <button class="btn sm" data-act="cal-move" data-id="${esc(cal)}" data-v="1"
          ${i === order.length - 1 ? "disabled" : ""} aria-label="Move ${esc(cal)} down">&darr;</button>
      </div>`;
    }).join("")}</div>
    ${saved ? `<button class="btn wide" style="margin-top:10px" data-act="cal-reset">Back to the default order</button>` : ""}
    <button class="btn pri wide" style="margin-top:8px" data-act="sheet-close">Done</button>`);
}

ACT["cal-move"] = (cal, dir) => {
  /* Materialise the full current order first, so a partial saved list cannot
     drop the calibers it never mentioned. */
  const order = caliberOrder();
  const from = order.indexOf(cal);
  if (from < 0) return;
  order.splice(from, 1);
  if (dir === "top") order.unshift(cal);
  else order.splice(Math.max(0, Math.min(order.length, from + int(dir))), 0, cal);
  S.caliberOrder = order;
  save();
  render();
  calOrderSheet();
};

ACT["cal-reset"] = () => {
  S.caliberOrder = [];
  save();
  render();
  calOrderSheet();
  toast("Back to the default order.");
};

function byCaliber(items, get) {
  const map = {};
  items.forEach((x) => {
    const c = get(x) || "Caliber not set";
    (map[c] = map[c] || []).push(x);
  });
  return caliberOrder().filter((c) => map[c] && map[c].length).map((c) => [c, map[c]]);
}
</script>
<script>
"use strict";

/* ============================================================ HOME ====== */
RENDER.home = function () {
  const trip = openTrip();
  let h = typeof syncLine === "function" ? syncLine() : "";

  if (trip) {
    const shots = trip.entries.reduce((t, e) => t + tripBrought(e), 0);
    h += `<section class="blk"><div class="card" style="border-color:var(--brass)">
      <h2>Trip in progress</h2>
      <p class="hint" style="margin:4px 0 10px">${esc(trip.location || "No location")} &middot; ${esc(trip.date)}
        &middot; ${plural(trip.entries.length, "line")} &middot; ${fmt(shots)} rounds packed</p>
      <div class="btnrow split">
        <button class="btn" data-act="go-range">Open trip</button>
        <button class="btn pri" data-act="trip-closeout">Log what came back</button>
      </div></div></section>`;
  }

  const bare = !S.firearms.length && !S.ammo.length && !S.magTypes.length;
  if (bare) {
    h += `<section class="blk"><div class="card" style="border-color:var(--brass)">
      <h2>Start with your spreadsheet</h2>
      <p class="hint" style="margin:6px 0 12px">Import <b>armory-import.json</b> to load the
        firearms, ammunition, magazines, velocity strings and NFA items pulled out of
        Firearms_Inventory_v2.xlsm. Or just start adding things by hand.</p>
      <button class="btn pri wide" data-act="go-data">Import my data</button></div></section>`;
  }

  /* ---- attention ---- */
  const items = [];
  S.firearms.forEach((f) => {
    const c = cleanState(f);
    if (c.barrel && c.barrel.over)
      items.push([2, f.name, `barrel clean overdue by ${fmt(c.barrel.since - c.barrel.every)}`, f.id]);
    else if (c.barrel && c.barrel.near)
      items.push([1, f.name, `barrel clean in ${fmt(c.barrel.every - c.barrel.since)}`, f.id]);
    if (c.deep && c.deep.over)
      items.push([2, f.name, `deep clean overdue by ${fmt(c.deep.since - c.deep.every)}`, f.id]);
    else if (c.deep && c.deep.near)
      items.push([1, f.name, `deep clean in ${fmt(c.deep.every - c.deep.since)}`, f.id]);
    const ms = milestones(f);
    (ms.due || []).forEach((m) =>
      items.push([3, f.name, `passed ${fmt(m.rounds)} rounds \u2014 service due`, f.id]));
    if (ms.next && int(f.receiverRounds) >= ms.next.rounds - 250)
      items.push([1, f.name, `${fmt(ms.next.rounds - int(f.receiverRounds))} rounds to the ${fmt(ms.next.rounds)} service`, f.id]);
  });
  items.sort((a, b) => b[0] - a[0]);

  h += `<section class="blk"><h2>Needs attention</h2>`;
  if (!items.length) {
    h += `<div class="empty">Everything is inside its interval. Nothing to do.</div>`;
  } else {
    h += `<div class="rows">` + items.slice(0, 9).map(([sev, name, why, id]) =>
      `<button class="row" data-act="gun-open" data-id="${esc(id)}">
        <span class="grow"><span class="ttl">${esc(name)}</span>
        <span class="meta">${esc(why)}</span></span>
        <span class="tag ${sev === 3 ? "flag" : sev === 2 ? "flag" : "mute"}">${sev >= 2 ? "due" : "soon"}</span>
        <span class="chev">&rsaquo;</span></button>`).join("") + `</div>`;
    if (items.length > 9) h += `<p class="hint" style="margin-top:8px">${items.length - 9} more.</p>`;
  }
  h += `</section>`;

  /* ---- on hand ---- */
  const cals = calibers();
  const boxed = S.ammo.reduce((t, a) => t + int(a.qtyBoxed), 0);
  const loose = S.ammo.reduce((t, a) => t + int(a.qtyLoose), 0);
  const inMags = S.magLoads.reduce((t, l) => t + int(l.rounds), 0);
  h += `<section class="blk"><h2>Rounds on hand</h2>
    <div class="card"><div class="counter"><span class="big">${fmt(boxed + loose + inMags)}</span>
      <span class="unit">rounds, all calibers</span></div>
      <div class="split-nums">
        <div><span>Boxed</span><b>${fmt(boxed)}</b></div>
        <div><span>Loose</span><b>${fmt(loose)}</b></div>
        <div><span>In mags</span><b>${fmt(inMags)}</b></div>
        <div><span>Mags out</span><b>${fmt(S.magLoads.length)}</b></div>
      </div></div>`;
  h += `<div class="rows" style="margin-top:10px">`;
  if (AR_CALS.some((c) => cals.includes(c))) {
    h += `<button class="row" data-act="go-ammo"><span class="grow">
      <span class="ttl">AR combined</span><span class="meta">.223 and 5.56 together</span></span>
      <span class="num" style="font-weight:550">${fmt(arTotal())}</span></button>`;
  }
  h += cals.map((c) => `<button class="row" data-act="go-ammo">
      <span class="grow"><span class="ttl">${esc(c)}</span></span>
      <span class="num" style="font-weight:550">${fmt(caliberTotal(c))}</span></button>`).join("");
  h += `</div></section>`;

  /* ---- more ---- */
  h += `<section class="blk"><h2>More</h2><div class="rows">
    <button class="row" data-act="go-velocity"><span class="grow"><span class="ttl">Velocity</span>
      <span class="meta">${plural(S.velocity.length, "string")} recorded</span></span><span class="chev">&rsaquo;</span></button>
    <button class="row" data-act="go-nfa"><span class="grow"><span class="ttl">NFA items</span>
      <span class="meta">${plural(S.nfa.length, "item")}</span></span><span class="chev">&rsaquo;</span></button>
    <button class="row" data-act="go-tools"><span class="grow"><span class="ttl">Count ammo by weight</span>
      <span class="meta">Scale, tare, reference weight</span></span><span class="chev">&rsaquo;</span></button>
    <button class="row" data-act="go-data"><span class="grow"><span class="ttl">Export and backup</span>
      <span class="meta">${S.trips.filter((t) => t.status === "closed").length} trips logged</span></span><span class="chev">&rsaquo;</span></button>
  </div></section>`;

  const ul = undoLabel();
  if (ul) h += `<section class="blk"><button class="btn wide" data-act="undo">Undo: ${esc(ul)}</button></section>`;

  return h;
};

/* ============================================================ GUNS ====== */
RENDER.guns = function () {
  const groups = byCaliber(S.firearms, (f) => f.caliber);
  return treeSection({
    scope: "guns",
    title: "Firearms",
    actions: [{ label: "Order", act: "cal-order" }, { label: "Add", act: "gun-new" }],
    empty: emptyState("No firearms yet", "Add one to start counting rounds.",
      "Add a firearm", "gun-new"),
    branches: groups.map(([cal, items]) => {
      const rounds = items.reduce((t, f) => t + int(f.receiverRounds), 0);
      const due = items.filter((f) => cleanState(f).worst === "over"
        || (milestones(f).due || []).length).length;
      const soon = items.filter((f) => cleanState(f).worst === "near").length;
      return {
        key: cal,
        name: cal,
        sub: `${fmt(rounds)} rounds fired`,
        count: items.length,
        /* Enough on the closed branch to know whether it needs opening. */
        tag: due ? `<span class="tag flag">${due} due</span>`
          : soon ? `<span class="tag mute">${soon} soon</span>` : "",
        body: () => items.map(gunCard).join(""),
      };
    }),
  });
};

/* The caliber is the branch now, so the card leads with the serial instead of
   repeating it. */
function gunCard(f) {
  const c = cleanState(f);
  const ms = milestones(f);
  return `<div class="card" style="margin-bottom:10px">
    <button class="row" style="padding:0;border:0;width:100%" data-act="gun-open" data-id="${esc(f.id)}">
      <span class="grow">
        <span class="ttl" style="font-size:1.0625rem">${esc(f.name)}</span>
        <span class="meta">${f.serial ? esc(f.serial) : "no serial recorded"}${
          f.barrel && f.barrel.lengthIn ? ` \u00b7 ${f.barrel.lengthIn}in` : ""}</span>
      </span><span class="chev">&rsaquo;</span></button>
    <div class="counter"><span class="big">${fmt(f.receiverRounds)}</span><span class="unit">rounds fired</span></div>
    ${gauge("Barrel clean", c.barrel)}
    ${gauge("Deep clean", c.deep)}
    ${(ms.due && ms.due.length) ? `<div class="tags"><span class="tag flag">${fmt(ms.due[ms.due.length - 1].rounds)} service due</span></div>`
      : ms.next ? `<div class="tags"><span class="tag mute">next service at ${fmt(ms.next.rounds)}</span></div>` : ""}
  </div>`;
}

ACT["gun-open"] = (id) => gunSheet(id);

function gunSheet(id) {
  const f = gun(id);
  if (!f) return;
  const c = cleanState(f);
  const ms = milestones(f);
  const b = f.barrel;
  let h = `<div class="card"><div class="counter"><span class="big">${fmt(f.receiverRounds)}</span>
      <span class="unit">rounds through the receiver</span></div>
    <dl style="margin-top:10px">
      <div class="kv"><dt>This barrel</dt><dd>${fmt(b.rounds)}${b.lengthIn ? ` &middot; ${b.lengthIn}in` : ""}</dd></div>
      <div class="kv"><dt>Last barrel clean</dt><dd>${esc(dshow(b.lastBarrelClean))}</dd></div>
      <div class="kv"><dt>Last deep clean</dt><dd>${esc(dshow(b.lastDeepClean))}</dd></div>
      <div class="kv"><dt>Last fired</dt><dd>${esc(dshow(f.lastShotDate))}</dd></div>
    </dl>
    ${gauge("Barrel clean", c.barrel)}${gauge("Deep clean", c.deep)}</div>

  <div class="btnrow split" style="margin:12px 0">
    <button class="btn" data-act="gun-cleanbarrel" data-id="${esc(f.id)}">Cleaned barrel</button>
    <button class="btn" data-act="gun-cleandeep" data-id="${esc(f.id)}">Deep cleaned</button>
  </div>
  <button class="btn wide" data-act="gun-addrounds" data-id="${esc(f.id)}"
    style="margin-bottom:12px">Add rounds by hand</button>`;

  if (ms.all && ms.all.length) {
    h += `<fieldset><legend>${esc(schedFor(f).name)}</legend>`;
    h += ms.all.map((m) => {
      const passed = int(f.receiverRounds) >= m.rounds;
      const acked = (f.ackMilestones || []).includes(m.rounds);
      const tag = !passed ? `<span class="tag mute">${fmt(m.rounds - int(f.receiverRounds))} away</span>`
        : acked ? `<span class="tag moss">done</span>`
        : `<span class="tag flag">due</span>`;
      return `<div style="padding:9px 0;border-top:1px solid var(--rule-2)">
        <div style="display:flex;gap:8px;align-items:center">
          <b class="num" style="font-weight:550">${fmt(m.rounds)}</b>${tag}
          ${passed && !acked ? `<button class="linkbtn" style="margin-left:auto"
            data-act="gun-ack" data-id="${esc(f.id)}" data-v="${m.rounds}">Mark done</button>` : ""}
        </div>
        <div class="meta" style="color:var(--ink-2);font-size:0.8125rem">${esc(m.task)}</div></div>`;
    }).join("");
    h += `</fieldset>`;
  }

  if (f.notes) h += `<fieldset><legend>Notes</legend><div style="font-size:0.875rem;white-space:pre-wrap">${esc(f.notes)}</div></fieldset>`;

  if (f.barrelHistory.length) {
    h += `<fieldset><legend>Retired barrels</legend>` + f.barrelHistory.map((x) =>
      `<div style="padding:8px 0;border-top:1px solid var(--rule-2)">
        <b style="font-weight:550;font-size:0.875rem">${esc(x.label)}</b>
        <span class="num" style="color:var(--ink-2);font-size:0.8125rem"> \u00b7 ${fmt(x.rounds)} rounds</span>
        ${x.notes ? `<div style="font-size:0.8125rem;color:var(--ink-2)">${esc(x.notes)}</div>` : ""}</div>`
    ).join("") + `</fieldset>`;
  }

  h += `<div class="btnrow" style="margin-top:4px">
    <button class="btn sm" data-act="gun-edit" data-id="${esc(f.id)}">Edit details</button>
    <button class="btn sm" data-act="gun-swap" data-id="${esc(f.id)}">Swap barrel</button>
    <button class="btn sm dgr" data-act="gun-del" data-id="${esc(f.id)}">Delete</button></div>`;

  openSheet(f.name, h);
}

ACT["gun-cleanbarrel"] = (id) => {
  const f = gun(id); snapshot(`barrel clean, ${f.name}`);
  f.barrel.sinceBarrelClean = 0; f.barrel.lastBarrelClean = today();
  commit("Barrel clean logged."); gunSheet(id);
};
ACT["gun-cleandeep"] = (id) => {
  const f = gun(id); snapshot(`deep clean, ${f.name}`);
  f.barrel.sinceDeepClean = 0; f.barrel.lastDeepClean = today();
  // A deep clean includes the bore.
  f.barrel.sinceBarrelClean = 0; f.barrel.lastBarrelClean = today();
  commit("Deep clean logged. Barrel counter reset too."); gunSheet(id);
};
ACT["gun-ack"] = (id, v) => {
  const f = gun(id); snapshot(`service mark, ${f.name}`);
  f.ackMilestones = (f.ackMilestones || []).concat([int(v)]);
  commit("Marked done."); gunSheet(id);
};

ACT["gun-addrounds"] = (id) => {
  const f = gun(id);
  openSheet("Add rounds", `<p class="hint">For rounds fired outside a logged trip. This
    bumps every counter on ${esc(f.name)} the same way a trip closeout does.</p>
    <label class="f"><span>Rounds</span>${stepper("r", 0)}</label>
    <label class="f"><span>Date</span><input type="date" name="d" value="${today()}"></label>
    <button class="btn pri wide" data-act="gun-addrounds-go" data-id="${esc(id)}">Add rounds</button>`);
};
ACT["gun-addrounds-go"] = (id) => {
  const v = readForm($("#sheetbody"));
  const r = int(v.r);
  if (r <= 0) { toast("Enter a round count above zero."); return; }
  const f = gun(id); snapshot(`${fmt(r)} rounds, ${f.name}`);
  bumpGun(f, r, v.d || today());
  commit(`${fmt(r)} rounds added to ${f.name}.`); closeSheet();
};

function bumpGun(f, rounds, date) {
  f.receiverRounds = int(f.receiverRounds) + rounds;
  f.barrel.rounds = int(f.barrel.rounds) + rounds;
  f.barrel.sinceDeepClean = int(f.barrel.sinceDeepClean) + rounds;
  f.barrel.sinceBarrelClean = int(f.barrel.sinceBarrelClean) + rounds;
  if (date) f.lastShotDate = date;
}

ACT["gun-new"] = () => gunEdit(null);
ACT["gun-edit"] = (id) => gunEdit(id);

function gunEdit(id) {
  const f = id ? gun(id) : {
    name: "", serial: "", caliber: "", receiverRounds: 0, notes: "",
    barrelCleanEvery: 500, deepCleanEvery: 1000, scheduleId: null,
    barrel: { label: "Factory", lengthIn: null, rounds: 0, sinceDeepClean: 0, sinceBarrelClean: 0 },
  };
  const cals = Array.from(new Set(S.ammo.map((a) => a.caliber).concat(f.caliber ? [f.caliber] : []))).filter(Boolean);
  openSheet(id ? "Edit " + f.name : "Add a firearm", `
    <label class="f"><span>Name</span><input name="name" value="${esc(f.name)}" placeholder="e.g. BA 12.5"></label>
    <div class="f2">
      <label class="f"><span>Caliber</span><input name="caliber" value="${esc(f.caliber)}" list="callist">
        <datalist id="callist">${cals.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
      <label class="f"><span>Serial number</span><input name="serial" value="${esc(f.serial)}"></label>
    </div>
    <fieldset><legend>Counters</legend>
      <div class="f2">
        <label class="f"><span>Rounds through receiver</span><input type="number" name="receiverRounds" value="${int(f.receiverRounds)}"></label>
        <label class="f"><span>Rounds on this barrel</span><input type="number" name="brounds" value="${int(f.barrel.rounds)}"></label>
        <label class="f"><span>Since barrel clean</span><input type="number" name="sbc" value="${int(f.barrel.sinceBarrelClean)}"></label>
        <label class="f"><span>Since deep clean</span><input type="number" name="sdc" value="${int(f.barrel.sinceDeepClean)}"></label>
      </div></fieldset>
    <fieldset><legend>Barrel</legend>
      <div class="f2">
        <label class="f"><span>Label</span><input name="blabel" value="${esc(f.barrel.label || "")}"></label>
        <label class="f"><span>Length (in)</span><input type="number" step="0.1" name="blen" value="${f.barrel.lengthIn == null ? "" : f.barrel.lengthIn}"></label>
      </div></fieldset>
    <fieldset><legend>Intervals and schedule</legend>
      <div class="f2">
        <label class="f"><span>Barrel clean every</span><input type="number" name="barrelCleanEvery" value="${int(f.barrelCleanEvery)}"></label>
        <label class="f"><span>Deep clean every</span><input type="number" name="deepCleanEvery" value="${int(f.deepCleanEvery)}"></label>
      </div>
      <label class="f"><span>Service schedule</span><select name="scheduleId">
        <option value="">None</option>
        ${selOpts(S.schedules, f.scheduleId, (x) => x.name)}</select></label>
      <p class="hint" style="margin:0">Set an interval to 0 to turn that reminder off.</p>
    </fieldset>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(f.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="gun-save" data-id="${esc(id || "")}">${id ? "Save changes" : "Add firearm"}</button>`);
}

ACT["gun-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.name || "").trim()) { toast("Give it a name."); return; }
  const isNew = !id;
  snapshot(isNew ? "add firearm" : "edit " + v.name);
  const f = isNew ? { id: uid("f"), barrelHistory: [], ackMilestones: [], barrel: {} } : gun(id);
  Object.assign(f, {
    name: String(v.name).trim(), serial: v.serial || "", caliber: v.caliber || "",
    receiverRounds: int(v.receiverRounds),
    barrelCleanEvery: int(v.barrelCleanEvery), deepCleanEvery: int(v.deepCleanEvery),
    scheduleId: v.scheduleId || null, notes: v.notes || "",
  });
  f.barrel = Object.assign(f.barrel || {}, {
    label: v.blabel || "Factory", lengthIn: v.blen == null ? null : n(v.blen),
    rounds: int(v.brounds), sinceBarrelClean: int(v.sbc), sinceDeepClean: int(v.sdc),
    lastBarrelClean: (f.barrel && f.barrel.lastBarrelClean) || null,
    lastDeepClean: (f.barrel && f.barrel.lastDeepClean) || null,
  });
  f.barrelHistory = f.barrelHistory || [];
  f.ackMilestones = f.ackMilestones || [];
  if (isNew) S.firearms.push(f);
  commit(isNew ? "Firearm added." : "Saved."); closeSheet();
};

ACT["gun-swap"] = (id) => {
  const f = gun(id);
  openSheet("Swap barrel", `<p class="hint">Retires ${esc(f.barrel.label || "the current barrel")} at
    ${fmt(f.barrel.rounds)} rounds and starts the new one at zero. Receiver total keeps counting.</p>
    <label class="f"><span>New barrel label</span><input name="label" placeholder="e.g. 16in Faxon"></label>
    <label class="f"><span>Length (in)</span><input type="number" step="0.1" name="len"></label>
    <label class="f"><span>Starting rounds</span>${stepper("start", 0)}</label>
    <label class="f"><span>Note on the retired barrel</span><input name="note" placeholder="optional"></label>
    <button class="btn pri wide" data-act="gun-swap-go" data-id="${esc(id)}">Swap barrel</button>`);
};
ACT["gun-swap-go"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.label || "").trim()) { toast("Name the new barrel."); return; }
  const f = gun(id); snapshot("barrel swap, " + f.name);
  f.barrelHistory.push({
    label: f.barrel.label || "Previous barrel", lengthIn: f.barrel.lengthIn,
    rounds: int(f.barrel.rounds), retiredOn: today(), notes: v.note || "",
  });
  f.barrel = {
    label: String(v.label).trim(), lengthIn: v.len == null ? null : n(v.len),
    rounds: int(v.start), sinceBarrelClean: int(v.start), sinceDeepClean: int(v.start),
    lastBarrelClean: null, lastDeepClean: null,
  };
  commit("Barrel swapped."); closeSheet();
};

ACT["gun-del"] = (id) => {
  const f = gun(id);
  if (!confirm(`Delete ${f.name} and its counters? Trip history keeps the name but loses the link.`)) return;
  snapshot("delete " + f.name);
  S.firearms = S.firearms.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};
</script>
<script>
"use strict";

/* ============================================================ AMMO ====== */
function ammoRow(a) {
  const ld = loadedFor(a.id);
  const bits = [];
  if (int(a.qtyBoxed)) bits.push(`${fmt(a.qtyBoxed)} boxed`);
  if (int(a.qtyLoose)) bits.push(`${fmt(a.qtyLoose)} loose`);
  if (ld) bits.push(`${fmt(ld)} in mags`);
  return `<button class="row" data-act="ammo-open" data-id="${esc(a.id)}">
    <span class="grow"><span class="ttl">${esc(ammoLabel(a))}</span>
    <span class="meta">${bits.length ? esc(bits.join(" \u00b7 ")) : "empty"}${a.notes ? " \u00b7 note" : ""}</span></span>
    <span class="num" style="font-weight:550">${fmt(onHand(a))}</span>
    <span class="chev">&rsaquo;</span></button>`;
}

RENDER.ammo = function () {
  const boxed = S.ammo.reduce((t, a) => t + int(a.qtyBoxed), 0);
  const loose = S.ammo.reduce((t, a) => t + int(a.qtyLoose), 0);
  const inMags = S.magLoads.reduce((t, l) => t + int(l.rounds), 0);

  let h = "";
  if (S.ammo.length) {
    h += `<section class="blk"><div class="card">
      <div class="counter"><span class="big">${fmt(boxed + loose + inMags)}</span>
        <span class="unit">rounds total</span></div>
      <div class="split-nums">
        <div><span>Boxed</span><b>${fmt(boxed)}</b></div>
        <div><span>Loose</span><b>${fmt(loose)}</b></div>
        <div><span>In mags</span><b>${fmt(inMags)}</b></div>
        <div><span>Lines</span><b>${fmt(S.ammo.length)}</b></div>
      </div></div>`;
    if (AR_CALS.some((c) => calibers().includes(c))) {
      h += `<div class="card" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
        <div><b style="font-weight:600">AR combined</b>
        <div class="hint" style="margin:0">.223 and 5.56 pooled, as the sheet had it</div></div>
        <span class="num" style="font-size:1.375rem;font-weight:550">${fmt(arTotal())}</span></div>`;
    }
    h += `</section>`;
  }

  const groups = byCaliber(S.ammo, (a) => a.caliber);
  h += treeSection({
    scope: "ammo",
    title: "Ammunition",
    actions: [{ label: "Order", act: "cal-order" }, { label: "Add", act: "ammo-new" }],
    empty: emptyState("Nothing on the shelf",
      "Add a line for each caliber, brand and bullet weight you keep.",
      "Add ammunition", "ammo-new"),
    branches: groups.map(([cal, items]) => ({
      key: cal,
      name: cal,
      sub: `${plural(items.length, "line")} \u00b7 ${fmt(items.reduce((t, a) => t + onHand(a), 0))} rounds`,
      count: fmt(items.reduce((t, a) => t + onHand(a), 0)),
      body: () => `<div class="rows">${items.map(ammoRow).join("")}</div>`,
    })),
  });
  return h;
};

ACT["ammo-open"] = (id) => ammoSheet(id);

function ammoSheet(id) {
  const a = ammoOf(id);
  if (!a) return;
  const ld = S.magLoads.filter((l) => l.ammoId === id);
  let h = "";
  if (a.notes) h += `<div class="note flag">${esc(a.notes)}</div>`;
  h += `<div class="card"><div class="counter"><span class="big">${fmt(onHand(a))}</span>
    <span class="unit">rounds of ${esc(a.caliber)}</span></div>
    <div class="split-nums">
      <div><span>Boxed</span><b>${fmt(a.qtyBoxed)}</b></div>
      <div><span>Loose</span><b>${fmt(a.qtyLoose)}</b></div>
      <div><span>In mags</span><b>${fmt(loadedFor(a.id))}</b></div>
      <div><span>Mags</span><b>${fmt(ld.length)}</b></div>
    </div>
    ${a.location ? `<p class="hint" style="margin:10px 0 0">Kept in ${esc(a.location)}</p>` : ""}</div>

  <div class="btnrow split" style="margin:12px 0">
    <button class="btn" data-act="ammo-stock" data-id="${esc(id)}">Add or remove</button>
    <button class="btn pri" data-act="mag-load" data-id="${esc(id)}">Load magazines</button>
  </div>`;

  if (ld.length) {
    h += `<fieldset><legend>Loaded into</legend>` + ld.map((l) => {
      const m = magType(l.magTypeId);
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2)">
        <span style="flex:1;min-width:0">
          <b style="font-weight:550;font-size:0.875rem">${esc(magLabel(m))}</b>
          ${l.notes ? `<div class="hint" style="margin:0">${esc(l.notes)}</div>` : ""}</span>
        <span class="num">${fmt(l.rounds)}</span>
        <button class="btn sm" data-act="mag-unload" data-id="${esc(l.id)}">Unload</button></div>`;
    }).join("") + `</fieldset>`;
  }

  const v = vstats((S.velocity.find((x) => x.ammoId === id) || {}).shots);
  if (v) h += `<fieldset><legend>Measured velocity</legend>
    <dl><div class="kv"><dt>Average</dt><dd>${Math.round(v.avg)} fps</dd></div>
    <div class="kv"><dt>SD</dt><dd>${v.sd.toFixed(1)}</dd></div></dl></fieldset>`;

  h += `<div class="btnrow"><button class="btn sm" data-act="ammo-edit" data-id="${esc(id)}">Edit details</button>
    <button class="btn sm dgr" data-act="ammo-del" data-id="${esc(id)}">Delete</button></div>`;
  openSheet(ammoFull(a), h);
}

ACT["ammo-stock"] = (id) => {
  const a = ammoOf(id);
  openSheet("Adjust " + ammoLabel(a), `
    <p class="hint">Positive adds, negative removes. Rounds already in magazines are
      not touched here \u2014 unload a magazine to move them back.</p>
    <div class="f2">
      <label class="f"><span>Boxed (now ${fmt(a.qtyBoxed)})</span><input type="number" name="b" value="0"></label>
      <label class="f"><span>Loose (now ${fmt(a.qtyLoose)})</span><input type="number" name="l" value="0"></label>
    </div>
    <label class="f"><span>Reason</span><input name="why" placeholder="bought a case, recount, gave some away"></label>
    <button class="btn pri wide" data-act="ammo-stock-go" data-id="${esc(id)}">Apply</button>`);
};
ACT["ammo-stock-go"] = (id) => {
  const v = readForm($("#sheetbody"));
  const db = int(v.b), dl = int(v.l);
  if (!db && !dl) { toast("Nothing to change."); return; }
  const a = ammoOf(id);
  if (int(a.qtyBoxed) + db < 0 || int(a.qtyLoose) + dl < 0) {
    toast("That would take a count below zero."); return;
  }
  snapshot("stock change, " + ammoLabel(a));
  a.qtyBoxed = int(a.qtyBoxed) + db;
  a.qtyLoose = int(a.qtyLoose) + dl;
  if (a.notes && /Clamped to 0/.test(a.notes)) a.notes = "";
  S.ledger.push({ id: uid("lg"), at: today(), kind: "stock", ammoId: id,
    boxed: db, loose: dl, why: v.why || "" });
  commit("Stock updated."); closeSheet();
};

ACT["ammo-new"] = () => ammoEdit(null);
ACT["ammo-edit"] = (id) => ammoEdit(id);

function ammoEdit(id) {
  const a = id ? ammoOf(id) : { caliber: "", brand: "", type: "", grains: null,
    qtyBoxed: 0, qtyLoose: 0, location: "", notes: "", ref10G: null };
  const cals = Array.from(new Set(S.ammo.map((x) => x.caliber))).filter(Boolean);
  openSheet(id ? "Edit line" : "Add ammunition", `
    <div class="f2">
      <label class="f"><span>Caliber</span><input name="caliber" value="${esc(a.caliber)}" list="acal">
        <datalist id="acal">${cals.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
      <label class="f"><span>Brand</span><input name="brand" value="${esc(a.brand)}"></label>
      <label class="f"><span>Bullet type</span><input name="type" value="${esc(a.type)}" placeholder="FMJ, OTM, HPBT"></label>
      <label class="f"><span>Weight (gr)</span><input type="number" name="grains" value="${a.grains == null ? "" : a.grains}"></label>
    </div>
    <fieldset><legend>Counts</legend><div class="f2">
      <label class="f"><span>Boxed</span><input type="number" name="qtyBoxed" value="${int(a.qtyBoxed)}"></label>
      <label class="f"><span>Loose</span><input type="number" name="qtyLoose" value="${int(a.qtyLoose)}"></label>
    </div></fieldset>
    <label class="f"><span>Where it lives</span><input name="location" value="${esc(a.location || "")}" placeholder="bang box, ammo can 2, safe"></label>
    <label class="f"><span>Weight of 10 rounds (g)</span><input type="number" step="0.1" name="ref10G" value="${a.ref10G == null ? "" : a.ref10G}">
      </label><p class="hint" style="margin:-6px 0 12px">Used by the weight counter. Weigh ten and enter the grams.</p>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(a.notes || "")}</textarea></label>
    <button class="btn pri wide" data-act="ammo-save" data-id="${esc(id || "")}">${id ? "Save changes" : "Add line"}</button>`);
}

ACT["ammo-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.brand || "").trim() || !String(v.caliber || "").trim()) {
    toast("Caliber and brand are both needed."); return;
  }
  const isNew = !id;
  snapshot(isNew ? "add ammo line" : "edit " + v.brand);
  const a = isNew ? { id: uid("a") } : ammoOf(id);
  Object.assign(a, {
    caliber: String(v.caliber).trim(), brand: String(v.brand).trim(),
    type: v.type || "", grains: v.grains == null ? null : n(v.grains),
    qtyBoxed: int(v.qtyBoxed), qtyLoose: int(v.qtyLoose),
    location: v.location || "", notes: v.notes || "",
    ref10G: v.ref10G == null ? null : n(v.ref10G),
  });
  if (isNew) S.ammo.push(a);
  commit(isNew ? "Line added." : "Saved."); closeSheet();
};

ACT["ammo-del"] = (id) => {
  const a = ammoOf(id);
  const ld = S.magLoads.filter((l) => l.ammoId === id);
  if (ld.length && !confirm(`${ammoLabel(a)} is loaded into ${plural(ld.length, "magazine")}. Delete the line and those loads?`)) return;
  if (!ld.length && !confirm(`Delete ${ammoLabel(a)}?`)) return;
  snapshot("delete " + ammoLabel(a));
  S.ammo = S.ammo.filter((x) => x.id !== id);
  S.magLoads = S.magLoads.filter((l) => l.ammoId !== id);
  commit("Deleted."); closeSheet();
};

/* ============================================================ MAGS ====== */
function magLoadRow(l, onTrip) {
  const m = magType(l.magTypeId), a = ammoOf(l.ammoId);
  return `<button class="row" data-act="mag-loadopen" data-id="${esc(l.id)}">
    <span class="grow"><span class="ttl">${esc(magLabel(m))}</span>
    <span class="meta">${esc(a ? ammoLabel(a) : "ammo line missing")}</span></span>
    ${onTrip.has(l.id) ? `<span class="tag">packed</span>` : ""}
    ${m ? "" : `<span class="tag flag">no type</span>`}
    <span class="num" style="font-weight:550">${fmt(l.rounds)}</span>
    <span class="chev">&rsaquo;</span></button>`;
}

function magTypeRow(m) {
  const used = magsInUse(m.id), free = magsFree(m);
  return `<button class="row" data-act="magtype-open" data-id="${esc(m.id)}">
    <span class="grow"><span class="ttl">${esc(m.label)}${m.capacity
      ? ` <span class="num" style="color:var(--ink-2);font-weight:400">${m.capacity}rd</span>` : ""}</span>
    <span class="meta">${fmt(free)} free of ${fmt(m.quantity)}${used ? ` \u00b7 ${fmt(used)} loaded` : ""}${
      m.capacity ? "" : " \u00b7 no capacity set"}</span></span>
    <span class="chev">&rsaquo;</span></button>`;
}

RENDER.mags = function () {
  const onTrip = magsOnTrip();
  const loaded = S.magLoads.slice().sort((a, b) => int(b.rounds) - int(a.rounds));
  const loadedGroups = byCaliber(loaded, (l) => {
    const a = ammoOf(l.ammoId);
    return a ? a.caliber : "Caliber not set";
  });

  let h = treeSection({
    scope: "mags-loaded",
    title: "Loaded now",
    actions: [{ label: "Order", act: "cal-order" }, { label: "Load", act: "mag-load" }],
    hint: loaded.length
      ? `${plural(loaded.length, "magazine")} holding ${fmt(loaded.reduce((t, l) => t + int(l.rounds), 0))} rounds.`
      : "",
    empty: emptyState("No magazines loaded",
      "Loading moves rounds out of boxed or loose and into a magazine.",
      "Load magazines", "mag-load"),
    branches: loadedGroups.map(([cal, items]) => {
      const noType = items.filter((l) => !l.magTypeId).length;
      const packed = items.filter((l) => onTrip.has(l.id)).length;
      return {
        key: cal,
        name: cal,
        sub: `${fmt(items.reduce((t, l) => t + int(l.rounds), 0))} rounds`
          + (packed ? ` \u00b7 ${packed} packed` : ""),
        count: items.length,
        tag: noType ? `<span class="tag flag">${noType} no type</span>` : "",
        body: () => `<div class="rows">${items.map((l) => magLoadRow(l, onTrip)).join("")}</div>`,
      };
    }),
  });

  const ownedGroups = byCaliber(S.magTypes, (m) => m.group || "Ungrouped");
  h += treeSection({
    scope: "mags-owned",
    title: "Owned",
    actions: [{ label: "Add type", act: "magtype-new" }],
    empty: emptyState("No magazine types",
      "Add each type you own with its capacity and how many you have.",
      "Add a type", "magtype-new"),
    branches: ownedGroups.map(([cal, items]) => {
      const own = items.reduce((t, m) => t + int(m.quantity), 0);
      const free = items.reduce((t, m) => t + magsFree(m), 0);
      const nocap = items.filter((m) => !m.capacity).length;
      return {
        key: cal,
        name: cal,
        sub: `${fmt(own)} owned \u00b7 ${fmt(free)} free`,
        count: items.length,
        tag: nocap ? `<span class="tag flag">${nocap} no capacity</span>` : "",
        body: () => `<div class="rows">${items.map(magTypeRow).join("")}</div>`,
      };
    }),
  });
  return h;
};

/* ---- loading: the loose/boxed -> magazine migration ---- */
ACT["mag-load"] = (ammoId) => {
  if (!S.ammo.length) { toast("Add an ammunition line first."); return; }
  const a = ammoId ? ammoOf(ammoId) : S.ammo[0];
  magLoadForm(a.id);
};

function magLoadForm(ammoId) {
  const a = ammoOf(ammoId);
  const avail = S.magTypes.filter((m) => magsFree(m) > 0);
  const pool = avail.filter((m) => m.group === a.caliber);
  const list = pool.length ? pool : avail;
  const def = list[0];
  openSheet("Load magazines", `
    <label class="f"><span>Ammunition</span>
      <select name="ammoId" data-act-change="mag-load-reload">${selOptsGrouped(
        S.ammo, a.id, ammoLabel, (x) => x.caliber)}</select></label>
    <p class="hint" style="margin:-4px 0 12px">${fmt(a.qtyBoxed)} boxed, ${fmt(a.qtyLoose)} loose available.</p>
    ${list.length ? `
    <label class="f"><span>Magazine type</span>
      <select name="magTypeId" data-act-change="mag-cap">${selOpts(list, def ? def.id : "",
        (m) => `${m.label}${m.capacity ? " " + m.capacity + "rd" : ""} \u2014 ${magsFree(m)} free`)}</select></label>
    <div class="f2">
      <label class="f"><span>Rounds in each</span>${stepper("each", def && def.capacity ? def.capacity : 30, 1)}</label>
      <label class="f"><span>How many magazines</span>${stepper("count", 1, 1)}</label>
    </div>
    <label class="f"><span>Take rounds from</span><select name="src">
      <option value="loose">Loose (${fmt(a.qtyLoose)})</option>
      <option value="boxed">Boxed (${fmt(a.qtyBoxed)})</option></select></label>
    <button class="btn pri wide" data-act="mag-load-go">Load magazines</button>`
    : `<div class="note flag">Every magazine you own is already loaded. Unload one first,
        or raise a quantity under Owned.</div>`}`);
}

/* Default a fresh magazine to its full capacity when the type changes. */
ACT["mag-cap"] = () => {
  const v = readForm($("#sheetbody"));
  const m = magType(v.magTypeId);
  const inp = $('input[name="each"]', $("#sheetbody"));
  if (m && m.capacity && inp) inp.value = m.capacity;
};

ACT["mag-load-reload"] = () => {
  const v = readForm($("#sheetbody"));
  magLoadForm(v.ammoId);
};

ACT["mag-load-go"] = () => {
  const v = readForm($("#sheetbody"));
  const a = ammoOf(v.ammoId), m = magType(v.magTypeId);
  const each = int(v.each), count = int(v.count);
  if (!a || !m) { toast("Pick an ammunition line and a magazine type."); return; }
  if (each <= 0 || count <= 0) { toast("Rounds and magazine count must be above zero."); return; }
  if (count > magsFree(m)) { toast(`Only ${fmt(magsFree(m))} ${m.label} free.`); return; }
  if (m.capacity && each > m.capacity) { toast(`A ${m.label} holds ${m.capacity}.`); return; }
  const need = each * count;
  const have = v.src === "boxed" ? int(a.qtyBoxed) : int(a.qtyLoose);
  if (need > have) { toast(`That needs ${fmt(need)} but only ${fmt(have)} are ${v.src}.`); return; }

  snapshot(`load ${count}\u00d7 ${m.label}`);
  if (v.src === "boxed") a.qtyBoxed = int(a.qtyBoxed) - need;
  else a.qtyLoose = int(a.qtyLoose) - need;
  for (let i = 0; i < count; i++) {
    S.magLoads.push({ id: uid("ml"), magTypeId: m.id, ammoId: a.id,
      rounds: each, loadedOn: today(), notes: "" });
  }
  commit(`${plural(count, "magazine")} loaded with ${fmt(need)} rounds.`);
  closeSheet();
};

ACT["mag-loadopen"] = (id) => {
  const l = byId(S.magLoads, id);
  if (!l) return;
  const m = magType(l.magTypeId), a = ammoOf(l.ammoId);
  const packed = magsOnTrip().has(l.id);
  const free = S.magTypes.filter((x) => magsFree(x) > 0 || x.id === l.magTypeId);
  openSheet(magLabel(m), `
    ${packed ? `<div class="note">This magazine is packed for the open trip. Changing it
      here will not match what you carried.</div>` : ""}
    ${l.notes ? `<div class="note">${esc(l.notes)}</div>` : ""}
    <dl class="card"><div class="kv"><dt>Ammunition</dt><dd style="font-family:var(--sans)">${esc(a ? ammoFull(a) : "missing")}</dd></div>
      <div class="kv"><dt>Rounds</dt><dd>${fmt(l.rounds)}</dd></div>
      <div class="kv"><dt>Loaded on</dt><dd>${esc(dshow(l.loadedOn))}</dd></div></dl>
    <label class="f" style="margin-top:12px"><span>Correct the round count</span>${stepper("rounds", l.rounds, 0)}</label>
    <label class="f"><span>Magazine type</span><select name="magTypeId">
      <option value="">Unassigned</option>${selOpts(free, l.magTypeId, magLabel)}</select></label>
    <div class="btnrow split" style="margin-top:8px">
      <button class="btn" data-act="mag-loadsave" data-id="${esc(id)}">Save</button>
      <button class="btn ${l.magTypeId ? "pri" : ""}" data-act="mag-unload" data-id="${esc(id)}">Unload</button></div>
    <button class="btn ${l.magTypeId ? "" : "pri"} wide" style="margin-top:8px"
      data-act="mag-split" data-id="${esc(id)}">Split into separate magazines</button>`);
};

ACT["mag-loadsave"] = (id) => {
  const v = readForm($("#sheetbody"));
  const l = byId(S.magLoads, id);
  const m = v.magTypeId ? magType(v.magTypeId) : null;
  if (m && m.capacity && int(v.rounds) > m.capacity) { toast(`A ${m.label} holds ${m.capacity}.`); return; }
  snapshot("edit loaded magazine");
  l.rounds = int(v.rounds);
  l.magTypeId = v.magTypeId || null;
  if (l.rounds === 0) S.magLoads = S.magLoads.filter((x) => x.id !== id);
  commit("Saved."); closeSheet();
};

ACT["mag-unload"] = (id) => {
  const l = byId(S.magLoads, id);
  const a = ammoOf(l.ammoId);
  openSheet("Unload magazine", `<p class="hint">Moves ${fmt(l.rounds)} rounds of
    ${esc(a ? ammoLabel(a) : "this ammunition")} back into stock and frees the magazine.</p>
    <label class="f"><span>Put the rounds back as</span><select name="dest">
      <option value="loose">Loose</option><option value="boxed">Boxed</option></select></label>
    <button class="btn pri wide" data-act="mag-unload-go" data-id="${esc(id)}">Unload</button>`);
};
ACT["mag-unload-go"] = (id) => {
  const v = readForm($("#sheetbody"));
  const l = byId(S.magLoads, id);
  const a = ammoOf(l.ammoId);
  snapshot("unload magazine");
  if (a) {
    if (v.dest === "boxed") a.qtyBoxed = int(a.qtyBoxed) + int(l.rounds);
    else a.qtyLoose = int(a.qtyLoose) + int(l.rounds);
  }
  S.magLoads = S.magLoads.filter((x) => x.id !== id);
  commit(`${fmt(l.rounds)} rounds back in stock.`); closeSheet();
};

/* Break one block of loaded rounds into individual magazines of a chosen type.
   This is how the spreadsheet's bare "loaded" figures become real magazines. */
ACT["mag-split"] = (id) => {
  const l = byId(S.magLoads, id);
  if (!l) return;
  const a = ammoOf(l.ammoId);
  const cal = a ? a.caliber : "";
  let pool = S.magTypes.filter((m) => magsFree(m) > 0 && m.group === cal);
  if (!pool.length) pool = S.magTypes.filter((m) => magsFree(m) > 0);
  if (!pool.length) {
    openSheet("No free magazines", `<div class="note flag">Every magazine you own is
      already loaded, so there is nothing to split these ${fmt(l.rounds)} rounds into.
      Raise a quantity under Owned first.</div>
      <button class="btn wide" data-act="sheet-close">Close</button>`);
    return;
  }
  const def = pool[0];
  openSheet("Split into magazines", `
    <p class="hint">${fmt(l.rounds)} rounds of ${esc(a ? ammoLabel(a) : "this ammunition")}
      ${l.magTypeId ? `currently recorded as one ${esc(magLabel(magType(l.magTypeId)))}` : "with no magazine type"}.
      Pick a type and how many rounds go in each.</p>
    <label class="f"><span>Magazine type</span>
      <select name="magTypeId" data-act-change="mag-split-preview">${selOptsGrouped(
        pool, def.id, (m) => `${m.label}${m.capacity ? " " + m.capacity + "rd" : ""} \u2014 ${magsFree(m)} free`,
        (m) => m.group || "Other")}</select></label>
    <label class="f"><span>Rounds in each</span>${stepper("each", def.capacity || 30, 1)}</label>
    <div id="splitprev"></div>
    <button class="btn pri wide" style="margin-top:4px" data-act="mag-split-go" data-id="${esc(id)}">Split</button>`,
    () => splitPreview(id));
};

function splitPreview(id) {
  const l = byId(S.magLoads, id);
  const v = readForm($("#sheetbody"));
  const m = magType(v.magTypeId);
  const each = int(v.each);
  const box = $("#splitprev");
  if (!box || !m || each <= 0) return;
  const full = Math.floor(int(l.rounds) / each);
  const rem = int(l.rounds) % each;
  const need = full + (rem ? 1 : 0);
  const free = magsFree(m) + (l.magTypeId === m.id ? 1 : 0);
  const overCap = m.capacity && each > m.capacity;
  box.innerHTML = overCap
    ? `<div class="note flag">A ${esc(m.label)} holds ${m.capacity} rounds.</div>`
    : need > free
      ? `<div class="note flag">That needs ${plural(need, "magazine")} but only
         ${fmt(free)} ${esc(m.label)} ${free === 1 ? "is" : "are"} free.</div>`
      : `<div class="note">${plural(full, "magazine")} of ${fmt(each)}${rem
          ? `, plus one holding ${fmt(rem)}` : ""}. ${plural(need, "magazine")} used of
          ${fmt(free)} free.</div>`;
}

ACT["mag-split-preview"] = () => {
  const btn = $('[data-act="mag-split-go"]', $("#sheetbody"));
  const m = magType(readForm($("#sheetbody")).magTypeId);
  const inp = $('input[name="each"]', $("#sheetbody"));
  if (m && m.capacity && inp) inp.value = m.capacity;
  if (btn) splitPreview(btn.dataset.id);
};

ACT["mag-split-go"] = (id) => {
  const l = byId(S.magLoads, id);
  const v = readForm($("#sheetbody"));
  const m = magType(v.magTypeId);
  const each = int(v.each);
  if (!m || each <= 0) { toast("Pick a type and a round count."); return; }
  if (m.capacity && each > m.capacity) { toast(`A ${m.label} holds ${m.capacity}.`); return; }
  const full = Math.floor(int(l.rounds) / each);
  const rem = int(l.rounds) % each;
  const need = full + (rem ? 1 : 0);
  const free = magsFree(m) + (l.magTypeId === m.id ? 1 : 0);
  if (!need) { toast("Fewer rounds than one magazine holds."); return; }
  if (need > free) { toast(`Needs ${plural(need, "magazine")}, only ${fmt(free)} free.`); return; }

  snapshot(`split ${fmt(l.rounds)} rounds into ${m.label}`);
  const made = [];
  for (let i = 0; i < full; i++) made.push(each);
  if (rem) made.push(rem);
  made.forEach((r) => S.magLoads.push({
    id: uid("ml"), magTypeId: m.id, ammoId: l.ammoId,
    rounds: r, loadedOn: l.loadedOn || null, notes: "",
  }));
  S.magLoads = S.magLoads.filter((x) => x.id !== id);
  commit(`Split into ${plural(made.length, "magazine")}.`); closeSheet();
};

/* ---- magazine types ---- */
ACT["magtype-new"] = () => magTypeEdit(null);
ACT["magtype-open"] = (id) => magTypeEdit(id);

function magTypeEdit(id) {
  const m = id ? magType(id) : { group: "", label: "", capacity: null, quantity: 1, notes: "" };
  const groups = Array.from(new Set(S.magTypes.map((x) => x.group))).filter(Boolean);
  const used = id ? magsInUse(id) : 0;
  openSheet(id ? m.label : "Add magazine type", `
    ${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ""}
    ${used ? `<p class="hint">${plural(used, "magazine")} of this type currently loaded.</p>` : ""}
    <div class="f2">
      <label class="f"><span>Fits</span><input name="group" value="${esc(m.group || "")}" list="mgrp" placeholder="5.56, 9mm, MP5">
        <datalist id="mgrp">${groups.map((g) => `<option value="${esc(g)}">`).join("")}</datalist></label>
      <label class="f"><span>Name</span><input name="label" value="${esc(m.label)}" placeholder="Pmag Gen3"></label>
      <label class="f"><span>Capacity</span><input type="number" name="capacity" value="${m.capacity == null ? "" : m.capacity}"></label>
      <label class="f"><span>How many owned</span><input type="number" name="quantity" value="${int(m.quantity)}"></label>
    </div>
    <button class="btn pri wide" data-act="magtype-save" data-id="${esc(id || "")}">${id ? "Save changes" : "Add type"}</button>
    ${id ? `<button class="btn dgr wide" style="margin-top:8px" data-act="magtype-del" data-id="${esc(id)}">Delete type</button>` : ""}`);
}

ACT["magtype-save"] = (id) => {
  const v = readForm($("#sheetbody"));
  if (!String(v.label || "").trim()) { toast("Name the magazine."); return; }
  const used = id ? magsInUse(id) : 0;
  if (int(v.quantity) < used) { toast(`${plural(used, "magazine")} of these are loaded. Unload first.`); return; }
  const isNew = !id;
  snapshot(isNew ? "add magazine type" : "edit " + v.label);
  const m = isNew ? { id: uid("m") } : magType(id);
  Object.assign(m, {
    group: v.group || "", label: String(v.label).trim(),
    capacity: v.capacity == null ? null : int(v.capacity),
    quantity: int(v.quantity), notes: v.capacity ? "" : (m.notes || ""),
  });
  if (isNew) S.magTypes.push(m);
  commit(isNew ? "Type added." : "Saved."); closeSheet();
};

ACT["magtype-del"] = (id) => {
  const m = magType(id);
  if (magsInUse(id)) { toast("Unload these magazines before deleting the type."); return; }
  if (!confirm(`Delete ${m.label}?`)) return;
  snapshot("delete " + m.label);
  S.magTypes = S.magTypes.filter((x) => x.id !== id);
  commit("Deleted."); closeSheet();
};
</script>
<script>
"use strict";
let RANGEMODE = "trip";

/* ============================================================ RANGE ===== */
RENDER.range = function () {
  const t = openTrip();
  if (!t) return rangeIdle();
  return RANGEMODE === "closeout" ? rangeCloseout(t) : rangePacking(t);
};

function rangeIdle() {
  let h = `<section class="blk"><h2>Range trips</h2>
    <p class="hint">Start a trip, pack what you are taking, then log what came back.
      The difference is what you fired, and everything updates in one step.</p>
    <button class="btn pri wide" data-act="trip-new">Start a trip</button></section>`;
  const closed = S.trips.filter((x) => x.status === "closed")
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (closed.length) {
    h += `<section class="blk"><h2>History</h2><div class="rows">` + closed.map((t) => {
      const fired = t.entries.reduce((s, e) => s + tripEntryFired(e).total, 0);
      const guns = new Set(t.entries.map((e) => e.firearmId)).size;
      return `<button class="row" data-act="trip-open" data-id="${esc(t.id)}">
        <span class="grow"><span class="ttl">${esc(t.location || "Range trip")}</span>
        <span class="meta">${esc(t.date)} \u00b7 ${plural(guns, "firearm")}</span></span>
        <span class="num" style="font-weight:550">${fmt(fired)}</span>
        <span class="chev">&rsaquo;</span></button>`;
    }).join("") + `</div>
    <p class="hint" style="margin-top:8px">Numbers shown are rounds fired.</p></section>`;
  }
  return h;
}

/* ---------------- packing ---------------- */
function rangePacking(t) {
  const packed = t.entries.reduce((s, e) => s + tripBrought(e), 0);
  let h = `<section class="blk"><div class="card" style="border-color:var(--brass)">
    <h2>${esc(t.location || "Range trip")}</h2>
    <p class="hint" style="margin:3px 0 0">${esc(t.date)} \u00b7 packing</p>
    <div class="counter" style="margin-top:8px"><span class="big">${fmt(packed)}</span>
      <span class="unit">rounds packed</span></div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn sm" data-act="trip-edit" data-id="${esc(t.id)}">Edit trip</button>
      <button class="btn sm dgr" data-act="trip-cancel" data-id="${esc(t.id)}">Cancel trip</button>
    </div></div></section>`;

  h += `<section class="blk"><h2>What you are taking
    <button class="btn sm" data-act="entry-new">Add</button></h2>`;
  if (!t.entries.length) {
    h += emptyState("Nothing packed", "Add a line for each firearm and ammunition pairing you are bringing.", "Add a line", "entry-new");
  } else {
    h += `<div class="rows">` + t.entries.map((e) => {
      const f = gun(e.firearmId), a = ammoOf(e.ammoId);
      const bits = [];
      if (int(e.broughtBoxed)) bits.push(`${fmt(e.broughtBoxed)} boxed`);
      if (int(e.broughtLoose)) bits.push(`${fmt(e.broughtLoose)} loose`);
      if ((e.mags || []).length) bits.push(`${plural(e.mags.length, "mag")}`);
      return `<button class="row" data-act="entry-open" data-id="${esc(e.id)}">
        <span class="grow"><span class="ttl">${esc(f ? f.name : "Firearm missing")}</span>
        <span class="meta">${esc(a ? ammoLabel(a) : "ammo missing")}${bits.length ? " \u00b7 " + esc(bits.join(", ")) : " \u00b7 nothing yet"}</span></span>
        <span class="num" style="font-weight:550">${fmt(tripBrought(e))}</span>
        <span class="chev">&rsaquo;</span></button>`;
    }).join("") + `</div>`;
  }
  h += `</section>`;

  if (t.entries.length) {
    h += `<section class="blk"><button class="btn pri wide" data-act="trip-closeout">Log what came back</button></section>`;
  }
  return h;
}

ACT["entry-new"] = () => entryForm(null);

let EDIT_ENTRY = null;

/* Magazines already loaded with this ammunition, minus any packed on another line. */
function entryCandidates(entryId, ammoId) {
  const t = openTrip();
  const e = entryId ? byId(t.entries, entryId) : null;
  const taken = magsOnTrip();
  (e && e.mags || []).forEach((g) => taken.delete(g.magLoadId));
  return S.magLoads.filter((l) => l.ammoId === ammoId && !taken.has(l.id));
}

/* Group identical magazines together so packing is "4 of these" rather than
   ticking four indistinguishable boxes. A partly used magazine has a different
   round count, so it forms its own group and stays visible. */
function magBuckets(candidates) {
  const map = new Map();
  candidates.forEach((l) => {
    const k = (l.magTypeId || "none") + ":" + int(l.rounds);
    if (!map.has(k)) map.set(k, { key: k, magTypeId: l.magTypeId || null, rounds: int(l.rounds), loads: [] });
    map.get(k).loads.push(l.id);
  });
  const arr = Array.from(map.values());
  arr.sort((a, b) => {
    const la = a.magTypeId ? magLabel(magType(a.magTypeId)) : "\uffff";
    const lb = b.magTypeId ? magLabel(magType(b.magTypeId)) : "\uffff";
    return la.localeCompare(lb) || b.rounds - a.rounds;
  });
  return arr;
}

function entryForm(entryId, override) {
  const t = openTrip();
  if (!S.firearms.length || !S.ammo.length) { toast("Add a firearm and an ammunition line first."); return; }
  EDIT_ENTRY = entryId || null;
  const e = entryId ? byId(t.entries, entryId) : null;
  const base = override || (e
    ? { firearmId: e.firearmId, ammoId: e.ammoId,
        broughtBoxed: int(e.broughtBoxed), broughtLoose: int(e.broughtLoose),
        chosen: (e.mags || []).map((g) => g.magLoadId) }
    : { firearmId: S.firearms[0].id, ammoId: null, broughtBoxed: 0, broughtLoose: 0, chosen: [] });

  const f = gun(base.firearmId);
  const cal = f ? f.caliber : "";
  let pool = AR_CALS.includes(cal)
    ? S.ammo.filter((a) => AR_CALS.includes(a.caliber))
    : S.ammo.filter((a) => a.caliber === cal);
  if (!pool.length) pool = S.ammo;
  let aid = base.ammoId;
  if (!pool.some((a) => a.id === aid)) aid = pool[0] && pool[0].id;
  const a = ammoOf(aid);

  const buckets = magBuckets(entryCandidates(entryId, aid));
  const chosen = new Set(base.chosen || []);
  const packedRounds = buckets.reduce((sum, b) => {
    const k = b.loads.filter((x) => chosen.has(x)).length;
    return sum + k * b.rounds;
  }, 0);

  openSheet(entryId ? "Edit line" : "Add a line", `
    <label class="f"><span>Firearm</span>
      <select name="firearmId" data-act-change="entry-reload">${selOptsGrouped(
        S.firearms, base.firearmId, (x) => x.name, (x) => x.caliber || "Caliber not set")}</select></label>
    <label class="f"><span>Ammunition</span>
      <select name="ammoId" data-act-change="entry-reload">${selOptsGrouped(
        pool, aid, ammoLabel, (x) => x.caliber)}</select></label>
    <p class="hint" style="margin:-4px 0 12px">${a ? `${fmt(a.qtyBoxed)} boxed, ${fmt(a.qtyLoose)} loose on the shelf.` : ""}</p>

    <fieldset><legend>Loose and boxed to bring</legend><div class="f2">
      <label class="f"><span>Boxed</span>${stepper("broughtBoxed", base.broughtBoxed)}</label>
      <label class="f"><span>Loose</span>${stepper("broughtLoose", base.broughtLoose)}</label>
    </div></fieldset>

    <fieldset><legend>Loaded magazines to bring${packedRounds ? ` \u2014 ${fmt(packedRounds)} rounds` : ""}</legend>
      ${buckets.length ? buckets.map((b) => {
        const m = b.magTypeId ? magType(b.magTypeId) : null;
        const sel = b.loads.filter((x) => chosen.has(x)).length;
        return `<div class="bucket">
          <div class="top">
            <b>${esc(m ? magLabel(m) : "Unassigned magazines")}</b>
            <span class="avail">${fmt(b.rounds)} rounds each</span>
          </div>
          <div class="ctl">
            ${stepper("bk_" + b.key, sel, 0)}
            <span class="of">of ${plural(b.loads.length, "mag")} loaded</span>
          </div>
          ${m ? "" : `<div class="hint" style="margin:6px 0 0">Carried over from the
            spreadsheet with no magazine type. <button class="linkbtn"
            data-act="mag-split" data-id="${esc(b.loads[0])}">Split into real magazines</button></div>`}
        </div>`;
      }).join("") : `<p class="hint" style="margin:0">No magazines are loaded with this ammunition.
        Load some from the Mags tab, or just bring boxed and loose rounds.</p>`}
    </fieldset>

    <button class="btn pri wide" data-act="entry-save" data-id="${esc(entryId || "")}">${entryId ? "Save line" : "Add line"}</button>
    ${entryId ? `<button class="btn dgr wide" style="margin-top:8px" data-act="entry-del" data-id="${esc(entryId)}">Remove line</button>` : ""}`);
}

/* Turn the bucket counts back into specific magazine records. */
function readChosenMags(entryId, ammoId, v) {
  const out = [];
  magBuckets(entryCandidates(entryId, ammoId)).forEach((b) => {
    const want = Math.min(int(v["bk_" + b.key]), b.loads.length);
    for (let i = 0; i < want; i++) out.push(b.loads[i]);
  });
  return out;
}

      return l ? { magLoadId: l.id, magTypeId: l.magTypeId,
        roundsOut: int(l.rounds), roundsBack: int(l.rounds) } : null;

    firearmId: v.firearmId, ammoId: v.ammoId,
    broughtBoxed: int(v.broughtBoxed), broughtLoose: int(v.broughtLoose),
    returnedBoxed: Math.min(e.returnedBoxed == null ? int(v.broughtBoxed) : int(e.returnedBoxed), int(v.broughtBoxed)),
    returnedLoose: Math.min(e.returnedLoose == null ? int(v.broughtLoose) : int(e.returnedLoose), int(v.broughtLoose)),
    mags,
  });
  if (!entryId) t.entries.push(e);
  commit(entryId ? "Line saved." : `Line packed: ${fmt(tripBrought(e))} rounds.`); closeSheet();

ACT["entry-del"] = (entryId) => {

/* ---------------- closeout ---------------- */
ACT["trip-closeout"] = () => {

function rangeCloseout(t) {
  const grand = t.entries.reduce((s, e) => s + tripEntryFired(e).total, 0);
  let h = `<section class="blk"><div class="card">
    <h2>What came back</h2>
    <p class="hint" style="margin:3px 0 0">${esc(t.location || "Range trip")} &middot; ${esc(t.date)}</p>
    <div class="counter" style="margin-top:8px"><span class="big" id="grandfired">${fmt(grand)}</span>
      <span class="unit">rounds fired</span></div>
    <p class="hint" style="margin:10px 0 0">Enter what you brought home. Everything left over
      counts as fired and gets deducted when you close out.</p>
    </div></section>`;

  h += t.entries.map((e) => {
    const f = gun(e.firearmId), a = ammoOf(e.ammoId);
    const fd = tripEntryFired(e);
    return `<section class="blk"><div class="card">
      <h3>${esc(f ? f.name : "Firearm missing")}</h3>
      <p class="hint" style="margin:2px 0 12px">${esc(a ? ammoFull(a) : "ammo missing")}
        &middot; packed ${fmt(tripBrought(e))}</p>

      ${(int(e.broughtBoxed) || int(e.broughtLoose)) ? `<div class="f2">
        ${int(e.broughtBoxed) ? `<label class="f"><span>Boxed back (took ${fmt(e.broughtBoxed)})</span>
          <input type="number" inputmode="numeric" data-e="${esc(e.id)}" data-k="returnedBoxed"
            value="${int(e.returnedBoxed)}" min="0"></label>` : ""}
        ${int(e.broughtLoose) ? `<label class="f"><span>Loose back (took ${fmt(e.broughtLoose)})</span>
          <input type="number" inputmode="numeric" data-e="${esc(e.id)}" data-k="returnedLoose"
            value="${int(e.returnedLoose)}" min="0"></label>` : ""}
      </div>` : ""}

      ${(e.mags || []).length ? `<fieldset><legend>Rounds left in each magazine</legend>
        ${e.mags.map((g, i) => {
          const m = magType(g.magTypeId);
          return `<div style="padding:10px 0;border-top:1px solid var(--rule-2)">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
              <b style="font-weight:550;font-size:0.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(magLabel(m))}</b>
              <span class="num" style="color:var(--ink-2);font-size:0.75rem;flex:none">took ${fmt(g.roundsOut)}</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:7px">
              <button class="btn sm" data-act="co-set" data-id="${esc(e.id)}" data-v="${i}:0">Empty</button>
              <button class="btn sm" data-act="co-set" data-id="${esc(e.id)}" data-v="${i}:full">Untouched</button>
              <input type="number" inputmode="numeric" style="flex:1;min-width:64px;text-align:center;min-height:34px;padding:4px 8px"
                data-e="${esc(e.id)}" data-mag="${i}" value="${int(g.roundsBack)}" min="0" max="${int(g.roundsOut)}"
                aria-label="Rounds left in ${esc(magLabel(m))}">

        }).join("")}
        <div class="btnrow" style="margin-top:10px">
          <button class="btn sm" data-act="co-all" data-id="${esc(e.id)}" data-v="0">All empty</button>
          <button class="btn sm" data-act="co-all" data-id="${esc(e.id)}" data-v="full">All untouched</button>
